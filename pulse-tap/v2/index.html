<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Pulse Tap v2.2 - ALLDAT</title>
  <style>
    :root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px)}
    html,body{overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:0;width:100%;height:100%;overflow:hidden;background:#050714;font-family:Arial,Helvetica,sans-serif}
    #game{width:100%;height:100%;touch-action:none}
    #error{display:none;position:fixed;inset:0;padding:28px;background:#080b1a;color:#fff;z-index:10;box-sizing:border-box}
    #error h1{font-size:24px;margin:0 0 12px;color:#ff4d8d} #error p{line-height:1.45;color:#cbd4ff;word-break:break-word}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="./timing.js?v=2.2"></script>
  <script src="./difficulty.js?v=2.2"></script>
  <script src="./ending.js?v=2.2"></script>
  <script src="./action.js?v=2.2"></script>
  <script src="./impact.js?v=2.2"></script>
</head>
<body>
<div id="game"></div><div id="error"><h1>Pulse Tap couldn't load this track.</h1><p id="errorText"></p></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const manifestUrl = params.get('track') || './alldat-analyzer-test.json';
  const debug = params.get('debug')==='1';
  const errorBox = document.getElementById('error');
  const errorText = document.getElementById('errorText');
  function fail(message){ errorText.textContent = message; errorBox.style.display='block'; }
  if (!manifestUrl) { fail('No Trackcade manifest URL was supplied. Add ?track=MANIFEST_URL to the engine URL.'); return; }

  const hex = (value, fallback) => {
    const v = String(value || fallback || '#ffffff').replace('#','');
    return Number.parseInt(v.length === 3 ? v.split('').map(c=>c+c).join('') : v, 16);
  };

  async function boot(){
    let track;
    try {
      const response = await fetch(manifestUrl, { cache:'no-store' });
      if (!response.ok) throw new Error(`Track manifest request failed with HTTP ${response.status}.`);
      track = await response.json();
    } catch (e) { fail(e.message || 'Unable to fetch the track manifest.'); return; }

    const required = ['artist','title','audioUrl'];
    const missing = required.filter(k => track[k] === undefined || track[k] === null || track[k] === '');
    if (missing.length) { fail(`The track manifest is missing: ${missing.join(', ')}.`); return; }

    let actionEvidence=null;
    const entry=track.pulseTapIntegration?.sourceEntry;
    const evidenceFile=entry==='alldat-auto-safe-v1.json'?'alldat-action-evidence-v22.json':entry==='cvb-gemf-auto-safe-v1.json'?'cvb-action-evidence-v22.json':null;
    if(evidenceFile){
      try{
        const url=new URL(evidenceFile,new URL(manifestUrl,location.href));url.searchParams.set('v','2.2');
        const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('Frozen action evidence could not load.');
        actionEvidence=PulseAction.validate(await r.json(),PulseTiming.createTiming(track).times,track.songLength);
      }catch(e){fail(e.message);return;}
    }

    const audio = new Audio();
    audio.src = new URL(track.audioUrl, new URL(manifestUrl, location.href)).href;
    audio.preload = 'auto';
    audio.crossOrigin = 'anonymous';

    const palette = track.palette || {};
    const C = {
      bg: hex(palette.skyTop, '#050714'),
      panel: hex(palette.roadAlt, '#11162f'),
      primary: hex(palette.primary, '#19e3ff'),
      secondary: hex(palette.secondary, '#ff2fb0'),
      gold: hex(palette.collectible, '#ffd147'),
      danger: hex(palette.hazard, '#ff4d6d'),
      white: 0xffffff,
      muted: 0xa7b0d8
    };

    const declaredLength = Number(track.songLength) || 0;
    const events = Array.isArray(track.events) ? track.events.slice().sort((a,b)=>(a.t||0)-(b.t||0)) : [];

    class PulseScene extends Phaser.Scene {
      constructor(){ super('pulse'); this.resetRun(); }

      resetRun(){
        this.started=false; this.finished=false; this.paused=false; this.score=0; this.combo=0; this.bestCombo=0;
        this.targets=[]; this.timing=PulseTiming.createTiming(track); this.hitWindow=0.30; this.lastPulseBeat=-1;
        this.lastHitDelta=null; this.section=null; this.sectionNumber=0; this.spawnedCount=0; this.maxTargets=0;
        this.selectedCount=0;this.skippedSelection=0;this.lastPosition=null;this.presentation=[];
        this.ending=PulseEnding.detect(track,audio.duration);
        this.buildActionPlan();this.lastHit=null;this.hitHistory=[];this.frameIntervals=[];this.lastFrameWall=null;
        const style=getComputedStyle(document.documentElement);this.insets={};
        for(const side of ['top','bottom','left','right'])this.insets[side]=parseFloat(style.getPropertyValue('--safe-'+side))||0;
      }

      buildActionPlan(){
        const times=this.timing.times||[];
        if(!this.timing.times&&Number.isFinite(this.ending.playableEndTime))for(let i=0;this.timing.timeAt(i)<this.ending.playableEndTime;i++)times.push(this.timing.timeAt(i));
        this.actionPlan=PulseAction.plan(times,this.ending.playableEndTime,track,actionEvidence,PulseDifficulty,t=>this.energyAt(t),this.ending.releaseGap);
      }

      create(){
        this.resetRun();
        audio.currentTime=0;
        const w=this.scale.width,h=this.scale.height;
        this.cameras.main.setBackgroundColor(C.bg);
        this.bg=this.add.graphics();
        this.fx=this.add.graphics();
        this.targetLayer=this.add.container();

        this.title=this.add.text(w/2,56,'PULSE TAP v2.2',{fontFamily:'Arial',fontSize:'28px',fontStyle:'bold',color:'#ffffff',stroke:'#000000',strokeThickness:3}).setOrigin(.5);
        this.song=this.add.text(w/2,92,`${track.artist} — ${track.title}`,{fontFamily:'Arial',fontSize:'16px',color:'#cbd4ff',align:'center',wordWrap:{width:w-48}}).setOrigin(.5);
        this.scoreText=this.add.text(20,20,'0',{fontFamily:'Arial',fontSize:'22px',fontStyle:'bold',color:'#ffffff'});
        this.comboText=this.add.text(w-20,22,'',{fontFamily:'Arial',fontSize:'18px',fontStyle:'bold',color:'#ffd147'}).setOrigin(1,0);
        this.status=this.add.text(w/2,h*.72,'TAP TO START',{fontFamily:'Arial',fontSize:'24px',fontStyle:'bold',color:'#19e3ff',stroke:'#000000',strokeThickness:4}).setOrigin(.5);
        this.help=this.add.text(w/2,h*.78,'Tap each pulse as the ring closes',{fontFamily:'Arial',fontSize:'15px',color:'#a7b0d8'}).setOrigin(.5);
        this.progressBg=this.add.rectangle(w/2,h-18,w-40,5,0x222944,.9);
        this.progress=this.add.rectangle(20,h-18,0,5,C.primary,1).setOrigin(0,.5);
        this.pauseHit=this.add.rectangle(w-44,h-58,56,56,C.panel,.95).setStrokeStyle(1,C.muted,.5).setInteractive({useHandCursor:true});
        this.pauseBtn=this.add.text(w-44,h-58,'II',{fontFamily:'Arial',fontSize:'28px',fontStyle:'bold',color:'#ffffff'}).setOrigin(.5);
        this.pauseHit.on('pointerdown',()=>this.togglePause());
        this.replayHit=this.add.rectangle(w/2,h*.86,180,54,C.panel,1).setStrokeStyle(2,C.primary).setInteractive({useHandCursor:true}).setVisible(false);
        this.replayText=this.add.text(w/2,h*.86,'REPLAY',{fontSize:'18px',fontStyle:'bold',color:'#19e3ff'}).setOrigin(.5).setVisible(false);
        this.replayHit.on('pointerdown',()=>{if(this.finished)this.scene.restart();});
        this.sectionText=this.add.text(w/2,117,'',{fontSize:'11px',color:'#a7b0d8'}).setOrigin(.5);
        if(debug)this.debugText=this.add.text(12,140,'',{fontFamily:'monospace',fontSize:'9px',color:'#cbd4ff',backgroundColor:'#080b1acc',padding:{x:5,y:4}}).setDepth(20);

        this.input.on('pointerdown',(p)=>{
          if (!this.started) { this.startRun(); return; }
          if (this.finished || this.paused) return;
          if (p.y > this.scale.height-100-this.insets.bottom && p.x > this.scale.width-90-this.insets.right) return;
          this.tryHit(p.x,p.y);
        });
        const resize=(size)=>this.relayout(size.width,size.height);
        this.scale.on('resize',resize);
        const ended=()=>this.finishRun();
        const audioError=()=>fail('The song audio could not be loaded from the manifest audioUrl.');
        audio.addEventListener('ended',ended);audio.addEventListener('error',audioError);
        this.events.once('shutdown',()=>{audio.pause();this.scale.off('resize',resize);audio.removeEventListener('ended',ended);audio.removeEventListener('error',audioError);});
        if(debug)window.pulseTapDebug={audio,scene:this,snapshot:()=>this.debugSnapshot(),candidates:(time=audio.currentTime,span=2)=>this.actionPlan.filter(r=>Math.abs(r.musicalImpactTime-time)<=span),hits:()=>this.hitHistory.slice()};
        this.relayout(w,h);this.showDebug();this.drawBackdrop(0);
      }

      relayout(w,h){
        this.title.setPosition(w/2,56); this.song.setPosition(w/2,92).setWordWrapWidth(w-48);
        this.comboText.setPosition(w-20,22); this.status.setPosition(w/2,h*.72); this.help.setPosition(w/2,h*.78);
        this.progressBg.setPosition(w/2,h-18).setSize(w-40,5); this.progress.setPosition(20,h-18);
        this.pauseBtn.setPosition(w-44-this.insets.right,h-58-this.insets.bottom);this.pauseHit.setPosition(this.pauseBtn.x,this.pauseBtn.y);
        this.progressBg.y=h-18-this.insets.bottom;this.progress.y=this.progressBg.y;
        this.title.y=56+this.insets.top;this.song.y=92+this.insets.top;
        this.scoreText.y=20+this.insets.top;this.comboText.y=22+this.insets.top;
        this.sectionText.setPosition(w/2,117+this.insets.top);
        this.replayHit.setPosition(w/2,h*.86-this.insets.bottom);this.replayText.setPosition(this.replayHit.x,this.replayHit.y);
      }

      async startRun(){
        if (this.started) return;
        this.started=true; this.status.setText(''); this.help.setText('');
        this.score=0; this.combo=0; this.bestCombo=0; this.targets=[];
        try { audio.currentTime=0; await audio.play(); }
        catch(e){ this.started=false; this.status.setText('TAP TO START'); this.help.setText('Audio playback was blocked — tap again'); return; }
      }

      togglePause(){
        if (!this.started || this.finished) return;
        this.paused=!this.paused;
        if(this.paused){ audio.pause(); this.status.setText('PAUSED'); this.help.setText('Tap Ⅱ to resume'); }
        else { audio.play().catch(()=>{this.paused=true;this.status.setText('PAUSED');this.help.setText('Tap Ⅱ to resume');}); this.status.setText(''); this.help.setText(''); }
      }

      energyAt(t){
        return PulseTiming.energyAt(track,t,declaredLength || audio.duration || 1);
      }

      spawnTarget(targetTime, accent=false, spawnAhead=.4, beatIndex=null, profile){
        if(!this.started||this.finished||!PulseEnding.canPlay(audio.currentTime,this.ending.playableEndTime)||!PulseEnding.targetFits(targetTime,profile.window,this.ending))return;
        const {x,y}=PulseDifficulty.position(this.selectedCount++,profile,this.scale.width,this.scale.height,this.lastPosition,this.insets);
        this.lastPosition={x,y,targetTime};
        const color=accent?C.secondary:C.primary;
        const core=this.add.circle(x,y,profile.radius,color,.12).setStrokeStyle(3,color,.45);
        const ring=this.add.circle(x,y,profile.radius*1.75,color,.02).setStrokeStyle(3,color,.45);
        const dot=this.add.circle(x,y,7,C.white,.15);
        const target={x,y,targetTime,musicalImpactTime:targetTime,presentationStartTime:targetTime-spawnAhead,presentationLead:spawnAhead,actualPresentationTime:audio.currentTime,spawnAhead,beatIndex,profile,core,ring,dot,color,hit:false,missed:false,impactPresented:false};
        this.targets.push(target);
        this.spawnedCount++;this.maxTargets=Math.max(this.maxTargets,this.targets.length);
        this.targetLayer.add([core,ring,dot]);
      }

      tryHit(x,y){
        const t=audio.currentTime;
        if(!this.started||this.finished||this.paused||!PulseEnding.canPlay(t,this.ending.playableEndTime))return;
        let best=null,bestDist=Infinity;
        for(const target of this.targets){
          if(target.hit||target.missed) continue;
          const d=Phaser.Math.Distance.Between(x,y,target.x,target.y);
          if(d<target.profile.hitRadius && d<bestDist){ best=target; bestDist=d; }
        }
        if(!best){ this.flashText('MISS',C.danger); this.combo=0; return; }
        this.lastHitDelta=t-best.musicalImpactTime;
        const delta=Math.abs(this.lastHitDelta);
        if(delta>best.profile.window){ this.flashText('EARLY / LATE',C.danger); this.combo=0; return; }
        best.hit=true;
        const judgement=PulseImpact.judge(t,best.musicalImpactTime,best.profile.window);
        const base=judgement.timingScore,label=judgement.label,color=label==='PERFECT'?C.gold:label==='GREAT'?C.primary:C.secondary;
        this.lastHit={actualHitTime:t,musicalImpactTime:best.musicalImpactTime,presentationStartTime:best.presentationStartTime,presentationLead:best.presentationLead,hitDelta:judgement.delta,timingScore:base,sourceIndex:best.beatIndex,stage:best.profile.name};
        this.hitHistory.push(this.lastHit);if(this.hitHistory.length>500)this.hitHistory.shift();
        this.combo++;
        this.bestCombo=Math.max(this.bestCombo,this.combo);
        const mult=Math.min(3,1+Math.floor(this.combo/10)*.25);
        this.score+=Math.round(base*mult);
        this.scoreText.setText(String(this.score));
        this.comboText.setText(this.combo>1?`${this.combo}x COMBO`: '');
        this.flashText(label,color,best.x,best.y-46);
        this.tweens.add({targets:[best.core,best.ring,best.dot],scale:1.7,alpha:0,duration:180,onComplete:()=>this.destroyTarget(best)});
      }

      destroyTarget(target){
        [target.core,target.ring,target.dot].forEach(o=>{if(o&&o.active)o.destroy();});
      }

      flashText(text,color,x=this.scale.width/2,y=this.scale.height*.62){
        if(this.finished||!PulseEnding.canPlay(audio.currentTime,this.ending.playableEndTime))return;
        const c='#'+color.toString(16).padStart(6,'0');
        const label=this.add.text(x,y,text,{fontFamily:'Arial',fontSize:'18px',fontStyle:'bold',color:c,stroke:'#000000',strokeThickness:3}).setOrigin(.5);
        this.presentation.push(label);
        this.tweens.add({targets:label,y:y-24,alpha:0,duration:420,onComplete:()=>label.destroy()});
      }

      drawBackdrop(t){
        const w=this.scale.width,h=this.scale.height, energy=this.energyAt(t);
        this.bg.clear();
        this.bg.fillStyle(C.bg,1).fillRect(0,0,w,h);
        this.bg.lineStyle(1,this.sectionNumber%2?C.secondary:C.primary,.08+.12*energy);
        const gap=42;
        for(let x=0;x<w;x+=gap)this.bg.lineBetween(x,120,x,h);
        for(let y=120;y<h;y+=gap)this.bg.lineBetween(0,y,w,y);
      }

      pulseBackdrop(t){
        const b=this.timing.indexAt(t);
        if(b<0 || b===this.lastPulseBeat) return;
        this.lastPulseBeat=b;
        const energy=this.energyAt(t); const color=C.primary;
        const ring=this.add.circle(this.scale.width/2,this.scale.height/2,40,color,0).setStrokeStyle(3,color,.35+energy*.25);
        this.presentation.push(ring);
        this.tweens.add({targets:ring,scale:8,alpha:0,duration:Math.max(260,this.timing.intervalAt(b)*650),onComplete:()=>ring.destroy()});
      }

      debugSnapshot(){
        const t=audio.currentTime,index=this.timing.indexAt(t)+1;
        const profile=PulseDifficulty.profile(t,this.ending.playableEndTime,this.energyAt(t));
        const nextTime=this.timing.timeAt(index);
        const selection={...(this.actionPlan[index]||PulseDifficulty.decision(index,nextTime??t,this.ending.playableEndTime,this.energyAt(nextTime??t),this.ending.releaseGap))};
        if(nextTime===null)selection.selected=false;
        const target=this.targets.find(x=>!x.hit&&!x.missed)||null;
        const selected=target?this.actionPlan[target.beatIndex]:this.actionPlan.find(r=>r.selected&&r.musicalImpactTime>=t);
        const inspect=selected?{...selected,audioTime:t,timeUntilImpact:selected.musicalImpactTime-t,actualPresentationTime:target?.actualPresentationTime??null,impactFrameTime:target?.impactFrameTime??null}:null;
        const intervals=this.frameIntervals;
        return {activeOrNext:inspect,lastHit:this.lastHit,nearbyCandidates:this.actionPlan.filter(r=>Math.abs(r.musicalImpactTime-(selected?.musicalImpactTime??t))<=1.5),latencyDiagnostics:{clock:'HTMLMediaElement.currentTime',offsetApplied:0,outputLatency:null,displayLatency:null,physicalLatencyMeasured:false,userAgent:navigator.userAgent,frameIntervalMs:intervals.length?intervals.reduce((a,b)=>a+b,0)/intervals.length:null,maxFrameIntervalMs:intervals.length?Math.max(...intervals):null,playbackRate:audio.playbackRate,readyState:audio.readyState,seeking:audio.seeking,visibility:document.visibilityState},rawAudioDuration:this.ending.rawDuration,playableEndTime:this.ending.playableEndTime,remainingPlayableTime:Math.max(0,this.ending.playableEndTime-t),endingSource:this.ending.source,endingReason:this.ending.reason,progress:profile.progress,difficultyStage:profile.name,selectionDensity:selection.density,beatSelected:selection.selected,hitWindow:profile.window,targetRadius:profile.radius,hitRadius:profile.hitRadius,maxTravel:profile.travel,skippedSelection:this.skippedSelection,audioTime:t,upcomingBeat:this.timing.timeAt(index),beatIndex:index,timingSource:this.timing.source,beatInterval:this.timing.intervalAt(index),energy:this.energyAt(t),sectionTimestamp:this.section?.t??null,hitDelta:this.lastHitDelta,spawnedTargets:this.spawnedCount,activeTargets:this.targets.length,maxTargets:this.maxTargets,skippedExpired:this.timing.skippedExpired,finished:this.finished};
      }

      showDebug(){
        if(!this.debugText)return;
        const d=this.debugSnapshot(),f=v=>v===null?'—':v.toFixed(3);
        const a=d.activeOrNext;
        this.debugText.setText(`v2.2 ${(d.progress*100).toFixed(1)}% ${d.difficultyStage}\nend ${f(d.playableEndTime)} audio ${f(d.audioTime)}\n${a?`prepare ${f(a.presentationStartTime)} lead ${f(a.presentationLead)}\nIMPACT ${f(a.musicalImpactTime)} in ${f(a.timeUntilImpact)}\n#${a.originalBeatIndex} salience ${f(a.actionSalience.total)}\n${a.selectionReason} low demand ${a.actionSalience.lowDemand}`:'no upcoming target'}\nhit ${d.lastHit?f(d.lastHit.actualHitTime):'--'} delta ${d.hitDelta===null?'--':(d.hitDelta*1000).toFixed(0)+'ms'}\ntiming points ${d.lastHit?d.lastHit.timingScore.toFixed(1):'--'}\nlatency unmeasured; offset 0\ninspect pulseTapDebug.candidates()/hits()`);

      }

      finishRun(){
        if(this.finished) return;
        this.finished=true;this.tweens.killAll();this.presentation.forEach(o=>{if(o.active)o.destroy();});this.presentation=[];
        this.targets.forEach(t=>this.destroyTarget(t));this.targets=[];
        this.pauseHit.disableInteractive().setVisible(false);this.pauseBtn.setVisible(false);
        this.replayHit.setVisible(true);this.replayText.setVisible(true);this.progress.width=this.scale.width-40;
        const bonus=Math.round((Number(track.finishBonus)||500) * Math.min(1.5,1+this.bestCombo/100));
        this.score+=bonus; this.scoreText.setText(String(this.score));
        this.status.setText('TRACK COMPLETE');
        this.help.setText(`Score ${this.score.toLocaleString()}  •  Best combo ${this.bestCombo}x\nTap REPLAY to reset`);
        this.showDebug();

      }

      update(){
        if(!this.started||this.finished||this.paused) return;
        const wall=performance.now();if(this.lastFrameWall!==null){this.frameIntervals.push(wall-this.lastFrameWall);if(this.frameIntervals.length>120)this.frameIntervals.shift();}this.lastFrameWall=wall;
        const t=audio.currentTime;
        const duration=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:declaredLength;
        if(duration!==this.ending.rawDuration){this.ending=PulseEnding.detect(track,duration);this.buildActionPlan();}
        if(!PulseEnding.canPlay(t,this.ending.playableEndTime)){this.finishRun();return;}
        this.presentation=this.presentation.filter(o=>o.active);
        const section=PulseTiming.sectionAt(events,t);
        if(section!==this.section){this.section=section;this.sectionNumber=events.filter(e=>e.kind==='section'&&e.t<=t).length;this.sectionText.setText(section?`PASSAGE ${this.sectionNumber}`:'');}
        this.drawBackdrop(t); this.pulseBackdrop(t);

        for(const next of this.timing.drain(t,this.ending.playableEndTime,.36,(_index,time)=>PulseDifficulty.profile(time,this.ending.playableEndTime,this.energyAt(time)).lead)){
          const d=this.actionPlan[next.index]||PulseDifficulty.decision(next.index,next.targetTime,this.ending.playableEndTime,this.energyAt(next.targetTime),this.ending.releaseGap);
          if(!d.selected){this.skippedSelection++;continue;}
          if(t>next.targetTime+d.window)continue;
          this.spawnTarget(next.targetTime,d.actionSalience?.total>=.50||next.index%4===0,next.spawnAhead,next.index,d);
        }

        for(const target of [...this.targets]){
          if(target.hit||target.missed) continue;
          const visual=PulseImpact.visual(t,target.musicalImpactTime,target.presentationLead);
          target.ring.setScale(visual.ringScale);target.core.setAlpha(visual.coreAlpha);target.dot.setAlpha(visual.dotAlpha);
          if(visual.atImpact&&!target.impactPresented){
            target.impactPresented=true;target.impactFrameTime=t;
            target.core.setStrokeStyle(4,target.color,1);target.ring.setStrokeStyle(4,target.color,1);
          }
          if(t>target.targetTime+target.profile.window){
            target.missed=true; this.combo=0; this.comboText.setText('');
            this.flashText('MISS',C.danger,target.x,target.y-42);
            this.tweens.add({targets:[target.core,target.ring,target.dot],alpha:0,duration:160,onComplete:()=>this.destroyTarget(target)});
          }
        }
        this.targets=this.targets.filter(x=>!(x.hit||x.missed) || (x.core&&x.core.active));
        this.showDebug();
        if(this.ending.playableEndTime>0)this.progress.width=(this.scale.width-40)*Phaser.Math.Clamp(t/this.ending.playableEndTime,0,1);
      }
    }

    new Phaser.Game({
      type: Phaser.AUTO,
      parent:'game',
      backgroundColor:'#050714',
      scene:[PulseScene],
      scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH,width:390,height:844},
      input:{activePointers:1},
      render:{antialias:true,pixelArt:false}
    });
  }
  boot();
})();
</script>
</body>
</html>
