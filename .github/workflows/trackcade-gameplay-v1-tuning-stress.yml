name: Trackcade Gameplay v1 — Tuning Stress

on:
  push:
    branches: [trackcade-gameplay-difficulty-v1]
    paths:
      - '.github/workflows/trackcade-gameplay-v1-tuning-stress.yml'
      - 'research/gameplay-v1/GAMEPLAY_TUNING_STRESS_SPEC.md'
      - 'research/gameplay-v1/run_tuning_stress_v1.mjs'
      - 'research/gameplay-v1/audit_gameplay_v1.mjs'
      - 'src/track/loader.js'
      - 'src/logic/director.js'
      - 'src/logic/difficulty.js'
      - 'src/logic/spawner.js'
      - 'src/track.config.js'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download exact closed Structure v1 safe manifests
        uses: actions/download-artifact@v4
        with:
          name: trackcade-structure-v1-safe-generated-manifests
          path: safe
          repository: 4everhumblepdx/trackcade-test
          run-id: 36281637484
          github-token: ${{ github.token }}

      - name: Materialize CVB minimal-tuning fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixtures evidence
          node --experimental-default-type=module --input-type=module <<'JS'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('safe/cvb-gemf-auto-safe-v1.json', 'utf8'));
          const keep = ['artist','title','audioUrl','bpm','beatOffset','songLength','events','energyCurve','generation'];
          const minimal = Object.fromEntries(keep.map(k => [k, source[k]]));
          fs.writeFileSync('fixtures/cvb-gemf-minimal.json', JSON.stringify(minimal, null, 2) + '\n');
          JS
          cat > evidence/provenance.json <<'JSON'
          {
            "structureSafeManifestRun": 36281637484,
            "structureSafeManifestArtifactId": 10918568524,
            "structureSafeManifestArtifactDigest": "sha256:10a67643cf985652c2a5974f59f0b95183ee0f2921253e525b8945eceae63c87",
            "analyzerSourceCommit": "e308d867980fb1877c3f2e4ce27950deecac0855",
            "analyzerRunnerSha256": "9d579842207a1482ef6d12d34d6d82d03b02021d88de65c19abaf41f8692f432",
            "stressPreregisteredCommit": "84efef63fa895af0001517f89c4f26621aa0f2b6"
          }
          JSON

      - name: Run complete preregistered matrix twice
        shell: bash
        run: |
          set -euo pipefail
          node research/gameplay-v1/run_tuning_stress_v1.mjs \
            --alldat safe/alldat-minimal-auto-safe-v1.json \
            --cvb fixtures/cvb-gemf-minimal.json \
            --output stress/a
          node research/gameplay-v1/run_tuning_stress_v1.mjs \
            --alldat safe/alldat-minimal-auto-safe-v1.json \
            --cvb fixtures/cvb-gemf-minimal.json \
            --output stress/b

      - name: Prove deterministic duplicate outputs
        shell: bash
        run: |
          set -euo pipefail
          diff -qr stress/a stress/b

      - name: Validate and summarize stress matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter

          p='stress/a/tuning-stress-summary.json'
          x=json.load(open(p))
          assert x['schema']=='trackcade-gameplay-tuning-stress-v1',x.get('schema')
          assert x['preregistration']['commit']=='84efef63fa895af0001517f89c4f26621aa0f2b6'
          assert x['preregistration']['expectedProfiles']==25
          assert x['preregistration']['expectedAudits']==50
          assert x['defaultReferencePassesBothFixtures'] is True
          assert len(x['profiles'])==25
          assert len({row['id'] for row in x['profiles']})==25
          assert sum(x['classificationCounts'].values())==25

          allowed_status={'qc_pass','pool_overflow_risk','needs_jump_aware_analysis','invalid_generation'}
          allowed_class={'cross_fixture_pass','fixture_sensitive','cross_fixture_fail'}
          for row in x['profiles']:
              assert row['classification'] in allowed_class,row
              assert set(row['fixtures'])=={'alldat','cvb-gemf'},row['id']
              for fixture in row['fixtures'].values():
                  assert fixture['status'] in allowed_status,(row['id'],fixture['status'])
                  assert fixture['runtime']['spawnMinGapZEnforcedByCurrentBeatSpawnPath'] is False
                  assert fixture['obstaclePoolCapacity']==28
                  assert fixture['pickupPoolCapacity']==24

          print('classificationCounts', x['classificationCounts'])
          for row in x['profiles']:
              print(row['id'], row['classification'], {
                  name: {
                      'status': f['status'],
                      'obstacles': f['obstaclePoolMax'],
                      'laneSlack': f['bottleneckSlackSeconds'],
                      'minLead': f['minLeadTime'],
                      'rows': f['rows'],
                  }
                  for name,f in row['fixtures'].items()
              })
          PY
          sha256sum stress/a/tuning-stress-summary.json
          find stress/a/audits -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > evidence/audit-sha256.txt
          sha256sum research/gameplay-v1/GAMEPLAY_TUNING_STRESS_SPEC.md research/gameplay-v1/run_tuning_stress_v1.mjs > evidence/stress-source-sha256.txt
          cat evidence/audit-sha256.txt
          cat evidence/stress-source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: trackcade-gameplay-v1-tuning-stress
          path: |
            stress/a/tuning-stress-summary.json
            stress/a/audits/**/*.json
            evidence/provenance.json
            evidence/audit-sha256.txt
            evidence/stress-source-sha256.txt
            research/gameplay-v1/GAMEPLAY_TUNING_STRESS_SPEC.md
            research/gameplay-v1/run_tuning_stress_v1.mjs
          if-no-files-found: error
          retention-days: 30
