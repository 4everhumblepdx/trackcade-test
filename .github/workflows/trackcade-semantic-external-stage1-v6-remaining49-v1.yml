name: Trackcade V6 — Remaining 49 — explicit paid activation only

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - research/semantic-external-holdout-v1/STAGE1_V6_REMAINING49_PROVIDER_ACTIVATE_V1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: trackcade-stage1-v6-remaining49-paid-v1
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/trackcade-semantic-external-holdout-v1' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUNNER: research/semantic-external-holdout-v1/run_stage1_v6_remaining49_case_v1.py
      AUTH_PATH: research/semantic-external-holdout-v1/STAGE1_V6_REMAINING49_PROVIDER_AUTHORIZATION_V1.json
      ACTIVATE_PATH: research/semantic-external-holdout-v1/STAGE1_V6_REMAINING49_PROVIDER_ACTIVATE_V1.json
      SOURCE_HEAD_SHA: a951a0ea2e993fade7d917e692da832138916916
      SOURCE_RUN_ID: '36747819119'
      SOURCE_ARTIFACT_ID: '11112534029'
      SOURCE_ARTIFACT_NAME: trackcade-semantic-external-stage1-v6-prep-v1
      SOURCE_ARTIFACT_DIGEST: sha256:0d586b737ba729a1386914663d92e7bae1fd85e404f1480e8f034084cbd80134
      SOURCE_MANIFEST_SHA256: ebdbf2232a813dbe89b87f4fb3bd938f037d6f15707943c2c0b639a15bc202c8
      SOURCE_FILES_SHA256: a8a81dca2fd4f9c5297ebbe594f5144f28f9ae2a7542066db3a3169cd07d1e35
      FLEX_HEAD_SHA: 274aa6681bef78a2e85014bd221fbce11c6bc232
      FLEX_RUN_ID: '36752768892'
      FLEX_ARTIFACT_ID: '11115940514'
      FLEX_ARTIFACT_NAME: trackcade-semantic-external-stage1-v6-flex8192-prep-v1
      FLEX_ARTIFACT_DIGEST: sha256:bb410bc03a2964f0251328e801a1782ad3e691b3c414db5d9e3f3c71db936a4b
      FLEX_MANIFEST_SHA256: de9328b8cba76b82f879e348cc0b0133d33f53d2855b67885d3ed2b96afb9058
      FLEX_FILES_SHA256: b272332f49f4da3ee72ac53dc89e6e544e76c609d03e9c7c7fe35ebc02da4777
      CANARY_RUN_ID: '36758887107'
      CANARY_ARTIFACT_ID: '11116764479'
      CANARY_ARTIFACT_NAME: trackcade-semantic-external-stage1-v6-canary-v1-case-01-completed-valid
      CANARY_ARTIFACT_DIGEST: sha256:18a1200c9f77f3cc74a7844680168e8f86c7cfdd6b13cc5c9da3a014fcffaf41

    steps:
      - name: Checkout exact activation commit with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows/trackcade-semantic-external-stage1-v6-remaining49-v1.yml
            research/learned-interpretation-v1/*.py
            research/semantic-external-holdout-v1/run_stage1_v6_remaining49_case_v1.py
            research/semantic-external-holdout-v1/collect_stage1_v6_results_v1.py
            research/semantic-external-holdout-v1/STAGE1_V6_REMAINING49_PROVIDER_AUTHORIZATION_V1.json
            research/semantic-external-holdout-v1/STAGE1_V6_REMAINING49_PROVIDER_ACTIVATE_V1.json
          sparse-checkout-cone-mode: false

      - name: Fail closed unless paid remaining49 authorization and activation are exact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test -f "${AUTH_PATH}"
          test -f "${ACTIVATE_PATH}"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${ACTIVATE_PATH}"
          for p in \
            research/learned-interpretation-v1/build_learned_request_v1.py \
            research/learned-interpretation-v1/build_learned_request_v2.py \
            research/learned-interpretation-v1/build_learned_request_v3.py \
            research/learned-interpretation-v1/build_learned_request_v5.py \
            research/learned-interpretation-v1/build_learned_request_v6.py \
            research/learned-interpretation-v1/validate_learned_proposal_v1.py \
            research/learned-interpretation-v1/validate_learned_proposal_v6.py \
            research/learned-interpretation-v1/validate_learned_proposal_v3.py \
            research/learned-interpretation-v1/openai_responses_adapter_v1.py \
            research/learned-interpretation-v1/openai_responses_adapter_v6.py; do
            test "$(git rev-parse HEAD:${p})" = "$(git rev-parse ${SOURCE_HEAD_SHA}:${p})"
          done
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          auth=json.load(open(os.environ['AUTH_PATH']))
          act=json.load(open(os.environ['ACTIVATE_PATH']))
          expected=list(range(2,51))
          contract={'provider':'openai','api':'responses','model':'gpt-6-sol','reasoningEffort':'high','maxOutputTokens':8192,'serviceTier':'flex','store':False}
          assert auth['schema']=='trackcade-semantic-external-stage1-v6-remaining49-provider-authorization-v1'
          assert auth['status']=='authorized-explicit-paid-remaining49'
          assert auth['authorized'] is True
          assert auth['ordinals']==expected
          assert auth['maximumInitialProviderAttempts']==49
          assert auth['attemptsPerOrdinal']==1
          assert auth['providerContract']==contract
          c=auth['frozenOrdinal1Canary']
          assert c['ordinal']==1 and c['artifactId']==int(os.environ['CANARY_ARTIFACT_ID'])
          assert c['artifactName']==os.environ['CANARY_ARTIFACT_NAME'] and c['artifactDigest']==os.environ['CANARY_ARTIFACT_DIGEST']
          assert c['reuseAsDevelopmentResponse'] is True and c['rerunOrdinal1Authorized'] is False
          rb=auth['researchBoundary']
          for key in ('automaticRetriesAuthorized','standardFallbackAuthorized','partialScoringAuthorized','stage1ReferenceAccessAuthorized','terminalHoldoutAccessAuthorized','compilerInvocationAuthorized','analyzerExecutionAuthorized','analyzerChangesAuthorized','semanticContractChangesAuthorized'):
            assert rb[key] is False, key
          assert rb['retryAfterAnyFailedOrInvalidOrdinalRequiresNewExplicitApproval'] is True
          assert act['schema']=='trackcade-semantic-external-stage1-v6-remaining49-provider-activation-v1'
          assert act['activatePaidRemaining49'] is True
          assert act['authorizationFile']==os.environ['AUTH_PATH']
          assert act['ordinals']==expected
          assert act['maximumProviderAttempts']==49 and act['attemptsPerOrdinal']==1
          assert act['automaticRetriesAuthorized'] is False and act['standardFallbackAuthorized'] is False
          assert act['partialScoringAuthorized'] is False and act['terminalHoldoutAccessAuthorized'] is False
          assert act['compilerInvocationAuthorized'] is False and act['analyzerExecutionAuthorized'] is False
          assert act['providerContract']==contract
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert act['executionSourceCommit']==parent
          assert act['executionWorkflowSha256']==hashlib.sha256(pathlib.Path('.github/workflows/trackcade-semantic-external-stage1-v6-remaining49-v1.yml').read_bytes()).hexdigest()
          assert act['runnerSha256']==hashlib.sha256(pathlib.Path(os.environ['RUNNER']).read_bytes()).hexdigest()
          assert act['stage1ReferenceOpeningAuthorized'] is False
          assert act['analyzerChangesAuthorized'] is False and act['semanticContractChangesAuthorized'] is False
          auth_commit=act['authorizationCommit']
          subprocess.run(['git','cat-file','-e',f'{auth_commit}^{{commit}}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',auth_commit,parent],check=True)
          assert auth_commit != subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          historical=subprocess.check_output(['git','show',f'{auth_commit}:{os.environ["AUTH_PATH"]}'],text=True)
          assert json.loads(historical)==auth
          print('Explicit V6 remaining49 authorization and separate activation verified')
          PY

      - name: Verify immutable prep and frozen ordinal-1 canary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          specs=[
            ('SOURCE','SOURCE_ARTIFACT_ID','SOURCE_ARTIFACT_NAME','SOURCE_ARTIFACT_DIGEST','SOURCE_RUN_ID','SOURCE_HEAD_SHA'),
            ('FLEX','FLEX_ARTIFACT_ID','FLEX_ARTIFACT_NAME','FLEX_ARTIFACT_DIGEST','FLEX_RUN_ID','FLEX_HEAD_SHA'),
          ]
          for label,idk,namek,digestk,runk,headk in specs:
            m=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/artifacts/{os.environ[idk]}"],text=True))
            assert m['id']==int(os.environ[idk]), (label,'id')
            assert m['name']==os.environ[namek], (label,'name')
            assert m['digest']==os.environ[digestk], (label,'digest')
            assert m['expired'] is False, (label,'expired')
            assert m['workflow_run']['id']==int(os.environ[runk]), (label,'run')
            assert m['workflow_run']['head_sha']==os.environ[headk], (label,'head')
          c=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/artifacts/{os.environ['CANARY_ARTIFACT_ID']}"],text=True))
          assert c['id']==int(os.environ['CANARY_ARTIFACT_ID'])
          assert c['name']==os.environ['CANARY_ARTIFACT_NAME'] and c['digest']==os.environ['CANARY_ARTIFACT_DIGEST']
          assert c['expired'] is False and c['workflow_run']['id']==int(os.environ['CANARY_RUN_ID'])
          print('Frozen V6 prep plus ordinal-1 canary verified')
          PY

      - name: Refuse any earlier remaining49 workflow execution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/trackcade-semantic-external-stage1-v6-remaining49-v1.yml/runs?per_page=100" > /tmp/v6-remaining49-run-history.json
          python - <<'PY'
          import json, os
          pages=json.load(open('/tmp/v6-remaining49-run-history.json'))
          runs=[r for page in pages for r in page['workflow_runs']]
          assert all(r['id']==int(os.environ['GITHUB_RUN_ID']) for r in runs), 'Prior remaining49 execution exists: stop; no resume or retry is authorized.'
          PY

      - name: Download exact frozen V6 semantic prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: /tmp/trackcade-v6-prep
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download exact frozen V6 Flex 8192 prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLEX_ARTIFACT_NAME }}
          path: /tmp/trackcade-v6-flex8192-prep
          github-token: ${{ github.token }}
          run-id: ${{ env.FLEX_RUN_ID }}

      - name: Verify frozen prep closures without credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test ! -e research/semantic-external-holdout-v1/REFERENCE_DROPS_V3.json
          echo "${SOURCE_MANIFEST_SHA256}  /tmp/trackcade-v6-prep/STAGE1_V6_PREP_MANIFEST_V1.json" | sha256sum -c -
          echo "${SOURCE_FILES_SHA256}  /tmp/trackcade-v6-prep/FILES_SHA256.txt" | sha256sum -c -
          echo "${FLEX_MANIFEST_SHA256}  /tmp/trackcade-v6-flex8192-prep/STAGE1_V6_FLEX8192_PREP_MANIFEST_V1.json" | sha256sum -c -
          echo "${FLEX_FILES_SHA256}  /tmp/trackcade-v6-flex8192-prep/FILES_SHA256.txt" | sha256sum -c -

      # Explicit sequential steps, rather than a matrix: upload lock, attempt,
      # upload result, verify completion. Any failure skips every later ordinal.

      - name: Reserve ordinal 2 offline after rejecting all prior evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          for suffix in attempt-lock completed-valid attempted-no-valid-response local-no-provider-attempt reserved-no-final-status; do
            name="trackcade-semantic-external-stage1-v6-remaining49-v1-case-02-${suffix}"
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" --jq '.total_count')"
            test "$count" = '0'
          done
          python "$RUNNER" --mode prepare --ordinal 2 --source-root /tmp/trackcade-v6-prep --flex-root /tmp/trackcade-v6-flex8192-prep --output-dir /tmp/v6-case-02 --harness-commit "$GITHUB_SHA" --validator research/learned-interpretation-v1/validate_learned_proposal_v6.py --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v6-lock-02/attempt-lock.json

      - name: Persist ordinal 2 reservation before exposing provider credentials
        id: lock_02
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v6-remaining49-v1-case-02-attempt-lock
          path: /tmp/v6-lock-02/attempt-lock.json
          if-no-files-found: error
          retention-days: 90

      - name: One ordinal 2 attempt using the canonical runner
        id: run_02
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOCK_ARTIFACT_ID: ${{ steps.lock_02.outputs.artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCK_ARTIFACT_ID}" > /tmp/v6-lock-02/uploaded-artifact.json
          python "$RUNNER" --mode run --ordinal 2 --source-root /tmp/trackcade-v6-prep --flex-root /tmp/trackcade-v6-flex8192-prep --output-dir /tmp/v6-case-02 --harness-commit "$GITHUB_SHA" --validator research/learned-interpretation-v1/validate_learned_proposal_v6.py --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v6-lock-02/attempt-lock.json --uploaded-lock /tmp/v6-lock-02/uploaded-artifact.json

      - name: Persist ordinal 2 result before continuing
        id: result_02
        if: always() && steps.run_02.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v6-remaining49-v1-case-02-${{ steps.run_02.outputs.artifact_outcome || 'reserved-no-final-status' }}
          path: /tmp/v6-case-02
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Fail closed unless ordinal 2 completed and evidence was uploaded
        if: always() && steps.run_02.outcome != 'skipped'
        shell: bash
        env:
          RESULT_UPLOAD_OUTCOME: ${{ steps.result_02.outcome }}
          RESULT_ARTIFACT_ID: ${{ steps.result_02.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test "$RESULT_UPLOAD_OUTCOME" = 'success'
          test -n "$RESULT_ARTIFACT_ID"
          python "$RUNNER" --mode check --ordinal 2 --source-root /tmp/trackcade-v6-prep --flex-root /tmp/trackcade-v6-flex8192-prep --output-dir /tmp/v6-case-02 --harness-commit "$GITHUB_SHA" --validator research/learned-interpretation-v1/validate_learned_proposal_v6.py --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v6-lock-02/attempt-lock.json

      - name: Reserve ordinal 3 offline after rejecting all prior evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          for suffix in attempt-lock completed-valid attempted-no-valid-response local-no-provider-attempt reserved-no-final-status; do
            name="trackcade-semantic-external-stage1-v6-remaining49-v1-case-03-${suffix}"
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" --jq '.total_count')"
            test "$count" = '0'
          done
          python "$RUNNER" --mode prepare --ordinal 3 --source-root /tmp/trackcade-v6-prep --flex-root /tmp/trackcade-v6-flex8192-prep --output-dir /tmp/v6-case-03 --harness-commit "$GITHUB_SHA" --validator research/learned-interpretation-v1/validate_learned_proposal_v6.py --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v6-lock-03/attempt-lock.json

      - name: Persist ordinal 3 reservation before exposing provider credentials
        id: lock_03
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v6-remaining49-v1-case-03-attempt-lock
          path: /tmp/v6-lock-03/attempt-lock.json
          if-no-files-found: error
          retention-days: 90

      - name: One ordinal 3 attempt using the canonical runner
        id: run_03
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOCK_ARTIFACT_ID: ${{ steps.lock_03.outputs.artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCK_ARTIFACT_ID}" > /tmp/v6-lock-03/uploaded-artifact.json
          python "$RUNNER" --mode run --ordinal 3 --source-root /tmp/trackcade-v6-prep --flex-root /tmp/trackcade-v6-flex8192-prep --output-dir /tmp/v6-case-03 --harness-commit "$GITHUB_SHA" --validator research/learned-interpretation-v1/validate_learned_proposal_v6.py --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v6-lock-03/attempt-lock.json --uploaded-lock /tmp/v6-lock-03/uploaded-artifact.json

      - name: Persist ordinal 3 result before continuing
        id: result_03
        if: always() && steps.run_03.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v6-remaining49-v1-case-03-${{ steps.run_03.outputs.artifact_outcome || 'reserved-no-final-status' }}
          path: /tmp/v6-case-03
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Fail closed unless ordinal 3 completed and evidence was uploaded
        if: always() && steps.run_03.outcome != 'skipped'
        shell: bash
        env:
          RESULT_UPLOAD_OUTCOME: ${{ steps.result_03.outcome }}
          RESULT_ARTIFACT_ID: ${{ steps.result_03.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test "$RESULT_UPLOAD_OUTCOME" = 'success'
          test -n "$RESULT_ARTIFACT_ID"
          python "$RUNNER" --mode check --ordinal 3 --source-root /tmp/trackcade-v6-prep --flex-root /tmp/trackcade-v6-flex8192-prep --output-dir /tmp/v6-case-03 --harness-commit "$GITHUB_SHA" --validator research/learned-interpretation-v1/validate_learned_proposal_v6.py --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v6-lock-03/attempt-lock.json

      - name: Reserve ordinal 4 offline after rejecting all prior evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          for suffix in attempt-lock completed-valid attempted-no-valid-response local-no-provider-attempt reserved-no-final-status; do
            name="trackcade-semantic-external-stage1-v6-remaining49-v1-case-04-${suffix}"
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" --jq '.total_count')"
            test "$count" = '0'
          done
          python "$RUNNER" --mode prepare --ordinal 4 --source-root /tmp/trackcade-v6-prep --flex-root /tmp/trackcade-v6-flex8192-prep --output-dir /tmp/v6-case-04 --harness-commit "$GITHUB_SHA" --validator research/learned-interpretation-v1/validate_learned_proposal_v6.py --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v6-lock-04/attempt-lock.json

      - name: Persist ordinal 4 reservation before exposing provider credentials
        id: lock_04
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v6-remaining49-v1-case-04-attempt-lock
          path: /tmp/v6-lock-04/attempt-lock.json
          if-no-files-found: error
          retention-days: 90

      - name: One ordinal 4 attempt using the canonical runner
        id: run_04
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOCK_ARTIFACT_ID: ${{ steps.lock_04.outputs.artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCK_ARTIFACT_ID}" > /tmp/v6-lock-04/uploaded-artifact.json
          python "$RUNNER" --mode run --ordinal 4 --source-root /tmp/trackcade-v6-prep --flex-root /tmp/trackcade-v6-flex8192-prep --output-dir /tmp/v6-case-04 --harness-commit "$GITHUB_SHA" --validator research/learned-interpretation-v1/validate_learned_proposal_v6.py --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v6-lock-04/attempt-lock.json --uploaded-lock /tmp/v6-lock-04/uploaded-artifact.json

      - name: Persist ordinal 4 result before continuing
        id: result_04
        if: always() && steps.run_04.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v6-remaining49-v1-case-04-${{ steps.run_04.outputs.artifact_outcome || 'reserved-no-final-status' }}
          path: /tmp/v6-case-04
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Fail closed unless ordinal 4 completed and evidence was uploaded
        if: always() && steps.run_04.outcome != 'skipped'
        shell: bash
        env:
          RESULT_UPLOAD_OUTCOME: ${{ steps.result_04.outcome }}
          RESULT_ARTIFACT_ID: ${{ steps.result_04.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test "$RESULT_UPLOAD_OUTCOME" = 'success'
          test -n "$RESULT_ARTIFACT_ID"
          python "$RUNNER" --mode check --ordinal 4 --source-root /tmp/trackcade-v6-prep --flex-root /tmp/trackcade-v6-flex8192-prep --output-dir /tmp/v6-case-04 --harness-commit "$GITHUB_SHA" --validator research/learned-interpretation-v1/validate_learned_proposal_v6.py --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v6-lock-04/attempt-lock.json

      - name: Reserve ordinal 5 offline after rejecting all prior evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          for suffix in attempt-lock completed-valid attempted-no-valid-response local-no-provider-attempt reserved-no-final-status; do
            name="trackcade-semantic-external-stage1-v6-remaining49-v1-case-05-${suffix}"
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" --jq '.total_count')"
            test "$count" = '0'
          done
          python "$RUNNER" --mode prepare --ordinal 5 --source-root /tmp/trackcade-v6-prep --flex-root /tmp/trackcade-v6-flex8192-prep --output-dir /tmp/v6-case-05 --harness-commit "$GITHUB_SHA" --validator research/learned-interpretation-v1/validate_learned_proposal_v6.py --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v6-lock-05/attempt-lock.json

      - name: Persist ordinal 5 reservation before exposing provider credentials
        id: lock_05
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v6-remaining49-v1-case-05-attempt-lock
          path: /tmp/v6-lock-05/attempt-lock.json
          if-no-files-found: error
          retention-days: 90

      - name: One ordinal 5 attempt using the canonical runner
        id: run_05
