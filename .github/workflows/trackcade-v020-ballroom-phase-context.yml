name: Trackcade v0.20 Research — Ballroom Phase Context Diagnostics

on:
  push:
    branches: [analyzer-v020-phase-context]
    paths:
      - '.github/workflows/trackcade-v020-ballroom-phase-context.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Build exact v0.19 final baseline and debug runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stress-run/tools stress-run/data/audio stress-run/data/annotations stress-run/results
          python release/analyzer-v019/build_release.py --output stress-run/tools/trackcade-analyzer-v0.19.js --manifest stress-run/tools/build_manifest.json
          echo '9d579842207a1482ef6d12d34d6d82d03b02021d88de65c19abaf41f8692f432  stress-run/tools/trackcade-analyzer-v0.19.js' | sha256sum -c -
          python research/v020-phase-context/make_phase_context_debug_runner.py stress-run/tools/trackcade-analyzer-v0.19.js stress-run/tools/trackcade-analyzer-v0.20-phase-context-debug.js
          node --check stress-run/tools/trackcade-analyzer-v0.20-phase-context-debug.js
      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Download verified Ballroom corpus
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o stress-run/data/data1.tar.gz https://mtg.upf.edu/ismir2004/contest/tempoContest/data1.tar.gz || curl -fL --retry 3 --retry-delay 5 -o stress-run/data/data1.tar.gz http://mtg.upf.edu/ismir2004/contest/tempoContest/data1.tar.gz
          echo '2872a3e52070bc342a4510a95e2fa0b8  stress-run/data/data1.tar.gz' | md5sum -c -
          tar -xzf stress-run/data/data1.tar.gz -C stress-run/data/audio
          curl -fL --retry 3 --retry-delay 3 -o stress-run/data/annotations.tar.gz https://github.com/CPJKU/BallroomAnnotations/archive/refs/heads/master.tar.gz
          tar -xzf stress-run/data/annotations.tar.gz -C stress-run/data/annotations
          test "$(find stress-run/data/audio -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.flac' \) | wc -l)" -eq 698
          test "$(find stress-run/data/annotations -type f -name '*.beats' | wc -l)" -ge 698
      - name: Run diagnostic-only long-context phase study
        shell: bash
        run: |
          set -euo pipefail
          python research/v020-phase-context/run_phase_context_ballroom.py \
            --audio-root stress-run/data/audio \
            --annotations-root stress-run/data/annotations \
            --baseline-runner stress-run/tools/trackcade-analyzer-v0.19.js \
            --debug-runner stress-run/tools/trackcade-analyzer-v0.20-phase-context-debug.js \
            --output stress-run/results
          cat stress-run/results/summary.json
      - name: Remove corpus audio and Analyzer files
        if: always()
        shell: bash
        run: rm -rf stress-run/data/audio stress-run/data/data1.tar.gz stress-run/data/annotations stress-run/data/annotations.tar.gz stress-run/tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trackcade-v020-ballroom-phase-context-diagnostics
          path: |
            stress-run/results/summary.json
            stress-run/results/phase_context.csv
            stress-run/results/errors.json
            stress-run/results/invariance_failures.json
          if-no-files-found: error
          retention-days: 30
