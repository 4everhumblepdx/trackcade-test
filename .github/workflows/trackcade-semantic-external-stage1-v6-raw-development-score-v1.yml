name: TrackCade V6 — RAW development score — post-freeze activation only

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - research/semantic-external-holdout-v1/STAGE1_V6_RAW_SCORING_ACTIVATE_V1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: trackcade-stage1-v6-raw-development-score-v1
  cancel-in-progress: false

jobs:
  score:
    if: github.ref == 'refs/heads/trackcade-semantic-external-holdout-v1' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCORER: research/semantic-external-holdout-v1/evaluate_stage1_v6_raw_v1.py
      ACTIVATION: research/semantic-external-holdout-v1/STAGE1_V6_RAW_SCORING_ACTIVATE_V1.json
      REFERENCE_PATH: research/semantic-external-holdout-v1/REFERENCE_DROPS_V3.json
      EXPECTED_SCORER_BLOB: 2eadafe97cdfb873fe385c8a1078975dad709dd4
      EXPECTED_SCORER_SHA256: 91a72b5c3ce363f20de48f95fc35e9b82e1b2d9ffcea1c9b51942a738794fd84
      EXPECTED_REFERENCE_SHA256: 1b74d185d47ea52db62d4c23cdbd44375b6ba0a05cf3824c4278e88646db9d1c
      FREEZE_RUN_ID: '36911662121'
      FREEZE_ARTIFACT_ID: '11186333637'
      FREEZE_ARTIFACT_NAME: trackcade-semantic-external-stage1-v6-generation-freeze-v1
      FREEZE_ARTIFACT_DIGEST: sha256:c4f7e94936b7cb17b2c025231ed9aeea585246a0e4b6371887df1fa5ee25645f
      FREEZE_SHA256: ef3496c28e42b08f25a5d0afb989628ca96dad6ac82ebac0be61a026732fa1a8
      PREP_RUN_ID: '36747819119'
      PREP_ARTIFACT_ID: '11112534029'
      PREP_ARTIFACT_NAME: trackcade-semantic-external-stage1-v6-prep-v1
      PREP_ARTIFACT_DIGEST: sha256:0d586b737ba729a1386914663d92e7bae1fd85e404f1480e8f034084cbd80134

    steps:
      - name: Checkout scoring machinery without labels or terminal data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows/trackcade-semantic-external-stage1-v6-raw-development-score-v1.yml
            research/semantic-external-holdout-v1/evaluate_stage1_v6_raw_v1.py
            research/semantic-external-holdout-v1/STAGE1_V6_RAW_SCORING_ACTIVATE_V1.json
          sparse-checkout-cone-mode: false

      - name: Fail closed on activation, source identity, and provider-free state
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test -z "${OPENAI_API_KEY:-}"
          test -f "${ACTIVATION}"
          test "$(git rev-parse HEAD:${SCORER})" = "${EXPECTED_SCORER_BLOB}"
          echo "${EXPECTED_SCORER_SHA256}  ${SCORER}" | sha256sum -c -
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${ACTIVATION}"
          python - <<'PY'
          import json, os
          a=json.load(open(os.environ['ACTIVATION'], encoding='utf-8'))
          assert a['schema']=='trackcade-semantic-external-stage1-v6-raw-scoring-activation-v1'
          assert a['status']=='authorized-after-complete-50-response-freeze'
          assert a['developmentSetScoringAuthorized'] is True
          assert a['stage1ReferenceOpeningAuthorized'] is True
          assert a['terminalHoldoutAuthorized'] is False
          assert a['compilerAuthorized'] is False
          assert a['analyzerExecutionAuthorized'] is False
          assert a['providerCallsAuthorized'] is False
          assert a['tolerancesSeconds']==[1.0,2.0,5.0]
          assert a['primaryToleranceSeconds']==2.0
          assert a['generationFreezeSha256']==os.environ['FREEZE_SHA256']
          print('post-freeze development scoring activation=PASS')
          PY

      - name: Verify immutable freeze and prep artifact metadata before label access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          specs=[
            ('FREEZE','FREEZE_ARTIFACT_ID','FREEZE_ARTIFACT_NAME','FREEZE_ARTIFACT_DIGEST','FREEZE_RUN_ID'),
            ('PREP','PREP_ARTIFACT_ID','PREP_ARTIFACT_NAME','PREP_ARTIFACT_DIGEST','PREP_RUN_ID'),
          ]
          for label,idk,namek,digestk,runk in specs:
            m=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/artifacts/{os.environ[idk]}"], text=True))
            assert m['id']==int(os.environ[idk]), (label,'id')
            assert m['name']==os.environ[namek], (label,'name')
            assert m['digest']==os.environ[digestk], (label,'digest')
            assert m['expired'] is False, (label,'expired')
            assert m['workflow_run']['id']==int(os.environ[runk]), (label,'run')
          print('immutable freeze/prep artifact metadata=PASS')
          PY

      - name: Download exact complete V6 generation freeze
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT_NAME }}
          path: /tmp/trackcade-v6-freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}

      - name: Download exact frozen V6 semantic prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREP_ARTIFACT_NAME }}
          path: /tmp/trackcade-v6-prep
          github-token: ${{ github.token }}
          run-id: ${{ env.PREP_RUN_ID }}

      - name: Verify complete freeze closure before opening development labels
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test ! -e "${REFERENCE_PATH}"
          echo "${FREEZE_SHA256}  /tmp/trackcade-v6-freeze/STAGE1_V6_GENERATION_FREEZE_V1.json" | sha256sum -c -
          python - <<'PY'
          import json
          p='/tmp/trackcade-v6-freeze/STAGE1_V6_GENERATION_FREEZE_V1.json'
          f=json.load(open(p,encoding='utf-8'))
          assert f['schema']=='trackcade-semantic-external-stage1-v6-generation-freeze-v1'
          assert f['status']=='frozen-complete-v6-generation-before-reference-access'
          assert f['trackCount']==50
          assert len(f['cases'])==50
          assert [x['ordinal'] for x in sorted(f['cases'], key=lambda x:x['ordinal'])]==list(range(1,51))
          assert f['referenceLabelsReadByFreeze'] is False
          assert f['partialScoringPerformed'] is False
          assert f['terminalTracksProcessed'] is False
          assert f['providerCallsByFreeze']==0
          assert f['compilerInvoked'] is False
          assert f['analyzerExecuted'] is False
          print('complete 50-response freeze closure=PASS')
          PY

      - name: Open exact Stage1 development references only after closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage1-reference
          git show "HEAD:${REFERENCE_PATH}" > /tmp/stage1-reference/REFERENCE_DROPS_V3.json
          echo "${EXPECTED_REFERENCE_SHA256}  /tmp/stage1-reference/REFERENCE_DROPS_V3.json" | sha256sum -c -

      - name: Score frozen V6 RAW Drops at plus-minus 1 2 and 5 seconds
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          python "${SCORER}" \
            --freeze-root /tmp/trackcade-v6-freeze \
            --prep-root /tmp/trackcade-v6-prep \
            --references /tmp/stage1-reference/REFERENCE_DROPS_V3.json \
            --activation-receipt "${ACTIVATION}" \
            --expected-freeze-sha256 "${FREEZE_SHA256}" \
            --output-dir /tmp/trackcade-v6-raw-score
          sha256sum /tmp/trackcade-v6-raw-score/STAGE1_V6_RAW_EVALUATION_V1.json | tee /tmp/trackcade-v6-raw-score/STAGE1_V6_RAW_EVALUATION_V1.sha256

      - name: Audit scoring output boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='/tmp/trackcade-v6-raw-score/STAGE1_V6_RAW_EVALUATION_V1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['schema']=='trackcade-semantic-external-stage1-v6-raw-evaluation-v1'
          assert x['status']=='scored-complete-50-track-v6-development-after-freeze'
          assert x['generationFreezeSha256']=='ef3496c28e42b08f25a5d0afb989628ca96dad6ac82ebac0be61a026732fa1a8'
          assert x['primaryToleranceSeconds']==2.0
          assert x['tolerancesSeconds']==[1.0,2.0,5.0]
          assert x['terminalHoldoutProcessed'] is False
          assert x['providerCallsByEvaluation']==0
          assert x['compilerInvoked'] is False
          assert x['analyzerExecuted'] is False
          assert x['scientificQualification']['developmentScoreUnbiasedGeneralizationEstimate'] is False
          assert x['scientificQualification']['terminalHoldoutRemainsOnlyUnbiasedSemanticTest'] is True
          print(json.dumps({'headline':x['headline'],'sensitivity':x['sensitivity'],'boundaries':'PASS'}, indent=2, sort_keys=True))
          PY

      - name: Upload immutable V6 RAW development evaluation
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v6-raw-development-evaluation-v1
          path: /tmp/trackcade-v6-raw-score/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
