          "id": "live50",
          "name": "One provider attempt 50",
          "env": {
            "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}",
            "LOCK_ARTIFACT_ID": "${{ steps.lock50.outputs.artifact-id }}"
          },
          "run": "python -B \"$R\" run 50"
        },
        {
          "id": "result50",
          "if": "${{ always() && steps.live50.outcome != 'skipped' }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "trackcade-stage1-v8-remaining46-v1-case-50-result",
            "path": "/tmp/v8-continuation/50",
            "if-no-files-found": "error",
            "retention-days": 90,
            "overwrite": false
          }
        },
        {
          "id": "gate50",
          "name": "Require uploaded valid result and budget before progression 50",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "RESULT_ARTIFACT_ID": "${{ steps.result50.outputs.artifact-id }}",
            "LOCK_ARTIFACT_ID": "${{ steps.lock50.outputs.artifact-id }}"
          },
          "run": "python -B \"$A\" --advance 50"
        }
      ]
    }
  }
}
