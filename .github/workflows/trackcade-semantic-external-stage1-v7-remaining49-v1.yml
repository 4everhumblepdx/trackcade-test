          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCK_ARTIFACT_ID}" > /tmp/v7-lock-08/uploaded-artifact.json
          python "$RUNNER" --mode run --ordinal 8 --source-root /tmp/trackcade-v7-prep --flex-root /tmp/trackcade-v7-flex8192-prep --output-dir /tmp/v7-case-08 --harness-commit "$GITHUB_SHA" --validator "$VALIDATOR" --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v7-lock-08/attempt-lock.json --uploaded-lock /tmp/v7-lock-08/uploaded-artifact.json

      - name: Persist and verify ordinal 8 before continuing
