name: Trackcade V7 — Remaining 49 — explicit paid activation only

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - research/semantic-external-holdout-v1/STAGE1_V7_REMAINING49_PROVIDER_ACTIVATE_V1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: trackcade-stage1-v7-remaining49-paid-v1
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/trackcade-semantic-external-holdout-v1' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUNNER: research/semantic-external-holdout-v1/run_stage1_v7_remaining49_case_v1.py
      VALIDATOR: research/learned-interpretation-v1/validate_learned_proposal_v7.py
      AUTH_PATH: research/semantic-external-holdout-v1/STAGE1_V7_REMAINING49_PROVIDER_AUTHORIZATION_V1.json
      ACTIVATE_PATH: research/semantic-external-holdout-v1/STAGE1_V7_REMAINING49_PROVIDER_ACTIVATE_V1.json
      SOURCE_HEAD_SHA: f83e4de05fda7741479675f475be75eee800b5d8
      SOURCE_RUN_ID: '36915758639'
      SOURCE_ARTIFACT_ID: '11189967853'
      SOURCE_ARTIFACT_NAME: trackcade-semantic-external-stage1-v7-prep-v1
      SOURCE_ARTIFACT_DIGEST: sha256:4da778967c39796fa6fc475552b82b07594bcf8208a52cc479da43506fa8026a
      SOURCE_MANIFEST_SHA256: 455602ea8c5a721fac9b3381aca46285fe3c14f1fbcc36f0d08b4ffec01be875
      SOURCE_FILES_SHA256: 9a55eff093ac8552ef8868c60d410b0b6ade0e243c11a5588066c9d16d9f3672
      FLEX_HEAD_SHA: 307e53261035812617fede7429a2d82dde8c2479
      FLEX_RUN_ID: '36920081360'
      FLEX_ARTIFACT_ID: '11191402965'
      FLEX_ARTIFACT_NAME: trackcade-semantic-external-stage1-v7-flex8192-prep-v1
      FLEX_ARTIFACT_DIGEST: sha256:ff315c7433213cf8de4a475fcdbc95c88a7c4dfbf5685077a9a8112f3a3fdb95
      FLEX_MANIFEST_SHA256: a41fdd4e4138fdfda18cda20004f609eb089aeb64ed1be486ee2442b1241a713
      FLEX_FILES_SHA256: 18805ff58dd5580a7002bc9f7d3a9fa5042539f80ae4b7d1c8a9ddc62e1668f0
      CANARY_RUN_ID: '36922442091'
      CANARY_ARTIFACT_ID: '11191938588'
      CANARY_ARTIFACT_NAME: trackcade-semantic-external-stage1-v7-canary-v1-case-01-completed-valid
      CANARY_ARTIFACT_DIGEST: sha256:5b3995aa95e4f92af0c2d7b25f9418445bc292a691b7b029165ffe0340b96b4a

    steps:
      - name: Checkout exact activation commit with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed unless paid remaining49 authorization and activation are exact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test -f "${AUTH_PATH}"
          test -f "${ACTIVATE_PATH}"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${ACTIVATE_PATH}"
          for p in \
            research/learned-interpretation-v1/build_learned_request_v7.py \
            research/learned-interpretation-v1/validate_learned_proposal_v7.py \
            research/learned-interpretation-v1/validate_learned_proposal_v3.py \
            research/learned-interpretation-v1/openai_responses_adapter_v1.py \
            research/learned-interpretation-v1/openai_responses_adapter_v7.py; do
            test "$(git rev-parse HEAD:${p})" = "$(git rev-parse ${SOURCE_HEAD_SHA}:${p})"
          done
          python -m py_compile "${RUNNER}" "${VALIDATOR}"
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          auth=json.load(open(os.environ['AUTH_PATH']))
          act=json.load(open(os.environ['ACTIVATE_PATH']))
          expected=list(range(2,51))
          contract={'provider':'openai','api':'responses','model':'gpt-6-sol','reasoningEffort':'high','maxOutputTokens':8192,'serviceTier':'flex','store':False}
          assert auth['schema']=='trackcade-semantic-external-stage1-v7-remaining49-provider-authorization-v1'
          assert auth['status']=='authorized-explicit-paid-remaining49'
          assert auth['authorized'] is True
          assert isinstance(auth.get('authorizationSource'),str) and auth['authorizationSource'].strip()
          assert auth['ordinals']==expected
          assert auth['maximumInitialProviderAttempts']==49 and auth['attemptsPerOrdinal']==1
          assert auth['providerContract']==contract
          c=auth['frozenOrdinal1Canary']
          assert c['ordinal']==1 and c['artifactId']==int(os.environ['CANARY_ARTIFACT_ID'])
          assert c['artifactName']==os.environ['CANARY_ARTIFACT_NAME'] and c['artifactDigest']==os.environ['CANARY_ARTIFACT_DIGEST']
          assert c['reuseAsDevelopmentResponse'] is True and c['rerunOrdinal1Authorized'] is False
          rb=auth['researchBoundary']
          for key in ('automaticRetriesAuthorized','standardFallbackAuthorized','partialScoringAuthorized','stage1ReferenceAccessAuthorized','terminalHoldoutAccessAuthorized','compilerInvocationAuthorized','analyzerExecutionAuthorized','analyzerChangesAuthorized','semanticContractChangesAuthorized'):
            assert rb[key] is False, key
          assert rb['retryAfterAnyFailedOrInvalidOrdinalRequiresNewExplicitApproval'] is True
          assert act['schema']=='trackcade-semantic-external-stage1-v7-remaining49-provider-activation-v1'
          assert act['activatePaidRemaining49'] is True
          assert act['authorizationFile']==os.environ['AUTH_PATH']
          assert act['ordinals']==expected
          assert act['maximumProviderAttempts']==49 and act['attemptsPerOrdinal']==1
          for key in ('automaticRetriesAuthorized','standardFallbackAuthorized','partialScoringAuthorized','stage1ReferenceOpeningAuthorized','terminalHoldoutAccessAuthorized','compilerInvocationAuthorized','analyzerExecutionAuthorized','analyzerChangesAuthorized','semanticContractChangesAuthorized'):
            assert act[key] is False, key
          assert act['providerContract']==contract
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert act['executionSourceCommit']==parent
          workflow=pathlib.Path('.github/workflows/trackcade-semantic-external-stage1-v7-remaining49-v1.yml')
          runner=pathlib.Path(os.environ['RUNNER'])
          reserve=pathlib.Path('.github/actions/trackcade-v7-remaining49-reserve-v1/action.yml')
          finalize=pathlib.Path('.github/actions/trackcade-v7-remaining49-finalize-v1/action.yml')
          assert act['executionWorkflowSha256']==hashlib.sha256(workflow.read_bytes()).hexdigest()
          assert act['runnerSha256']==hashlib.sha256(runner.read_bytes()).hexdigest()
          assert act['reserveActionSha256']==hashlib.sha256(reserve.read_bytes()).hexdigest()
          assert act['finalizeActionSha256']==hashlib.sha256(finalize.read_bytes()).hexdigest()
          auth_commit=act['authorizationCommit']
          subprocess.run(['git','cat-file','-e',f'{auth_commit}^{{commit}}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',auth_commit,parent],check=True)
          historical=subprocess.check_output(['git','show',f'{auth_commit}:{os.environ["AUTH_PATH"]}'],text=True)
          assert json.loads(historical)==auth
          print('Explicit V7 remaining49 authorization and separate activation verified')
          PY

      - name: Verify immutable V7 prep and frozen ordinal-1 canary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          specs=[
            ('SOURCE','SOURCE_ARTIFACT_ID','SOURCE_ARTIFACT_NAME','SOURCE_ARTIFACT_DIGEST','SOURCE_RUN_ID','SOURCE_HEAD_SHA'),
            ('FLEX','FLEX_ARTIFACT_ID','FLEX_ARTIFACT_NAME','FLEX_ARTIFACT_DIGEST','FLEX_RUN_ID','FLEX_HEAD_SHA'),
          ]
          for label,idk,namek,digestk,runk,headk in specs:
            m=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/artifacts/{os.environ[idk]}"],text=True))
            assert m['id']==int(os.environ[idk])
            assert m['name']==os.environ[namek] and m['digest']==os.environ[digestk]
            assert m['expired'] is False
            assert m['workflow_run']['id']==int(os.environ[runk])
            assert m['workflow_run']['head_sha']==os.environ[headk]
          c=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/artifacts/{os.environ['CANARY_ARTIFACT_ID']}"],text=True))
          assert c['id']==int(os.environ['CANARY_ARTIFACT_ID'])
          assert c['name']==os.environ['CANARY_ARTIFACT_NAME'] and c['digest']==os.environ['CANARY_ARTIFACT_DIGEST']
          assert c['expired'] is False and c['workflow_run']['id']==int(os.environ['CANARY_RUN_ID'])
          PY

      - name: Refuse any earlier V7 remaining49 paid workflow execution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/trackcade-semantic-external-stage1-v7-remaining49-v1.yml/runs?per_page=100" > /tmp/v7-remaining49-run-history.json
          python - <<'PY'
          import json,os
          pages=json.load(open('/tmp/v7-remaining49-run-history.json'))
          runs=[r for page in pages for r in page['workflow_runs']]
          assert all(r['id']==int(os.environ['GITHUB_RUN_ID']) for r in runs), 'Prior V7 remaining49 execution exists: stop; no resume or retry is authorized.'
          PY

      - name: Download exact frozen V7 semantic prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: /tmp/trackcade-v7-prep
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download exact frozen V7 Flex 8192 prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLEX_ARTIFACT_NAME }}
          path: /tmp/trackcade-v7-flex8192-prep
          github-token: ${{ github.token }}
          run-id: ${{ env.FLEX_RUN_ID }}

      - name: Verify frozen prep closures before any provider credential is exposed
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test ! -e research/semantic-external-holdout-v1/REFERENCE_DROPS_V3.json
          ! find . -type f -iname '*terminal*' -print -quit | grep -q .
          echo "${SOURCE_MANIFEST_SHA256}  /tmp/trackcade-v7-prep/STAGE1_V7_PREP_MANIFEST_V1.json" | sha256sum -c -
          echo "${SOURCE_FILES_SHA256}  /tmp/trackcade-v7-prep/FILES_SHA256.txt" | sha256sum -c -
          echo "${FLEX_MANIFEST_SHA256}  /tmp/trackcade-v7-flex8192-prep/STAGE1_V7_FLEX8192_PREP_MANIFEST_V1.json" | sha256sum -c -
          echo "${FLEX_FILES_SHA256}  /tmp/trackcade-v7-flex8192-prep/FILES_SHA256.txt" | sha256sum -c -

      - name: Reserve ordinal 2 provider-free
        id: reserve_02
        uses: ./.github/actions/trackcade-v7-remaining49-reserve-v1
        with:
          ordinal: '2'
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: One ordinal 2 provider attempt
        id: run_02
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOCK_ARTIFACT_ID: ${{ steps.reserve_02.outputs.lock-artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCK_ARTIFACT_ID}" > /tmp/v7-lock-02/uploaded-artifact.json
          python "$RUNNER" --mode run --ordinal 2 --source-root /tmp/trackcade-v7-prep --flex-root /tmp/trackcade-v7-flex8192-prep --output-dir /tmp/v7-case-02 --harness-commit "$GITHUB_SHA" --validator "$VALIDATOR" --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v7-lock-02/attempt-lock.json --uploaded-lock /tmp/v7-lock-02/uploaded-artifact.json

      - name: Persist and verify ordinal 2 before continuing
        uses: ./.github/actions/trackcade-v7-remaining49-finalize-v1
        with:
          ordinal: '2'
          artifact-outcome: ${{ steps.run_02.outputs.artifact_outcome }}
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: Reserve ordinal 3 provider-free
        id: reserve_03
        uses: ./.github/actions/trackcade-v7-remaining49-reserve-v1
        with:
          ordinal: '3'
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: One ordinal 3 provider attempt
        id: run_03
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOCK_ARTIFACT_ID: ${{ steps.reserve_03.outputs.lock-artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCK_ARTIFACT_ID}" > /tmp/v7-lock-03/uploaded-artifact.json
          python "$RUNNER" --mode run --ordinal 3 --source-root /tmp/trackcade-v7-prep --flex-root /tmp/trackcade-v7-flex8192-prep --output-dir /tmp/v7-case-03 --harness-commit "$GITHUB_SHA" --validator "$VALIDATOR" --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v7-lock-03/attempt-lock.json --uploaded-lock /tmp/v7-lock-03/uploaded-artifact.json

      - name: Persist and verify ordinal 3 before continuing
        uses: ./.github/actions/trackcade-v7-remaining49-finalize-v1
        with:
          ordinal: '3'
          artifact-outcome: ${{ steps.run_03.outputs.artifact_outcome }}
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: Reserve ordinal 4 provider-free
        id: reserve_04
        uses: ./.github/actions/trackcade-v7-remaining49-reserve-v1
        with:
          ordinal: '4'
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: One ordinal 4 provider attempt
        id: run_04
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOCK_ARTIFACT_ID: ${{ steps.reserve_04.outputs.lock-artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCK_ARTIFACT_ID}" > /tmp/v7-lock-04/uploaded-artifact.json
          python "$RUNNER" --mode run --ordinal 4 --source-root /tmp/trackcade-v7-prep --flex-root /tmp/trackcade-v7-flex8192-prep --output-dir /tmp/v7-case-04 --harness-commit "$GITHUB_SHA" --validator "$VALIDATOR" --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v7-lock-04/attempt-lock.json --uploaded-lock /tmp/v7-lock-04/uploaded-artifact.json

      - name: Persist and verify ordinal 4 before continuing
        uses: ./.github/actions/trackcade-v7-remaining49-finalize-v1
        with:
          ordinal: '4'
          artifact-outcome: ${{ steps.run_04.outputs.artifact_outcome }}
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: Reserve ordinal 5 provider-free
        id: reserve_05
        uses: ./.github/actions/trackcade-v7-remaining49-reserve-v1
        with:
          ordinal: '5'
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: One ordinal 5 provider attempt
        id: run_05
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOCK_ARTIFACT_ID: ${{ steps.reserve_05.outputs.lock-artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCK_ARTIFACT_ID}" > /tmp/v7-lock-05/uploaded-artifact.json
          python "$RUNNER" --mode run --ordinal 5 --source-root /tmp/trackcade-v7-prep --flex-root /tmp/trackcade-v7-flex8192-prep --output-dir /tmp/v7-case-05 --harness-commit "$GITHUB_SHA" --validator "$VALIDATOR" --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v7-lock-05/attempt-lock.json --uploaded-lock /tmp/v7-lock-05/uploaded-artifact.json

      - name: Persist and verify ordinal 5 before continuing
        uses: ./.github/actions/trackcade-v7-remaining49-finalize-v1
        with:
          ordinal: '5'
          artifact-outcome: ${{ steps.run_05.outputs.artifact_outcome }}
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: Reserve ordinal 6 provider-free
        id: reserve_06
        uses: ./.github/actions/trackcade-v7-remaining49-reserve-v1
        with:
          ordinal: '6'
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: One ordinal 6 provider attempt
        id: run_06
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOCK_ARTIFACT_ID: ${{ steps.reserve_06.outputs.lock-artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCK_ARTIFACT_ID}" > /tmp/v7-lock-06/uploaded-artifact.json
          python "$RUNNER" --mode run --ordinal 6 --source-root /tmp/trackcade-v7-prep --flex-root /tmp/trackcade-v7-flex8192-prep --output-dir /tmp/v7-case-06 --harness-commit "$GITHUB_SHA" --validator "$VALIDATOR" --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v7-lock-06/attempt-lock.json --uploaded-lock /tmp/v7-lock-06/uploaded-artifact.json

      - name: Persist and verify ordinal 6 before continuing
        uses: ./.github/actions/trackcade-v7-remaining49-finalize-v1
        with:
          ordinal: '6'
          artifact-outcome: ${{ steps.run_06.outputs.artifact_outcome }}
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: Reserve ordinal 7 provider-free
        id: reserve_07
        uses: ./.github/actions/trackcade-v7-remaining49-reserve-v1
        with:
          ordinal: '7'
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: One ordinal 7 provider attempt
        id: run_07
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOCK_ARTIFACT_ID: ${{ steps.reserve_07.outputs.lock-artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCK_ARTIFACT_ID}" > /tmp/v7-lock-07/uploaded-artifact.json
          python "$RUNNER" --mode run --ordinal 7 --source-root /tmp/trackcade-v7-prep --flex-root /tmp/trackcade-v7-flex8192-prep --output-dir /tmp/v7-case-07 --harness-commit "$GITHUB_SHA" --validator "$VALIDATOR" --authorization "$AUTH_PATH" --activation "$ACTIVATE_PATH" --lock-file /tmp/v7-lock-07/attempt-lock.json --uploaded-lock /tmp/v7-lock-07/uploaded-artifact.json

      - name: Persist and verify ordinal 7 before continuing
        uses: ./.github/actions/trackcade-v7-remaining49-finalize-v1
        with:
          ordinal: '7'
          artifact-outcome: ${{ steps.run_07.outputs.artifact_outcome }}
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: Reserve ordinal 8 provider-free
        id: reserve_08
        uses: ./.github/actions/trackcade-v7-remaining49-reserve-v1
        with:
          ordinal: '8'
          runner: ${{ env.RUNNER }}
          source-root: /tmp/trackcade-v7-prep
          flex-root: /tmp/trackcade-v7-flex8192-prep
          validator: ${{ env.VALIDATOR }}
          authorization: ${{ env.AUTH_PATH }}
          activation: ${{ env.ACTIVATE_PATH }}
          github-token: ${{ github.token }}

      - name: One ordinal 8 provider attempt
        id: run_08
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOCK_ARTIFACT_ID: ${{ steps.reserve_08.outputs.lock-artifact-id }}
        run: |
