name: Trackcade V7 — Remaining49 Staging Hash Receipt

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - .github/workflows/trackcade-semantic-external-stage1-v7-remaining49-hash-receipt-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash:
    if: github.ref == 'refs/heads/trackcade-semantic-external-holdout-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staged execution surface
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/trackcade-semantic-external-stage1-v7-remaining49-v1.yml
            .github/actions/trackcade-v7-remaining49-reserve-v1/action.yml
            .github/actions/trackcade-v7-remaining49-finalize-v1/action.yml
            research/semantic-external-holdout-v1/run_stage1_v7_remaining49_case_v1.py
            research/semantic-external-holdout-v1/STAGE1_V7_REMAINING49_PROVIDER_AUTHORIZATION_V1.json

      - name: Prove inactive spend gate and emit exact SHA256 receipt
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test ! -e research/semantic-external-holdout-v1/STAGE1_V7_REMAINING49_PROVIDER_ACTIVATE_V1.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/semantic-external-holdout-v1/STAGE1_V7_REMAINING49_PROVIDER_AUTHORIZATION_V1.json')
          a=json.loads(p.read_text())
          assert a['authorized'] is False and a['status']=='staged-not-authorized'
          PY
          sha256sum \
            .github/workflows/trackcade-semantic-external-stage1-v7-remaining49-v1.yml \
            research/semantic-external-holdout-v1/run_stage1_v7_remaining49_case_v1.py \
            .github/actions/trackcade-v7-remaining49-reserve-v1/action.yml \
            .github/actions/trackcade-v7-remaining49-finalize-v1/action.yml
