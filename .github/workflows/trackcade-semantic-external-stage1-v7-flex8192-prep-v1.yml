name: Trackcade V7 — Offline Flex 8192 transport prep

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - .github/workflows/trackcade-semantic-external-stage1-v7-flex8192-prep-v1.yml
      - research/semantic-external-holdout-v1/amend_stage1_v7_payload_flex8192.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trackcade-stage1-v7-flex8192-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-v7-flex8192:
    if: github.ref == 'refs/heads/trackcade-semantic-external-holdout-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: '36915758639'
      SOURCE_ARTIFACT_ID: '11189967853'
      SOURCE_ARTIFACT_NAME: trackcade-semantic-external-stage1-v7-prep-v1
      SOURCE_ARTIFACT_DIGEST: sha256:4da778967c39796fa6fc475552b82b07594bcf8208a52cc479da43506fa8026a
      SOURCE_HEAD_SHA: f83e4de05fda7741479675f475be75eee800b5d8
      SOURCE_MANIFEST_SHA256: 455602ea8c5a721fac9b3381aca46285fe3c14f1fbcc36f0d08b4ffec01be875
      SOURCE_FILES_SHA256: 9a55eff093ac8552ef8868c60d410b0b6ade0e243c11a5588066c9d16d9f3672

    steps:
      - name: Checkout exact transport amendment source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/semantic-external-holdout-v1/amend_stage1_v7_payload_flex8192.py
            .github/workflows/trackcade-semantic-external-stage1-v7-flex8192-prep-v1.yml

      - name: Assert zero-dollar boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/trackcade-semantic-external-holdout-v1"
          test -z "${OPENAI_API_KEY:-}"
          python -m py_compile research/semantic-external-holdout-v1/amend_stage1_v7_payload_flex8192.py
          grep -q '"allowedChangesOnly": \["service_tier"\]' research/semantic-external-holdout-v1/amend_stage1_v7_payload_flex8192.py
          if grep -Eq 'api\.openai\.com|client\.responses\.create|OpenAI\(' research/semantic-external-holdout-v1/amend_stage1_v7_payload_flex8192.py; then
            echo 'Provider invocation surface found in offline amendment script' >&2
            exit 1
          fi
          test ! -e research/semantic-external-holdout-v1/REFERENCE_DROPS_V3.json
          ! find . -type f -iname '*terminal*' -print -quit | grep -q .

      - name: Verify frozen V7 source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > /tmp/meta.json
          python - <<'PY'
          import json, os
          m=json.load(open('/tmp/meta.json'))
          assert m['id']==int(os.environ['SOURCE_ARTIFACT_ID'])
          assert m['name']==os.environ['SOURCE_ARTIFACT_NAME']
          assert m['digest']==os.environ['SOURCE_ARTIFACT_DIGEST']
          assert m['expired'] is False
          assert m['workflow_run']['id']==int(os.environ['SOURCE_RUN_ID'])
          assert m['workflow_run']['head_sha']==os.environ['SOURCE_HEAD_SHA']
          print('Frozen V7 source artifact verified')
          PY

      - name: Download exact frozen V7 prep
        uses: actions/download-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v7-prep-v1
          path: /tmp/trackcade-v7-prep
          github-token: ${{ github.token }}
          run-id: 36915758639

      - name: Verify source manifest identities
        shell: bash
        run: |
          set -euo pipefail
          echo "${SOURCE_MANIFEST_SHA256}  /tmp/trackcade-v7-prep/STAGE1_V7_PREP_MANIFEST_V1.json" | sha256sum -c -
          echo "${SOURCE_FILES_SHA256}  /tmp/trackcade-v7-prep/FILES_SHA256.txt" | sha256sum -c -

      - name: Prepare exact V7 Flex 8192 transport amendment offline
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          python research/semantic-external-holdout-v1/amend_stage1_v7_payload_flex8192.py \
            --source-prep-root /tmp/trackcade-v7-prep \
            --output-dir /tmp/trackcade-v7-flex8192-prep

      - name: Audit transport amendment closure
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('/tmp/trackcade-v7-flex8192-prep')
          m=json.load(open(root/'STAGE1_V7_FLEX8192_PREP_MANIFEST_V1.json'))
          assert m['schema']=='trackcade-semantic-external-stage1-v7-flex8192-prep-v1'
          assert m['status']=='frozen-v7-flex8192-transport-payloads-prepared-no-provider-call'
          assert m['trackCount']==50
          assert m['providerCallsObserved']==0
          assert m['referenceLabelsReadByPreparation'] is False
          assert m['terminalTracksProcessed'] is False
          assert m['existingTerminalPhysicallyUnseenClaimAllowed'] is False
          assert m['analyzerExecuted'] is False
          assert m['audioDecoded'] is False
          assert m['compilerInvoked'] is False
          assert m['paidCallsAuthorizedByThisManifest'] is False
          a=m['transportAmendment']
          assert a['serviceTier']=='flex'
          assert a['maxOutputTokens']==8192
          assert a['model']=='gpt-6-sol'
          assert a['reasoningEffort']=='high'
          assert a['store'] is False
          assert a['allowedChangesOnly']==['service_tier']
          assert a['semanticPayloadUnchanged'] is True
          s=m['semanticContractPreserved']
          assert s['structuralContextOrthogonalNotGate'] is True
          assert s['decisiveImpactRequiredForDrop'] is True
          assert s['decisiveImpactUnclearInsufficientForDrop'] is True
          assert [r['ordinal'] for r in m['tracks']]==list(range(1,51))
          for r in m['tracks']:
            case=root/f"cases/{r['ordinal']:02d}-{r['stem']}"
            p=json.load(open(case/'openai-payload-v7-flex8192.json'))
            assert p['service_tier']=='flex'
            assert p['max_output_tokens']==8192
            assert p['model']=='gpt-6-sol'
            assert p['reasoning']=={'effort':'high'}
            assert p['store'] is False
          for line in (root/'FILES_SHA256.txt').read_text().splitlines():
            if not line.strip():
              continue
            expected, rel=line.split('  ',1)
            assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==expected
          print('V7 Flex8192 amendment hash closure verified')
          PY

      - name: Upload immutable V7 Flex 8192 prep artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v7-flex8192-prep-v1
          path: /tmp/trackcade-v7-flex8192-prep
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
