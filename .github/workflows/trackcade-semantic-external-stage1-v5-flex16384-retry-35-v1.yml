name: Trackcade V5 — Evidence-bound Flex 16384 retry for ordinal 35

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - research/semantic-external-holdout-v1/STAGE1_V5_FLEX16384_ORDINAL35_RETRY_AUTHORIZATION_V1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: trackcade-v5-flex16384-ordinal35-retry-v1
  cancel-in-progress: false

jobs:
  retry-ordinal-35:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE: research/semantic-external-holdout-v1
      LEARNED: research/learned-interpretation-v1
      AUTH_FILE: research/semantic-external-holdout-v1/STAGE1_V5_FLEX16384_ORDINAL35_RETRY_AUTHORIZATION_V1.json
      STOP_FILE: research/semantic-external-holdout-v1/STAGE1_V5_PROVIDER_STOP_35_RECEIPT_V1.json
      SOURCE_RUN_ID: '36645240283'
      SOURCE_NAME: trackcade-semantic-external-stage1-v5-prep-v1
      SOURCE_MANIFEST_SHA256: f93545e534b11bd207df3f032709f5cd3c1f198cf5529bbf04c0158c696f4799
      SOURCE_FILES_SHA256: 1393038c09afff244e4aeb2c745eb5a6f40c5f728991cec5051d3dfb4d34cb6c
      FLEX_RUN_ID: '36647639925'
      FLEX_NAME: trackcade-semantic-external-stage1-v5-flex-prep-v1
      FLEX_MANIFEST_SHA256: 1b9c47e55463fafab4d1be94418b8ffb58e8b6799f2c5a527af40fa5f7d9c93e
      FLEX_FILES_SHA256: c1a8c4eb5563756b42cd18ab12627a61848541e3217f89de3d422f8800743e0a
      CONFORMANCE_RUN_ID: '36653461604'
      CONFORMANCE_ARTIFACT_ID: '11071736414'
      CONFORMANCE_NAME: trackcade-semantic-external-stage1-v5-flex16384-retry35-conformance-v1
      CONFORMANCE_DIGEST: sha256:27802927cba259184a4ea90c21c151f4d851536bc935045f0aa92541c0ba95cd
      INITIAL_RUN_ID: '36651297137'
      INITIAL_ARTIFACT_ID: '11071248684'
      INITIAL_NAME: trackcade-semantic-external-stage1-v5-flex8192-remaining-v1-case-35-attempted-no-completed-response
      INITIAL_DIGEST: sha256:25cc7dee09a0a147dd95799e0fa2f7d629c720b72016a507444b1af4e79e81a9
      RETRY_HARNESS_BLOB: 28bab52638a9c01d4a28ba6edf08c95947981712
      V5_INGESTER_BLOB: db03b02175e0e8545fe9db093d02c78c5c316a68
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify explicit authorization, immutable code, and one-use boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          python -m py_compile "$BASE/run_stage1_v5_flex16384_retry35_v1.py" "$LEARNED/ingest_provider_response_v5.py"
          test "$(git hash-object "$BASE/run_stage1_v5_flex16384_retry35_v1.py")" = "$RETRY_HARNESS_BLOB"
          test "$(git hash-object "$LEARNED/ingest_provider_response_v5.py")" = "$V5_INGESTER_BLOB"
          python - "$AUTH_FILE" "$STOP_FILE" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])); s=json.load(open(sys.argv[2]))
          assert a['schema']=='trackcade-semantic-external-stage1-v5-flex16384-ordinal35-retry-authorization-v1'
          assert a['status']=='authorized-one-paid-retry-only'
          assert a['ordinal']==35
          assert a['providerContract']=={
            'provider':'openai','api':'responses','model':'gpt-6-sol',
            'reasoningEffort':'high','maxOutputTokens':16384,'serviceTier':'flex','store':False,
          }
          assert a['initialAttemptArtifactId']==11071248684
          assert a['initialAttemptDigest']=='sha256:25cc7dee09a0a147dd95799e0fa2f7d629c720b72016a507444b1af4e79e81a9'
          assert a['initialAttemptOutcome']=='incomplete:max_output_tokens@8192'
          assert a['semanticPayloadUnchanged'] is True
          assert a['transportOnlyChange']=={'field':'max_output_tokens','from':8192,'to':16384}
          assert a['standardFallbackAuthorized'] is False
          assert a['additionalRetriesAuthorized'] is False
          assert a['continuationOrdinals']=='36-50'
          assert a['continuationAuthorizedOnlyAfterCompletedRetry'] is True
          assert a['continuationMaxOutputTokens']==8192
          assert a['partialScoringAuthorized'] is False
          assert a['terminalHoldoutAuthorized'] is False
          assert a['compilerInvocationAuthorized'] is False
          assert a['analyzerChangesAuthorized'] is False
          if 'userReportedOpenAiBalanceUsd' in a:
            assert isinstance(a['userReportedOpenAiBalanceUsd'],(int,float)) and a['userReportedOpenAiBalanceUsd']>=0
          assert s['status']=='stopped-fail-closed-no-partial-score'
          assert s['completedOrdinals']=='1-34'
          assert s['untouchedAfterFailFast']=='36-50'
          f=s['stoppingAttempt']
          assert f['ordinal']==35 and f['artifactId']==11071248684
          assert f['digest']==a['initialAttemptDigest']
          assert f['providerStatus']=='incomplete' and f['incompleteReason']=='max_output_tokens'
          assert f['maxOutputTokens']==8192 and f['providerCompletedSemanticResponse'] is False
          PY
          for name in \
            trackcade-semantic-external-stage1-v5-flex16384-retry35-v1-case-35-completed \
            trackcade-semantic-external-stage1-v5-flex16384-retry35-v1-case-35-attempted-no-completed-response; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | length')"
            test "$count" = '0'
          done

      - name: Verify immutable failure and conformance artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          specs=[
            (os.environ['INITIAL_ARTIFACT_ID'],os.environ['INITIAL_NAME'],os.environ['INITIAL_DIGEST'],os.environ['INITIAL_RUN_ID']),
            (os.environ['CONFORMANCE_ARTIFACT_ID'],os.environ['CONFORMANCE_NAME'],os.environ['CONFORMANCE_DIGEST'],os.environ['CONFORMANCE_RUN_ID']),
          ]
          repo=os.environ['GITHUB_REPOSITORY']
          for id_s,name,digest,run_s in specs:
            d=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{id_s}'],text=True))
            assert d['id']==int(id_s); assert d['name']==name; assert d['digest']==digest
            assert d['expired'] is False; assert d['workflow_run']['id']==int(run_s)
          PY

      - name: Download exact frozen V5 source prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_NAME }}
          path: ${{ runner.temp }}/v5-source
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download exact frozen V5 Flex prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLEX_NAME }}
          path: ${{ runner.temp }}/v5-flex
          repository: ${{ github.repository }}
          run-id: ${{ env.FLEX_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download immutable initial ordinal-35 failure evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.INITIAL_NAME }}
          path: ${{ runner.temp }}/initial-35
          repository: ${{ github.repository }}
          run-id: ${{ env.INITIAL_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify evidence and exact retry payload offline before provider access
        shell: bash
        run: |
          set -euo pipefail
          if env | grep -q '^OPENAI_API_KEY='; then
            echo 'OPENAI_API_KEY leaked into preflight environment' >&2
            exit 1
          fi
          test "$(sha256sum "${RUNNER_TEMP}/v5-source/STAGE1_V5_PREP_MANIFEST_V1.json" | awk '{print $1}')" = "$SOURCE_MANIFEST_SHA256"
          test "$(sha256sum "${RUNNER_TEMP}/v5-source/FILES_SHA256.txt" | awk '{print $1}')" = "$SOURCE_FILES_SHA256"
          test "$(sha256sum "${RUNNER_TEMP}/v5-flex/STAGE1_V5_FLEX_PREP_MANIFEST_V1.json" | awk '{print $1}')" = "$FLEX_MANIFEST_SHA256"
          test "$(sha256sum "${RUNNER_TEMP}/v5-flex/FILES_SHA256.txt" | awk '{print $1}')" = "$FLEX_FILES_SHA256"
          python - "${RUNNER_TEMP}/initial-35/stage1-v5-flex-case-status-v1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['ordinal']==35
          assert d['providerCallAttempted'] is True
          assert d['providerCompletedSemanticResponse'] is False
          assert d['httpStatus']==200
          assert d['observedProviderStatus']=='incomplete'
          assert d['observedProviderServiceTier']=='flex'
          assert d['incompleteDetails']=={'reason':'max_output_tokens'}
          assert d['providerContract']['maxOutputTokens']==8192
          assert d['usage']['output_tokens']==8192
          assert d['usage']['output_tokens_details']['reasoning_tokens']==8166
          PY
          OUT="${RUNNER_TEMP}/retry35-preflight"
          python "$BASE/run_stage1_v5_flex16384_retry35_v1.py" \
            --source-prep-root "${RUNNER_TEMP}/v5-source" \
            --flex-prep-root "${RUNNER_TEMP}/v5-flex" \
            --output-dir "$OUT" \
            --harness-source-commit "$GITHUB_SHA" \
            --ingester "$LEARNED/ingest_provider_response_v5.py" \
            --preflight-only
          python - "$OUT/stage1-v5-flex16384-retry35-case-status-v1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['classification']=='offline_preflight_complete_no_provider_call'
          assert d['providerCallAttempted'] is False
          assert d['semanticPayloadUnchanged'] is True
          assert d['transportOnlyChange']=={'field':'max_output_tokens','from':8192,'to':16384}
          PY

      - name: Execute one authorized ordinal-35 Flex 16384 retry
        id: execute
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "${RUNNER_TEMP}/retry35-live"
          python "$BASE/run_stage1_v5_flex16384_retry35_v1.py" \
            --source-prep-root "${RUNNER_TEMP}/v5-source" \
            --flex-prep-root "${RUNNER_TEMP}/v5-flex" \
            --output-dir "${RUNNER_TEMP}/retry35-live" \
            --harness-source-commit "$GITHUB_SHA" \
            --ingester "$LEARNED/ingest_provider_response_v5.py" \
            --timeout-seconds 900
          rc=$?
          echo "runner_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Classify immutable retry evidence
        id: classify
        if: always() && steps.execute.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          status="${RUNNER_TEMP}/retry35-live/stage1-v5-flex16384-retry35-case-status-v1.json"
          test -f "$status"
          category="$(python - "$status" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print('completed' if d.get('providerCompletedSemanticResponse') is True else 'attempted-no-completed-response')
          PY
          )"
          echo "artifact_name=trackcade-semantic-external-stage1-v5-flex16384-retry35-v1-case-35-${category}" >> "$GITHUB_OUTPUT"
          cat "$status"

      - name: Freeze immutable retry evidence
        if: always() && steps.classify.outputs.artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.classify.outputs.artifact_name }}
          path: ${{ runner.temp }}/retry35-live
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce completion and no silent further retry
        if: always() && steps.execute.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          python - "${RUNNER_TEMP}/retry35-live/stage1-v5-flex16384-retry35-case-status-v1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['additionalRetryAuthorized'] is False
          assert d['standardFallbackUsed'] is False
          assert d['terminalTracksProcessed'] is False
          assert d['compilerInvoked'] is False
          assert d['providerContract']['maxOutputTokens']==16384
          assert d['providerContract']['serviceTier']=='flex'
          if d.get('providerCompletedSemanticResponse') is not True:
            raise SystemExit('Ordinal 35 retry did not complete. Stop; no further retry or continuation is authorized.')
          if d.get('observedProviderServiceTier') != 'flex':
            raise SystemExit('Ordinal 35 retry did not observe Flex. Stop.')
          allowed={
            'provider_completed_validated_v5_flex16384_retry35_proposal_no_further_retry',
            'provider_completed_v5_flex16384_retry35_validation_failure_no_further_retry',
          }
          if d.get('classification') not in allowed:
            raise SystemExit('Ordinal 35 retry completed outside allowed classification; stop.')
          PY
