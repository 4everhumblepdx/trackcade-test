name: Trackcade V3 — Serialized batch resume (max 3)

on:
  workflow_dispatch:
    inputs:
      ordinals:
        description: 'Select experiment branch; 1-3 missing development ordinals, comma-separated'
        required: true
        type: string

permissions:
  contents: read

jobs:
  registration-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse provider execution from registration branch
        run: |
          echo 'Registration only. Select trackcade-semantic-external-holdout-v1 for the guarded serialized workflow.'
          exit 1
