name: Trackcade Gameplay v1 — Jump-Aware Proof

on:
  push:
    branches: [trackcade-gameplay-difficulty-v1]
    paths:
      - '.github/workflows/trackcade-gameplay-v1-jump-aware.yml'
      - 'research/gameplay-v1/GAMEPLAY_JUMP_AWARE_SPEC.md'
      - 'research/gameplay-v1/audit_jump_aware_v1.mjs'
      - 'research/gameplay-v1/run_jump_aware_v1.mjs'
      - 'research/gameplay-v1/audit_gameplay_v1.mjs'
      - 'src/track/loader.js'
      - 'src/logic/director.js'
      - 'src/logic/difficulty.js'
      - 'src/logic/spawner.js'
      - 'src/track.config.js'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download exact closed Structure v1 safe manifests
        uses: actions/download-artifact@v4
        with:
          name: trackcade-structure-v1-safe-generated-manifests
          path: safe
          repository: 4everhumblepdx/trackcade-test
          run-id: 36281637484
          github-token: ${{ github.token }}

      - name: Materialize frozen minimal fixtures and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixtures evidence
          node --experimental-default-type=module --input-type=module <<'JS'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('safe/cvb-gemf-auto-safe-v1.json', 'utf8'));
          const keep = ['artist','title','audioUrl','bpm','beatOffset','songLength','events','energyCurve','generation'];
          const minimal = Object.fromEntries(keep.map(k => [k, source[k]]));
          fs.writeFileSync('fixtures/cvb-gemf-minimal.json', JSON.stringify(minimal, null, 2) + '\n');
          JS
          cat > evidence/provenance.json <<'JSON'
          {
            "structureSafeManifestRun": 36281637484,
            "structureSafeManifestArtifactId": 10918568524,
            "structureSafeManifestArtifactDigest": "sha256:10a67643cf985652c2a5974f59f0b95183ee0f2921253e525b8945eceae63c87",
            "analyzerReleaseBranch": "release/analyzer-v0.19",
            "analyzerSourceCommit": "e308d867980fb1877c3f2e4ce27950deecac0855",
            "analyzerRunnerSha256": "9d579842207a1482ef6d12d34d6d82d03b02021d88de65c19abaf41f8692f432",
            "jumpAwarePreregisteredCommit": "13c0e663344db3861bae8fb2ddee9f61bb9ba096"
          }
          JSON

      - name: Run complete preregistered jump-aware matrix twice
        shell: bash
        run: |
          set -euo pipefail
          node research/gameplay-v1/run_jump_aware_v1.mjs \
            --alldat safe/alldat-minimal-auto-safe-v1.json \
            --cvb fixtures/cvb-gemf-minimal.json \
            --output jump/a
          node research/gameplay-v1/run_jump_aware_v1.mjs \
            --alldat safe/alldat-minimal-auto-safe-v1.json \
            --cvb fixtures/cvb-gemf-minimal.json \
            --output jump/b

      - name: Prove deterministic duplicate outputs
        shell: bash
        run: |
          set -euo pipefail
          diff -qr jump/a jump/b

      - name: Validate and summarize jump-aware evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='jump/a/jump-aware-summary.json'
          x=json.load(open(p))
          assert x['schema']=='trackcade-gameplay-jump-aware-matrix-v1',x.get('schema')
          assert x['preregistration']['commit']=='13c0e663344db3861bae8fb2ddee9f61bb9ba096'
          assert x['preregistration']['profiles']==5
          assert x['preregistration']['fixtures']==2
          assert x['preregistration']['proofsPerPass']==10
          assert x['provenanceValid'] is True
          assert x['controlsPass'] is True
          assert len(x['profiles'])==5
          assert {r['id'] for r in x['profiles']}=={
              'default','lane-0.16','lane-0.20','lane-0.24','fast-dense-tight-lanes'
          }
          allowed={'jump_aware_pass','jump_aware_unresolved','model_mismatch','out_of_scope'}
          for row in x['profiles']:
              assert set(row['fixtures'])=={'alldat','cvb-gemf'}
              for f in row['fixtures'].values():
                  assert f['status'] in allowed,(row['id'],f['status'])
                  assert f['selfConsistencyPass'] is True,(row['id'],f)
                  assert f['runtime']['jumpTime']==0.58,(row['id'],f['runtime']['jumpTime'])
                  assert f['runtime']['jumpHeight']==46,(row['id'],f['runtime']['jumpHeight'])
                  assert f['runtime']['hitDepth']==10,(row['id'],f['runtime']['hitDepth'])
              if row['role']=='control':
                  assert all(f['baselineStatus']=='qc_pass' for f in row['fixtures'].values()),row['id']
                  assert all(f['status']=='jump_aware_pass' for f in row['fixtures'].values()),row['id']
              else:
                  assert all(f['baselineStatus']=='needs_jump_aware_analysis' for f in row['fixtures'].values()),row['id']
          for row in x['profiles']:
              print(row['id'], row['role'], row['crossFixtureJumpPass'], {
                  name: {
                      'status': f['status'],
                      'baseline': f['baselineStatus'],
                      'states': f['maxReachableStates'],
                      'deadRow': f['firstDeadRow'],
                      'candidates': f['candidateJumpStarts'],
                  }
                  for name,f in row['fixtures'].items()
              })
          PY
          sha256sum jump/a/jump-aware-summary.json > evidence/summary-sha256.txt
          find jump/a/proofs -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > evidence/proof-sha256.txt
          sha256sum \
            research/gameplay-v1/GAMEPLAY_JUMP_AWARE_SPEC.md \
            research/gameplay-v1/audit_jump_aware_v1.mjs \
            research/gameplay-v1/run_jump_aware_v1.mjs \
            research/gameplay-v1/audit_gameplay_v1.mjs \
            > evidence/jump-source-sha256.txt
          cat evidence/summary-sha256.txt
          cat evidence/jump-source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: trackcade-gameplay-v1-jump-aware-proof
          path: |
            jump/a/jump-aware-summary.json
            jump/a/proofs/**/*.json
            evidence/provenance.json
            evidence/summary-sha256.txt
            evidence/proof-sha256.txt
            evidence/jump-source-sha256.txt
            research/gameplay-v1/GAMEPLAY_JUMP_AWARE_SPEC.md
            research/gameplay-v1/audit_jump_aware_v1.mjs
            research/gameplay-v1/run_jump_aware_v1.mjs
          if-no-files-found: error
          retention-days: 30
