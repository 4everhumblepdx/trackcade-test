name: Trackcade V6 — Offline 50/50 generation freeze

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - research/semantic-external-holdout-v1/STAGE1_V6_GENERATION_FREEZE_ACTIVATE_V1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: trackcade-v6-generation-freeze-v1
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE: research/semantic-external-holdout-v1
      ACTIVATE_PATH: research/semantic-external-holdout-v1/STAGE1_V6_GENERATION_FREEZE_ACTIVATE_V1.json
      COLLECTOR: research/semantic-external-holdout-v1/collect_stage1_v6_results_v1.py
      COLLECTOR_BLOB: 7a8d740dbd3395725c30506d0554375569d1eeb5
      SOURCE_RUN_ID: '36747819119'
      SOURCE_NAME: trackcade-semantic-external-stage1-v6-prep-v1
      SOURCE_MANIFEST_SHA256: ebdbf2232a813dbe89b87f4fb3bd938f037d6f15707943c2c0b639a15bc202c8
      SOURCE_FILES_SHA256: a8a81dca2fd4f9c5297ebbe594f5144f28f9ae2a7542066db3a3169cd07d1e35
      FLEX_RUN_ID: '36752768892'
      FLEX_NAME: trackcade-semantic-external-stage1-v6-flex8192-prep-v1
      FLEX_MANIFEST_SHA256: de9328b8cba76b82f879e348cc0b0133d33f53d2855b67885d3ed2b96afb9058
      FLEX_FILES_SHA256: b272332f49f4da3ee72ac53dc89e6e544e76c609d03e9c7c7fe35ebc02da4777
      CANARY_RUN_ID: '36758887107'
      CANARY_ARTIFACT_ID: '11116764479'
      CANARY_ARTIFACT_NAME: trackcade-semantic-external-stage1-v6-canary-v1-case-01-completed-valid
      CANARY_ARTIFACT_DIGEST: sha256:18a1200c9f77f3cc74a7844680168e8f86c7cfdd6b13cc5c9da3a014fcffaf41

    steps:
      - name: Sparse checkout freeze inputs only — no reference labels
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            research/semantic-external-holdout-v1/collect_stage1_v6_results_v1.py
            research/semantic-external-holdout-v1/STAGE1_V6_GENERATION_FREEZE_ACTIVATE_V1.json
          sparse-checkout-cone-mode: false

      - name: Prove offline activation and label-blind workspace
        shell: bash
        run: |
          set -euo pipefail
          if env | grep -q '^OPENAI_API_KEY='; then
            echo 'OPENAI_API_KEY must not exist in V6 generation-freeze job' >&2
            exit 1
          fi
          test -f "$COLLECTOR"
          test -f "$ACTIVATE_PATH"
          test ! -e "$BASE/REFERENCE_DROPS_V3.json"
          test "$(git hash-object "$COLLECTOR")" = "$COLLECTOR_BLOB"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$ACTIVATE_PATH"
          python - <<'PY'
          import json, os
          d=json.load(open(os.environ['ACTIVATE_PATH']))
          assert d['schema']=='trackcade-semantic-external-stage1-v6-generation-freeze-activation-v1'
          assert d['activateOfflineFreeze'] is True
          assert d['expectedCompletedOrdinals']==list(range(1,51))
          assert d['ordinal1Source']=='frozen-canary'
          assert d['remainingOrdinals']==list(range(2,51))
          assert d['providerCallsAuthorizedByFreeze'] is False
          assert d['stage1ReferenceAccessAuthorizedByFreeze'] is False
          assert d['partialScoringAuthorizedByFreeze'] is False
          assert d['terminalHoldoutAccessAuthorizedByFreeze'] is False
          assert d['compilerInvocationAuthorizedByFreeze'] is False
          assert d['analyzerExecutionAuthorizedByFreeze'] is False
          print('Offline V6 generation-freeze activation verified')
          PY

      - name: Download exact frozen V6 semantic prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_NAME }}
          path: ${{ runner.temp }}/v6-source
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download exact frozen V6 Flex prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLEX_NAME }}
          path: ${{ runner.temp }}/v6-flex
          repository: ${{ github.repository }}
          run-id: ${{ env.FLEX_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify frozen prep closure
        shell: bash
        run: |
          set -euo pipefail
          echo "${SOURCE_MANIFEST_SHA256}  ${RUNNER_TEMP}/v6-source/STAGE1_V6_PREP_MANIFEST_V1.json" | sha256sum -c -
          echo "${SOURCE_FILES_SHA256}  ${RUNNER_TEMP}/v6-source/FILES_SHA256.txt" | sha256sum -c -
          echo "${FLEX_MANIFEST_SHA256}  ${RUNNER_TEMP}/v6-flex/STAGE1_V6_FLEX8192_PREP_MANIFEST_V1.json" | sha256sum -c -
          echo "${FLEX_FILES_SHA256}  ${RUNNER_TEMP}/v6-flex/FILES_SHA256.txt" | sha256sum -c -

      - name: Build canonical 50-case inventory and download immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/v6-artifacts" "${RUNNER_TEMP}/v6-freeze-input"
          python - <<'PY'
          import json, os, pathlib, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v6-artifacts'
          inv_path=pathlib.Path(os.environ['RUNNER_TEMP'])/'v6-freeze-input'/'STAGE1_V6_GENERATION_SOURCE_INVENTORY_V1.json'
          def gh(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          cases=[]; seen=set()

          # Ordinal 1 is the exact already-frozen canary and may never be regenerated here.
          ca=gh(f"repos/{repo}/actions/artifacts/{os.environ['CANARY_ARTIFACT_ID']}")
          assert ca['id']==int(os.environ['CANARY_ARTIFACT_ID'])
          assert ca['name']==os.environ['CANARY_ARTIFACT_NAME']
          assert ca['digest']==os.environ['CANARY_ARTIFACT_DIGEST'] and ca['expired'] is False
          assert ca['workflow_run']['id']==int(os.environ['CANARY_RUN_ID'])
          cr=gh(f"repos/{repo}/actions/runs/{os.environ['CANARY_RUN_ID']}")
          assert cr['run_attempt']==1 and cr['head_branch']=='trackcade-semantic-external-holdout-v1'
          assert cr['status']=='completed' and cr['conclusion']=='success'
          assert ca['workflow_run']['head_sha']==cr['head_sha']
          selected_run={k:cr[k] for k in ('id','run_attempt','head_branch','head_sha','status','conclusion')}
          selected_art={k:ca[k] for k in ('id','name','size_in_bytes','digest','expired','workflow_run')}
          cases.append({'ordinal':1,'run':selected_run,'artifact':selected_art}); seen.add(ca['id'])
          with (root/f"{ca['id']}.zip").open('wb') as f:
              subprocess.run(['gh','api',f"repos/{repo}/actions/artifacts/{ca['id']}/zip"],stdout=f,check=True)

          # Ordinals 2-50 must each have exactly one active completed-valid remaining49 artifact.
          for ordinal in range(2,51):
              name=f'trackcade-semantic-external-stage1-v6-remaining49-v1-case-{ordinal:02d}-completed-valid'
              data=gh(f'repos/{repo}/actions/artifacts?name={name}&per_page=100')
              assert data['total_count']==1, (ordinal,'duplicate or expired completed evidence')
              active=[a for a in data.get('artifacts',[]) if not a.get('expired')]
              assert len(active)==1, (ordinal,name,len(active))
              art=active[0]
              assert art['id'] not in seen; seen.add(art['id'])
              assert art['name']==name and isinstance(art.get('digest'),str) and art['digest'].startswith('sha256:')
              run_id=art['workflow_run']['id']; run=gh(f'repos/{repo}/actions/runs/{run_id}')
              assert run['run_attempt']==1 and run['head_branch']=='trackcade-semantic-external-holdout-v1'
              assert run['status']=='completed' and run['conclusion'] in {'success','failure'}
              assert art['workflow_run']['head_sha']==run['head_sha']
              for suffix in ('attempted-no-valid-response','local-no-provider-attempt','reserved-no-final-status'):
                  bad=gh(f'repos/{repo}/actions/artifacts?name=trackcade-semantic-external-stage1-v6-remaining49-v1-case-{ordinal:02d}-{suffix}&per_page=100')
                  assert bad['total_count']==0, (ordinal,'conflicting failed attempt evidence')
              locks=gh(f'repos/{repo}/actions/artifacts?name=trackcade-semantic-external-stage1-v6-remaining49-v1-case-{ordinal:02d}-attempt-lock&per_page=100')
              assert locks['total_count']==1 and len(locks['artifacts'])==1, (ordinal,'reservation count')
              lock=locks['artifacts'][0]
              assert lock['expired'] is False and lock['workflow_run']['id']==run_id and lock['workflow_run']['head_sha']==run['head_sha']
              selected_lock={k:lock[k] for k in ('id','name','size_in_bytes','digest','expired','workflow_run')}
              selected_run={k:run[k] for k in ('id','run_attempt','head_branch','head_sha','status','conclusion')}
              selected_art={k:art[k] for k in ('id','name','size_in_bytes','digest','expired','workflow_run')}
              cases.append({'ordinal':ordinal,'run':selected_run,'artifact':selected_art,'attemptLock':selected_lock})
              with (root/f"{art['id']}.zip").open('wb') as f:
                  subprocess.run(['gh','api',f"repos/{repo}/actions/artifacts/{art['id']}/zip"],stdout=f,check=True)
          assert len(cases)==50 and [c['ordinal'] for c in cases]==list(range(1,51)) and len(seen)==50
          inv={'schema':'trackcade-stage1-v6-generation-source-inventory-v1','cases':cases}
          inv_path.write_text(json.dumps(inv,indent=2,sort_keys=True)+'\n')
          print('canonical V6 cases:',len(cases),'unique artifacts:',len(seen))
          PY

      - name: Freeze complete V6 generation before any reference access
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$BASE/REFERENCE_DROPS_V3.json"
          rm -rf "${RUNNER_TEMP}/v6-generation-freeze"
          python "$COLLECTOR" \
            --source-prep-root "${RUNNER_TEMP}/v6-source" \
            --flex-prep-root "${RUNNER_TEMP}/v6-flex" \
            --artifact-root "${RUNNER_TEMP}/v6-artifacts" \
            --inventory "${RUNNER_TEMP}/v6-freeze-input/STAGE1_V6_GENERATION_SOURCE_INVENTORY_V1.json" \
            --output-dir "${RUNNER_TEMP}/v6-generation-freeze"
          test ! -e "$BASE/REFERENCE_DROPS_V3.json"

      - name: Audit complete V6 freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'v6-generation-freeze'
          f=json.loads((out/'STAGE1_V6_GENERATION_FREEZE_V1.json').read_text())
          assert f['schema']=='trackcade-semantic-external-stage1-v6-generation-freeze-v1'
          assert f['status']=='frozen-complete-v6-generation-before-reference-access'
          assert f['trackCount']==50 and f['referenceLabelsReadByFreeze'] is False
          assert f['partialScoringPerformed'] is False and f['terminalTracksProcessed'] is False
          assert f['compilerInvoked'] is False and f['analyzerExecuted'] is False and f['providerCallsByFreeze']==0
          assert [c['ordinal'] for c in f['cases']]==list(range(1,51))
          assert f['cases'][0]['variant']=='canary'
          assert all(c['variant']=='remaining49' for c in f['cases'][1:])
          assert len({c['openaiResponseId'] for c in f['cases']})==50
          assert len({c['artifact']['id'] for c in f['cases']})==50
          assert len(list((out/'proposals').glob('*.json')))==50
          print('usage totals:',json.dumps(f['usageTotals'],sort_keys=True))
          for p in sorted(out.rglob('*')):
              if p.is_file(): print(hashlib.sha256(p.read_bytes()).hexdigest(),p.relative_to(out))
          PY
          test ! -e "$BASE/REFERENCE_DROPS_V3.json"

      - name: Upload immutable complete V6 generation freeze
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v6-generation-freeze-v1
          path: ${{ runner.temp }}/v6-generation-freeze
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
