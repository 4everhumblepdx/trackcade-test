name: Trackcade Semantic External Holdout v1 — Freeze Corpus Split

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - research/semantic-external-holdout-v1/download_osf_split_v1.py
      - research/semantic-external-holdout-v1/validate_select_corpus_v1.py
      - research/semantic-external-holdout-v1/CANDIDATE_PAIRS_V1.json
      - research/semantic-external-holdout-v1/OSF_INVENTORY_V1.json
      - research/semantic-external-holdout-v1/OSF_SPLIT_ZIP_INDEX_V1.json
      - .github/workflows/trackcade-semantic-external-freeze-split-v1.yml

permissions:
  contents: write

jobs:
  freeze-corpus-split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: trackcade-semantic-external-holdout-v1
          fetch-depth: 0

      - name: Verify existing frozen split and exit if complete
        id: frozen
        shell: bash
        run: |
          set -euo pipefail
          BASE='research/semantic-external-holdout-v1'
          FILES=(
            CORPUS_ELIGIBILITY_V1.json
            SPLIT_V1.json
            REFERENCE_DROPS_V1.json
          )
          complete=1
          for name in "${FILES[@]}"; do
            if [[ ! -f "$BASE/$name" || ! -f "$BASE/$name.sha256" ]]; then
              complete=0
              break
            fi
            expected="$(awk '{print $1}' "$BASE/$name.sha256")"
            actual="$(sha256sum "$BASE/$name" | awk '{print $1}')"
            if [[ "$expected" != "$actual" ]]; then
              echo "ERROR: frozen $name does not match its SHA-256 sidecar." >&2
              exit 1
            fi
          done
          if [[ "$complete" == 1 ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('research/semantic-external-holdout-v1')
          split = json.loads((base / 'SPLIT_V1.json').read_text())
          s1 = split.get('stage1') or []
          terminal = split.get('terminal') or []
          assert len(s1) == 50, len(s1)
          assert len(terminal) == 50, len(terminal)
          assert not ({x['id'] for x in s1} & {x['id'] for x in terminal})
          print('Frozen split already complete and verified; no corpus download required.')
          PY
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install corpus validation dependencies
        if: steps.frozen.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg p7zip-full
          python3 -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1'
          ffmpeg -version | head -1
          ffprobe -version | head -1
          7z | head -3 || true
          python3 - <<'PY'
          import platform, numpy, scipy
          print('python', platform.python_version())
          print('numpy', numpy.__version__)
          print('scipy', scipy.__version__)
          PY
          df -h "$RUNNER_TEMP"

      - name: Download and cryptographically verify all split ZIP segments
        if: steps.frozen.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE='research/semantic-external-holdout-v1'
          PARTS="$RUNNER_TEMP/osf-parts"
          VERIFY="$RUNNER_TEMP/SPLIT_DOWNLOAD_VERIFICATION_V1.json"
          mkdir -p "$PARTS"
          python3 "$BASE/download_osf_split_v1.py" \
            --inventory "$BASE/OSF_INVENTORY_V1.json" \
            --output-dir "$PARTS" \
            --verification-output "$VERIFY" \
            --workers 4
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'SPLIT_DOWNLOAD_VERIFICATION_V1.json'
          d = json.loads(p.read_text())
          assert d['segmentCount'] == 16, d['segmentCount']
          print('Verified split archive bytes:', d['totalBytes'])
          PY

      - name: Extract complete split ZIP corpus
        if: steps.frozen.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PARTS="$RUNNER_TEMP/osf-parts"
          CORPUS="$RUNNER_TEMP/osf-corpus"
          mkdir -p "$CORPUS"
          7z x "$PARTS/mp3s_soundcloud_cc_event_detection.zip" -o"$CORPUS" -y
          test -d "$CORPUS/mp3s_soundcloud_cc_event_detection"
          echo "Extracted files: $(find "$CORPUS" -type f | wc -l)"
          df -h "$RUNNER_TEMP"

      - name: Validate corpus and deterministically freeze Stage 1 plus terminal split
        if: steps.frozen.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE='research/semantic-external-holdout-v1'
          CORPUS="$RUNNER_TEMP/osf-corpus"
          OUT="$RUNNER_TEMP/frozen-split"
          mkdir -p "$OUT"
          python3 "$BASE/validate_select_corpus_v1.py" \
            --pairs "$BASE/CANDIDATE_PAIRS_V1.json" \
            --index "$BASE/OSF_SPLIT_ZIP_INDEX_V1.json" \
            --corpus-root "$CORPUS" \
            --output-dir "$OUT" \
            --burned-audio 'ALLDAT_ruffmix.mp3' \
            --burned-audio 'research/semantic-quality-v1/fixtures/cvb-gemf-sample.mp3' \
            --workers 4

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'frozen-split'
          eligibility = json.loads((out / 'CORPUS_ELIGIBILITY_V1.json').read_text())
          split = json.loads((out / 'SPLIT_V1.json').read_text())
          refs = json.loads((out / 'REFERENCE_DROPS_V1.json').read_text())
          assert eligibility['status'] == 'frozen-before-any-model-output-on-corpus'
          assert split['status'] == 'frozen-before-any-model-output-on-corpus'
          assert refs['status'] == 'frozen-before-any-model-output-on-corpus'
          assert len(split['stage1']) == 50
          assert len(split['terminal']) == 50
          assert not ({x['id'] for x in split['stage1']} & {x['id'] for x in split['terminal']})
          assert len(refs['stage1']) == 50
          assert len(refs['terminal']) == 50
          print(json.dumps({
              'eligibility': eligibility['summary'],
              'split': split['summary'],
          }, indent=2, sort_keys=True))
          PY

      - name: Commit first frozen eligibility and split
        if: steps.frozen.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE='research/semantic-external-holdout-v1'
          OUT="$RUNNER_TEMP/frozen-split"
          for name in \
            CORPUS_ELIGIBILITY_V1.json \
            CORPUS_ELIGIBILITY_V1.json.sha256 \
            SPLIT_V1.json \
            SPLIT_V1.json.sha256 \
            REFERENCE_DROPS_V1.json \
            REFERENCE_DROPS_V1.json.sha256; do
            test ! -e "$BASE/$name" || {
              echo "ERROR: refusing to overwrite pre-existing frozen file $BASE/$name" >&2
              exit 1
            }
            mv "$OUT/$name" "$BASE/$name"
          done

          git add \
            "$BASE/CORPUS_ELIGIBILITY_V1.json" \
            "$BASE/CORPUS_ELIGIBILITY_V1.json.sha256" \
            "$BASE/SPLIT_V1.json" \
            "$BASE/SPLIT_V1.json.sha256" \
            "$BASE/REFERENCE_DROPS_V1.json" \
            "$BASE/REFERENCE_DROPS_V1.json.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze external semantic Stage 1 and terminal split [skip ci]'
          git push origin HEAD:trackcade-semantic-external-holdout-v1
