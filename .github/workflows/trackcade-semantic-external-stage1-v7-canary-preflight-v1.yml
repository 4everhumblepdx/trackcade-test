name: Trackcade V7 — Offline Canary Preflight

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - .github/workflows/trackcade-semantic-external-stage1-v7-canary-preflight-v1.yml
      - research/semantic-external-holdout-v1/prepare_stage1_v7_canary_case_v1.py
      - research/semantic-external-holdout-v1/STAGE1_V7_CANARY_PROVIDER_AUTHORIZATION_V1.json
      - research/semantic-external-holdout-v1/STAGE1_V7_CANARY_PROVIDER_ACTIVATION_TEMPLATE_V1.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trackcade-stage1-v7-canary-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/trackcade-semantic-external-holdout-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: '36915758639'
      SOURCE_ARTIFACT_ID: '11189967853'
      SOURCE_ARTIFACT_NAME: trackcade-semantic-external-stage1-v7-prep-v1
      SOURCE_ARTIFACT_DIGEST: sha256:4da778967c39796fa6fc475552b82b07594bcf8208a52cc479da43506fa8026a
      SOURCE_HEAD_SHA: f83e4de05fda7741479675f475be75eee800b5d8
      SOURCE_MANIFEST_SHA256: 455602ea8c5a721fac9b3381aca46285fe3c14f1fbcc36f0d08b4ffec01be875
      SOURCE_FILES_SHA256: 9a55eff093ac8552ef8868c60d410b0b6ade0e243c11a5588066c9d16d9f3672
      FLEX_RUN_ID: '36920081360'
      FLEX_ARTIFACT_ID: '11191402965'
      FLEX_ARTIFACT_NAME: trackcade-semantic-external-stage1-v7-flex8192-prep-v1
      FLEX_ARTIFACT_DIGEST: sha256:ff315c7433213cf8de4a475fcdbc95c88a7c4dfbf5685077a9a8112f3a3fdb95
      FLEX_HEAD_SHA: 307e53261035812617fede7429a2d82dde8c2479
      FLEX_MANIFEST_SHA256: a41fdd4e4138fdfda18cda20004f609eb089aeb64ed1be486ee2442b1241a713
      FLEX_FILES_SHA256: 18805ff58dd5580a7002bc9f7d3a9fa5042539f80ae4b7d1c8a9ddc62e1668f0
      AUTH_PATH: research/semantic-external-holdout-v1/STAGE1_V7_CANARY_PROVIDER_AUTHORIZATION_V1.json
      TEMPLATE_PATH: research/semantic-external-holdout-v1/STAGE1_V7_CANARY_PROVIDER_ACTIVATION_TEMPLATE_V1.json

    steps:
      - name: Checkout only provider-free preflight inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/semantic-external-holdout-v1/prepare_stage1_v7_canary_case_v1.py
            research/semantic-external-holdout-v1/STAGE1_V7_CANARY_PROVIDER_AUTHORIZATION_V1.json
            research/semantic-external-holdout-v1/STAGE1_V7_CANARY_PROVIDER_ACTIVATION_TEMPLATE_V1.json
            .github/workflows/trackcade-semantic-external-stage1-v7-canary-preflight-v1.yml

      - name: Prove no spend surface exists in preflight
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test ! -e research/semantic-external-holdout-v1/STAGE1_V7_CANARY_PROVIDER_ACTIVATE_V1.json
          test ! -e research/semantic-external-holdout-v1/REFERENCE_DROPS_V3.json
          ! find . -type f -iname '*terminal*' -print -quit | grep -q .
          python -m py_compile research/semantic-external-holdout-v1/prepare_stage1_v7_canary_case_v1.py
          if grep -Eq 'api\.openai\.com|client\.responses\.create|OpenAI\(|perform_request\(' research/semantic-external-holdout-v1/prepare_stage1_v7_canary_case_v1.py; then
            echo 'Provider invocation surface found in offline canary preflight builder' >&2
            exit 1
          fi
          python - <<'PY'
          import json, os
          auth=json.load(open(os.environ['AUTH_PATH']))
          template=json.load(open(os.environ['TEMPLATE_PATH']))
          assert auth['schema']=='trackcade-semantic-external-stage1-v7-canary-provider-authorization-v1'
          assert auth['status']=='staged-not-authorized'
          assert auth['authorized'] is False
          assert auth['authorizationSource'] is None
          assert auth['scope']['canaryOrdinal']==1
          assert auth['scope']['maximumInitialProviderAttempts']==1
          assert auth['scope']['automaticRetriesAuthorized'] is False
          assert auth['scope']['standardFallbackAuthorized'] is False
          assert auth['scope']['fullBatchAuthorized'] is False
          assert auth['scope']['partialScoringAuthorized'] is False
          assert auth['providerContract']=={
            'provider':'openai','api':'responses','model':'gpt-6-sol','reasoningEffort':'high',
            'maxOutputTokens':8192,'serviceTier':'flex','store':False,
          }
          rb=auth['researchBoundary']
          assert rb['terminalHoldoutAccessAuthorized'] is False
          assert rb['analyzerExecutionAuthorized'] is False
          assert rb['analyzerChangesAuthorized'] is False
          assert rb['compilerInvocationAuthorized'] is False
          assert rb['referenceLabelAccessAuthorized'] is False
          assert rb['scoringAuthorized'] is False
          assert template['schema']=='trackcade-semantic-external-stage1-v7-canary-provider-activation-v1'
          assert template['activatePaidCanary'] is False
          assert template['maximumProviderAttempts']==1
          assert template['automaticRetriesAuthorized'] is False
          assert template['standardFallbackAuthorized'] is False
          assert template['fullBatchAuthorized'] is False
          assert template['referenceLabelAccessAuthorized'] is False
          assert template['scoringAuthorized'] is False
          assert template['terminalHoldoutAccessAuthorized'] is False
          assert template['analyzerExecutionAuthorized'] is False
          assert template['analyzerChangesAuthorized'] is False
          assert template['compilerInvocationAuthorized'] is False
          assert template['providerContract']==auth['providerContract']
          print('V7 canary authorization and activation template are inert')
          PY

      - name: Verify exact frozen artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          specs=[
            ('SOURCE','SOURCE_ARTIFACT_ID','SOURCE_ARTIFACT_NAME','SOURCE_ARTIFACT_DIGEST','SOURCE_RUN_ID','SOURCE_HEAD_SHA'),
            ('FLEX','FLEX_ARTIFACT_ID','FLEX_ARTIFACT_NAME','FLEX_ARTIFACT_DIGEST','FLEX_RUN_ID','FLEX_HEAD_SHA'),
          ]
          for label,idk,namek,digestk,runk,headk in specs:
            m=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/artifacts/{os.environ[idk]}"],text=True))
            assert m['id']==int(os.environ[idk]), (label,'id')
            assert m['name']==os.environ[namek], (label,'name')
            assert m['digest']==os.environ[digestk], (label,'digest')
            assert m['expired'] is False, (label,'expired')
            assert m['workflow_run']['id']==int(os.environ[runk]), (label,'run')
            assert m['workflow_run']['head_sha']==os.environ[headk], (label,'head')
          print('Exact V7 semantic and Flex artifacts verified')
          PY

      - name: Download exact frozen V7 semantic prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: /tmp/trackcade-v7-prep
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download exact frozen V7 Flex prep
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLEX_ARTIFACT_NAME }}
          path: /tmp/trackcade-v7-flex8192-prep
          github-token: ${{ github.token }}
          run-id: ${{ env.FLEX_RUN_ID }}

      - name: Verify immutable manifests and construct ordinal-1 canary offline
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          echo "${SOURCE_MANIFEST_SHA256}  /tmp/trackcade-v7-prep/STAGE1_V7_PREP_MANIFEST_V1.json" | sha256sum -c -
          echo "${SOURCE_FILES_SHA256}  /tmp/trackcade-v7-prep/FILES_SHA256.txt" | sha256sum -c -
          echo "${FLEX_MANIFEST_SHA256}  /tmp/trackcade-v7-flex8192-prep/STAGE1_V7_FLEX8192_PREP_MANIFEST_V1.json" | sha256sum -c -
          echo "${FLEX_FILES_SHA256}  /tmp/trackcade-v7-flex8192-prep/FILES_SHA256.txt" | sha256sum -c -
          python research/semantic-external-holdout-v1/prepare_stage1_v7_canary_case_v1.py \
            --source-prep-root /tmp/trackcade-v7-prep \
            --flex-prep-root /tmp/trackcade-v7-flex8192-prep \
            --output-dir /tmp/trackcade-v7-canary-preflight
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/trackcade-v7-canary-preflight/stage1-v7-canary-case-status-v1.json')
          s=json.loads(p.read_text())
          assert s['classification']=='offline_preflight_complete_no_provider_call'
          assert s['providerCallAttempted'] is False
          assert s['providerResponseObserved'] is False
          assert s['proposalValidated'] is False
          assert s['referenceLabelsRead'] is False
          assert s['scoringPerformed'] is False
          assert s['analyzerExecuted'] is False
          assert s['compilerInvoked'] is False
          assert s['terminalTracksProcessed'] is False
          print('Ordinal-1 V7 canary preflight complete with zero provider calls')
          PY

      - name: Upload immutable provider-free V7 canary preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v7-canary-preflight-v1-case-01
          path: /tmp/trackcade-v7-canary-preflight
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
