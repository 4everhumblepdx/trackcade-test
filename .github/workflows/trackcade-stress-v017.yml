name: Trackcade Analyzer Stress v0.17 Smoke

on:
  push:
    branches: [analyzer-stress-v017-volume]
    paths:
      - 'stress/v017/**'
      - '.github/workflows/trackcade-stress-v017.yml'
  workflow_dispatch:

jobs:
  giantsteps-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore and verify exact v0.17 stress tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stress/v017/tools
          cat stress/v017/bundle.part00.fix0 stress/v017/bundle.part00.fix1 stress/v017/bundle.part01 stress/v017/bundle.part02 stress/v017/bundle.part03 stress/v017/bundle.part04 stress/v017/bundle.part05.fix0 stress/v017/bundle.part05.fix1 | base64 -d > stress/v017/tools.tgz
          echo '218067133985608dfdc900a508f6dade652f7f3961f268e670bdf89c05e681d8  stress/v017/tools.tgz' | sha256sum -c -
          tar -xzf stress/v017/tools.tgz -C stress/v017/tools
          echo 'c2ea889eca7506ce58e5989b84cef5406f57e656f670f0e1fb7b5a32870a8703  stress/v017/tools/official-v017-runner.js' | sha256sum -c -
          echo '957d5fb2164528cc801ace5e7afc603e3c23ece47b834176f767ec7f8cfdb2b0  stress/v017/tools/mass_stress.py' | sha256sum -c -
          echo 'dc7418868714bc41ff1da1cab6a16f89274e20a610ce8b7af820a631524e9607  stress/v017/tools/fetch_giantsteps.py' | sha256sum -c -
          node --check stress/v017/tools/official-v017-runner.js
          python -m py_compile stress/v017/tools/mass_stress.py stress/v017/tools/fetch_giantsteps.py

      - name: Install and verify ffmpeg / ffprobe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'

      - name: Fetch 10 labeled GiantSteps tracks
        shell: bash
        run: |
          set +e
          mkdir -p stress-run
          python stress/v017/tools/fetch_giantsteps.py \
            --output stress-run/giantsteps \
            --limit 10 \
            --workers 5 \
            --timeout 120
          code=$?
          echo "$code" > stress-run/fetch_exit_code.txt
          exit 0

      - name: Analyze GiantSteps smoke batch
        shell: bash
        run: |
          set +e
          mkdir -p stress-run/results
          manifest=stress-run/giantsteps/manifest.csv
          if [ -f "$manifest" ] && [ "$(wc -l < "$manifest")" -gt 1 ]; then
            python stress/v017/tools/mass_stress.py \
              --manifest "$manifest" \
              --runner stress/v017/tools/official-v017-runner.js \
              --output stress-run/results \
              --source giantsteps-v2 \
              --jobs 4 \
              --timeout 240 \
              --keep-json anomalies
            code=$?
          else
            echo 'No downloaded audio available for analysis.' | tee stress-run/results/no_audio.txt
            code=2
          fi
          echo "$code" > stress-run/analyze_exit_code.txt
          exit 0

      - name: Print compact result
        if: always()
        shell: bash
        run: |
          echo 'fetch_exit_code:' "$(cat stress-run/fetch_exit_code.txt 2>/dev/null || echo missing)"
          echo 'analyze_exit_code:' "$(cat stress-run/analyze_exit_code.txt 2>/dev/null || echo missing)"
          if [ -f stress-run/results/summary.json ]; then
            cat stress-run/results/summary.json
          fi
          if [ -f stress-run/giantsteps/download_failures.csv ]; then
            echo '--- download failures ---'
            cat stress-run/giantsteps/download_failures.csv
          fi

      - name: Remove downloaded audio before artifact upload
        if: always()
        run: rm -rf stress-run/giantsteps/audio stress-run/results/full

      - name: Upload compact smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-v017-giantsteps-smoke
          path: |
            stress-run/fetch_exit_code.txt
            stress-run/analyze_exit_code.txt
            stress-run/results/summary.json
            stress-run/results/results.jsonl
            stress-run/results/ranked.jsonl
            stress-run/results/deep_probe_queue.csv
            stress-run/results/stress.sqlite3
            stress-run/results/no_audio.txt
            stress-run/giantsteps/manifest.csv
            stress-run/giantsteps/download_failures.csv
          if-no-files-found: warn
          retention-days: 14
