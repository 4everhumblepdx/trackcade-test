name: Trackcade Semantic External Holdout v1 — Audit MAT Anomalies

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - research/semantic-external-holdout-v1/audit_mat_anomalies_v1.py
      - .github/workflows/trackcade-semantic-external-mat-anomaly-audit-v1.yml

permissions:
  contents: write

jobs:
  audit-mat-anomalies:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: trackcade-semantic-external-holdout-v1
          fetch-depth: 0

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1'

      - name: Audit exact MAT files rejected by parser v2
        shell: bash
        run: |
          set -euo pipefail
          BASE='research/semantic-external-holdout-v1'
          OUT="$BASE/MAT_ANOMALY_AUDIT_V1.json"
          SHA="$BASE/MAT_ANOMALY_AUDIT_V1.sha256"
          TMP="$RUNNER_TEMP/MAT_ANOMALY_AUDIT_V1.current.json"
          WORK="$RUNNER_TEMP/osf-mat-anomaly-audit"
          mkdir -p "$WORK"

          python3 "$BASE/audit_mat_anomalies_v1.py" \
            --inventory "$BASE/OSF_INVENTORY_V1.json" \
            --index "$BASE/OSF_SPLIT_ZIP_INDEX_V1.json" \
            --work-dir "$WORK" \
            --output "$TMP"

          if [[ -f "$OUT" ]]; then
            cmp -s "$OUT" "$TMP" || {
              echo 'ERROR: current anomaly audit differs from frozen anomaly audit.' >&2
              exit 1
            }
            test "$(awk '{print $1}' "$SHA")" = "$(sha256sum "$OUT" | awk '{print $1}')"
            exit 0
          fi

          mv "$TMP" "$OUT"
          sha256sum "$OUT" > "$SHA"

      - name: Commit first anomaly audit
        shell: bash
        run: |
          set -euo pipefail
          BASE='research/semantic-external-holdout-v1'
          git add "$BASE/MAT_ANOMALY_AUDIT_V1.json" "$BASE/MAT_ANOMALY_AUDIT_V1.sha256"
          if git diff --cached --quiet; then
            echo 'No anomaly-audit commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze targeted MAT anomaly audit [skip ci]'
          git push origin HEAD:trackcade-semantic-external-holdout-v1
