name: Trackcade Structure v1 — ALLDAT v0.19 Baseline

on:
  push:
    branches: [trackcade-musical-structure-v1]
    paths:
      - '.github/workflows/trackcade-structure-v1-alldat-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi

      - name: Build exact released v0.19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools evidence
          python release/analyzer-v019/build_release.py \
            --output tools/trackcade-analyzer-v0.19.js \
            --manifest evidence/build_manifest.json
          echo '9d579842207a1482ef6d12d34d6d82d03b02021d88de65c19abaf41f8692f432  tools/trackcade-analyzer-v0.19.js' | sha256sum -c -

      - name: Decode ALLDAT deterministically
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -v error -y -i ALLDAT_ruffmix.mp3 -ac 1 -ar 44100 -f f32le -acodec pcm_f32le evidence/alldat.f32
          test -s evidence/alldat.f32

      - name: Run v0.19 on ALLDAT
        shell: bash
        run: |
          set -euo pipefail
          node tools/trackcade-analyzer-v0.19.js evidence/alldat.f32 44100 1 ALLDAT_ruffmix.mp3 > evidence/alldat-v019-analysis.json
          test -s evidence/alldat-v019-analysis.json

      - name: Summarize output contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='evidence/alldat-v019-analysis.json'
          x=json.load(open(p))
          print('top_level_keys=', sorted(x.keys()))
          for key in ('bpm','beatOffset','confidence','duration','timingGuardrail','tempoMap','beats','interactionBeats','meter','downbeats','tactusCandidates'):
              if key in x:
                  v=x[key]
                  if isinstance(v,list):
                      print(key,'count=',len(v),'first=',v[:3])
                  else:
                      print(key,'=',v)
          print('sha256 analysis:')
          PY
          sha256sum evidence/alldat-v019-analysis.json

      - name: Remove raw PCM before upload
        if: always()
        shell: bash
        run: rm -f evidence/alldat.f32 tools/trackcade-analyzer-v0.19.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trackcade-structure-v1-alldat-v019-baseline
          path: |
            evidence/alldat-v019-analysis.json
            evidence/build_manifest.json
          if-no-files-found: error
          retention-days: 30
