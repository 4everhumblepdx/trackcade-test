name: Trackcade v0.19-dev — Ballroom Triple Subdivision Diagnostics

on:
  push:
    branches: [analyzer-stress-v018-ballroom]
    paths:
      - '.github/workflows/trackcade-v019-ballroom-triple-subdivision.yml'
  workflow_dispatch:

jobs:
  ballroom-triple-subdivision:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact v0.18 and build subdivision diagnostic runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stress-run/tools stress-run/data/audio stress-run/data/annotations stress-run/results
          cat stress/v017/bundle.part00.fix0 stress/v017/bundle.part00.fix1 stress/v017/bundle.part01 stress/v017/bundle.part02 stress/v017/bundle.part03 stress/v017/bundle.part04 stress/v017/bundle.part05.fix0 stress/v017/bundle.part05.fix1 | base64 -d > stress-run/tools-v017.tgz
          echo '218067133985608dfdc900a508f6dade652f7f3961f268e670bdf89c05e681d8  stress-run/tools-v017.tgz' | sha256sum -c -
          tar -xzf stress-run/tools-v017.tgz -C stress-run/tools
          python stress/ballroom/patch_v017_to_v018.py stress-run/tools/official-v017-runner.js stress-run/tools/official-v018-runner.js
          echo 'baf6c3701f9b3ccbe67237b04dcca2e9a158f180ceabb6e1c3e9f0b1a8594c15  stress-run/tools/official-v018-runner.js' | sha256sum -c -
          python stress/v019-mirror/patch_v018_add_descriptive_triples.py stress-run/tools/official-v018-runner.js stress-run/tools/official-v019-triple-dev.js
          python stress/v019-meter/patch_add_counterfactual_meter_diagnostics.py stress-run/tools/official-v019-triple-dev.js stress-run/tools/official-v019-meter-dev.js
          python stress/v019-meter/patch_add_triple_subdivision_diagnostics.py stress-run/tools/official-v019-meter-dev.js stress-run/tools/official-v019-subdivision-dev.js
          node --check stress-run/tools/official-v019-subdivision-dev.js
          python -m py_compile stress/v019-meter/run_ballroom_triple_subdivision_diagnostics.py

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Download verified Ballroom audio and beat annotations
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o stress-run/data/data1.tar.gz https://mtg.upf.edu/ismir2004/contest/tempoContest/data1.tar.gz || \
            curl -fL --retry 3 --retry-delay 5 -o stress-run/data/data1.tar.gz http://mtg.upf.edu/ismir2004/contest/tempoContest/data1.tar.gz
          echo '2872a3e52070bc342a4510a95e2fa0b8  stress-run/data/data1.tar.gz' | md5sum -c -
          tar -xzf stress-run/data/data1.tar.gz -C stress-run/data/audio
          curl -fL --retry 3 --retry-delay 3 -o stress-run/data/annotations.tar.gz https://github.com/CPJKU/BallroomAnnotations/archive/refs/heads/master.tar.gz
          tar -xzf stress-run/data/annotations.tar.gz -C stress-run/data/annotations
          total_audio=$(find stress-run/data/audio -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.flac' \) | wc -l)
          total_beats=$(find stress-run/data/annotations -type f -name '*.beats' | wc -l)
          echo "audio_files=$total_audio beat_files=$total_beats"
          test "$total_audio" -ge 698
          test "$total_beats" -ge 698

      - name: Run candidate-level triple subdivision development study
        shell: bash
        run: |
          set -euo pipefail
          python stress/v019-meter/run_ballroom_triple_subdivision_diagnostics.py \
            --audio-root stress-run/data/audio \
            --annotations-root stress-run/data/annotations \
            --baseline-runner stress-run/tools/official-v018-runner.js \
            --dev-runner stress-run/tools/official-v019-subdivision-dev.js \
            --output stress-run/results

      - name: Print evidence summary
        if: always()
        shell: bash
        run: |
          if [ -f stress-run/results/summary.json ]; then cat stress-run/results/summary.json; fi
          if [ -f stress-run/results/errors.json ]; then cat stress-run/results/errors.json; fi
          if [ -f stress-run/results/invariance_failures.json ]; then cat stress-run/results/invariance_failures.json; fi

      - name: Remove corpus audio and Analyzer files before artifact upload
        if: always()
        run: rm -rf stress-run/data/audio stress-run/data/data1.tar.gz stress-run/tools stress-run/tools-v017.tgz

      - name: Upload compact subdivision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-v019-ballroom-triple-subdivision
          path: |
            stress-run/results/tracks.csv
            stress-run/results/candidates.csv
            stress-run/results/summary.json
            stress-run/results/errors.json
            stress-run/results/invariance_failures.json
          if-no-files-found: warn
          retention-days: 14
