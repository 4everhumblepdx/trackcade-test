name: Trackcade v0.19-dev — GiantSteps Triple Regression

on:
  push:
    branches: [analyzer-stress-v018-ballroom]
    paths:
      - '.github/workflows/trackcade-v019-giantsteps-triple-regression.yml'
  workflow_dispatch:

jobs:
  giantsteps-triple-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact v0.18 and apply frozen descriptive triple patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stress-run/tools stress-run/giantsteps stress-run/results
          cat stress/v017/bundle.part00.fix0 stress/v017/bundle.part00.fix1 stress/v017/bundle.part01 stress/v017/bundle.part02 stress/v017/bundle.part03 stress/v017/bundle.part04 stress/v017/bundle.part05.fix0 stress/v017/bundle.part05.fix1 | base64 -d > stress-run/tools-v017.tgz
          echo '218067133985608dfdc900a508f6dade652f7f3961f268e670bdf89c05e681d8  stress-run/tools-v017.tgz' | sha256sum -c -
          tar -xzf stress-run/tools-v017.tgz -C stress-run/tools
          python stress/ballroom/patch_v017_to_v018.py stress-run/tools/official-v017-runner.js stress-run/tools/official-v018-runner.js
          echo 'baf6c3701f9b3ccbe67237b04dcca2e9a158f180ceabb6e1c3e9f0b1a8594c15  stress-run/tools/official-v018-runner.js' | sha256sum -c -
          python stress/v019-mirror/patch_v018_add_descriptive_triples.py stress-run/tools/official-v018-runner.js stress-run/tools/official-v019-triple-dev.js
          node --check stress-run/tools/official-v019-triple-dev.js
          python -m py_compile stress/v019-mirror/run_giantsteps_triple_validation.py

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Fetch pinned GiantSteps metadata
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/GiantSteps/giantsteps-tempo-dataset.git stress-run/giantsteps/repo
          git -C stress-run/giantsteps/repo checkout --detach d51ab2422e76abacfaa86616a57054bc222ec9fd
          test "$(git -C stress-run/giantsteps/repo rev-parse HEAD)" = "d51ab2422e76abacfaa86616a57054bc222ec9fd"
          ann_count=$(find stress-run/giantsteps/repo/annotations/tempo -type f -name '*.bpm' | wc -l)
          md5_count=$(find stress-run/giantsteps/repo/md5 -type f | wc -l)
          echo "tempo_annotations=$ann_count md5_files=$md5_count"
          test "$ann_count" -eq 664
          test "$md5_count" -eq 664

      - name: Download and verify all 664 GiantSteps audio files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stress-run/giantsteps/repo/audio
          export ROOT="$PWD/stress-run/giantsteps/repo"
          python - <<'PY'
          import concurrent.futures, hashlib, os, pathlib, urllib.request
          root=pathlib.Path(os.environ['ROOT'])
          md5_dir=root/'md5'; audio=root/'audio'
          primary='https://www.cp.jku.at/datasets/giantsteps/backup/'
          fallback='http://geo-samples.beatport.com/lofi/'
          items=sorted(md5_dir.iterdir())
          assert len(items)==664, len(items)
          def one(p):
              name=p.stem+'.mp3'; target=audio/name; expected=p.read_text().strip().lower()
              last=None
              for base in (primary,fallback):
                  try:
                      req=urllib.request.Request(base+name,headers={'User-Agent':'TrackcadeRegression/1.0'})
                      with urllib.request.urlopen(req,timeout=90) as r, target.open('wb') as f:
                          while True:
                              b=r.read(1024*1024)
                              if not b: break
                              f.write(b)
                      actual=hashlib.md5(target.read_bytes()).hexdigest().lower()
                      if actual==expected: return name
                      last=f'md5 mismatch {actual} != {expected}'
                  except Exception as e:
                      last=repr(e)
                  target.unlink(missing_ok=True)
              raise RuntimeError(f'{name}: {last}')
          errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              futs={ex.submit(one,p):p for p in items}
              done=0
              for fut in concurrent.futures.as_completed(futs):
                  done+=1
                  try: fut.result()
                  except Exception as e: errors.append(str(e))
                  if done%50==0: print({'downloaded_or_failed':done,'errors':len(errors)},flush=True)
          if errors:
              print('\n'.join(errors[:20])); raise SystemExit(f'FAIL-CLOSED: {len(errors)} GiantSteps downloads failed verification')
          files=list(audio.glob('*.mp3'))
          if len(files)!=664: raise SystemExit(f'FAIL-CLOSED: expected 664 verified audio files, got {len(files)}')
          print({'verified_audio_files':len(files)})
          PY

      - name: Compare exact v0.18 vs descriptive triple dev on all 664 tracks
        shell: bash
        run: |
          set -euo pipefail
          python stress/v019-mirror/run_giantsteps_triple_validation.py \
            --audio-root stress-run/giantsteps/repo/audio \
            --annotations-root stress-run/giantsteps/repo/annotations/tempo \
            --baseline-runner stress-run/tools/official-v018-runner.js \
            --dev-runner stress-run/tools/official-v019-triple-dev.js \
            --output stress-run/results

      - name: Print evidence summary
        if: always()
        shell: bash
        run: |
          if [ -f stress-run/results/summary.json ]; then cat stress-run/results/summary.json; fi
          if [ -f stress-run/results/errors.json ]; then cat stress-run/results/errors.json; fi
          if [ -f stress-run/results/invariance_failures.json ]; then cat stress-run/results/invariance_failures.json; fi

      - name: Remove corpus audio and Analyzer files before artifact upload
        if: always()
        shell: bash
        run: rm -rf stress-run/giantsteps/repo/audio stress-run/giantsteps/repo/.git stress-run/tools stress-run/tools-v017.tgz

      - name: Upload compact GiantSteps triple evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-v019-giantsteps-triple-regression
          path: |
            stress-run/results/results.csv
            stress-run/results/summary.json
            stress-run/results/errors.json
            stress-run/results/invariance_failures.json
          if-no-files-found: warn
          retention-days: 14
