name: Trackcade v0.19-dev — ASAP Triple Holdout Plan

on:
  push:
    branches: [analyzer-stress-v018-ballroom]
    paths:
      - '.github/workflows/trackcade-v019-asap-triple-holdout-plan.yml'
      - 'stress/v019-asap/plan_asap_triple_holdout.py'
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned ASAP v1.2 and MAESTRO v2 metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p holdout/asap holdout/input holdout/output
          git clone --filter=blob:none --no-checkout https://github.com/fosfrancesco/asap-dataset.git holdout/asap
          git -C holdout/asap checkout --detach afc815c75c42e83a79c03feb6da8a35e77d4c6b8
          test "$(git -C holdout/asap rev-parse HEAD)" = 'afc815c75c42e83a79c03feb6da8a35e77d4c6b8'
          curl -fL --retry 3 --retry-delay 3 \
            -o holdout/input/maestro-v2.0.0.csv \
            https://storage.googleapis.com/magentadata/datasets/maestro/v2.0.0/maestro-v2.0.0.csv

      - name: Freeze eligible pure-three-beat population
        shell: bash
        run: |
          set -euo pipefail
          python stress/v019-asap/plan_asap_triple_holdout.py \
            --asap-root holdout/asap \
            --maestro-metadata holdout/input/maestro-v2.0.0.csv \
            --output holdout/output \
            --asap-commit afc815c75c42e83a79c03feb6da8a35e77d4c6b8
          cat holdout/output/summary.json

      - name: Probe targeted MAESTRO retrieval without downloading audio
        shell: bash
        run: |
          set -euo pipefail
          ZIP_URL='https://storage.googleapis.com/magentadata/datasets/maestro/v2.0.0/maestro-v2.0.0.zip'
          FIRST_SOURCE=$(head -n 1 holdout/output/unique_maestro_sources.txt)
          export ZIP_URL FIRST_SOURCE
          python - <<'PY'
          import json, os, subprocess, urllib.parse
          from pathlib import Path

          zip_url=os.environ['ZIP_URL']
          first=os.environ['FIRST_SOURCE']
          direct='https://storage.googleapis.com/magentadata/datasets/maestro/v2.0.0/' + urllib.parse.quote(first, safe='/')

          def head(url):
              p=subprocess.run(['curl','-sS','-L','-I','--max-time','30','-w','\nTRACKCADE_HTTP_CODE:%{http_code}\n',url], text=True, capture_output=True)
              text=(p.stdout or '') + (p.stderr or '')
              code=None
              for line in text.splitlines():
                  if line.startswith('TRACKCADE_HTTP_CODE:'):
                      try: code=int(line.split(':',1)[1])
                      except Exception: pass
              headers={}
              for line in text.splitlines():
                  if ':' in line and not line.startswith('TRACKCADE_HTTP_CODE:'):
                      k,v=line.split(':',1)
                      headers[k.strip().lower()]=v.strip()
              return {'returncode':p.returncode,'http_code':code,'headers':headers}

          # Safe 1-byte range probe. --max-filesize prevents accidental full-ZIP transfer
          # if an intermediary ignores Range.
          rp=subprocess.run([
              'curl','-sS','-L','--range','0-0','--max-filesize','1048576','--max-time','30',
              '-D','holdout/output/zip_range_headers.txt','-o','holdout/output/zip_range_probe.bin',
              '-w','%{http_code}',zip_url
          ], text=True, capture_output=True)
          try: range_code=int((rp.stdout or '').strip()[-3:])
          except Exception: range_code=None
          range_size=Path('holdout/output/zip_range_probe.bin').stat().st_size if Path('holdout/output/zip_range_probe.bin').exists() else 0

          result={
              'maestro_zip_url':zip_url,
              'zip_head':head(zip_url),
              'range_probe_returncode':rp.returncode,
              'range_probe_http_code':range_code,
              'range_probe_bytes_received':range_size,
              'range_probe_supports_safe_partial_fetch':rp.returncode==0 and range_code==206 and range_size==1,
              'first_eligible_source':first,
              'direct_individual_object_url':direct,
              'direct_individual_object_head':head(direct),
          }
          Path('holdout/output/retrieval_probe.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          rm -f holdout/output/zip_range_probe.bin

      - name: Remove cloned repository internals
        if: always()
        shell: bash
        run: rm -rf holdout/asap/.git

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trackcade-v019-asap-triple-holdout-plan
          path: |
            holdout/output/summary.json
            holdout/output/eligible_performances.json
            holdout/output/eligible_performances.csv
            holdout/output/unique_maestro_sources.txt
            holdout/output/retrieval_probe.json
            holdout/output/zip_range_headers.txt
          if-no-files-found: error
          retention-days: 30
