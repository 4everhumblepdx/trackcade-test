name: Trackcade v0.20 Research — V2 Timeout Recovery

on:
  push:
    branches: [analyzer-v020-phase-context]
    paths:
      - '.github/workflows/trackcade-v020-asap-phase-holdout-v2-timeout-recovery.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  recover-shard-1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download exact frozen V2 holdout manifest
        uses: actions/download-artifact@v4
        with:
          name: trackcade-v020-asap-phase-holdout-v2-plan
          path: holdout-plan
          repository: 4everhumblepdx/trackcade-test
          run-id: 36271993835
          github-token: ${{ github.token }}

      - name: Verify frozen experiment and build exact v0.19
        shell: bash
        run: |
          set -euo pipefail
          echo 'b5ae9a419cf3d81bf933d6947a31ec684163731f5e0d91f331dd66c4cafff045  holdout-plan/selected_performances.json' | sha256sum -c -
          python - <<'PY'
          import json
          h=json.load(open('research/v020-phase-context/ASAP_PHASE_HOLDOUT_V2_FROZEN.json'))
          assert h['status']=='selection-frozen-before-analyzer-output',h
          assert h['plan_workflow']['run_id']==36271993835,h
          assert h['v2_manifest_hashes']['selected_performances_json_sha256']=='b5ae9a419cf3d81bf933d6947a31ec684163731f5e0d91f331dd66c4cafff045',h
          s=json.load(open('research/v020-phase-context/FROZEN_SELECTOR_V2.json'))
          assert s['status']=='frozen-discovery-candidate-not-production',s
          assert s['rule']['trigger_if_all']==[
            'delta_g2_periodicity <= -0.18',
            'delta_g3_periodicity >= 0.12',
            'min(selected_g2_windows, half_g2_windows, selected_g3_windows, half_g3_windows) >= 4',
            'min(selected_beatCount, half_beatCount) >= 32'
          ],s
          p=json.load(open('holdout-plan/summary.json'))
          assert p['selection_frozen_before_analyzer_output'] is True,p
          assert p['selected_performances']==100 and p['selected_unique_sources']==100,p
          assert p['v1_midi_overlap']==0 and p['v1_source_overlap']==0 and p['prior_triple_overlap']==0,p
          PY
          mkdir -p tools shard-output
          python release/analyzer-v019/build_release.py --output tools/trackcade-analyzer-v0.19.js --manifest tools/build_manifest.json
          echo '9d579842207a1482ef6d12d34d6d82d03b02021d88de65c19abaf41f8692f432  tools/trackcade-analyzer-v0.19.js' | sha256sum -c -
          python research/v020-phase-context/make_phase_context_debug_runner.py tools/trackcade-analyzer-v0.19.js tools/trackcade-analyzer-v0.20-phase-context-debug.js
          node --check tools/trackcade-analyzer-v0.20-phase-context-debug.js
          python -m py_compile research/v020-phase-context/run_asap_phase_holdout_v2.py research/v020-phase-context/run_asap_phase_holdout_v2_timeout_recovery.py research/v020-phase-context/aggregate_asap_phase_holdout_v2.py

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi

      - name: Re-run frozen V2 shard 1 with timeout-only recovery
        shell: bash
        run: |
          set -euo pipefail
          python research/v020-phase-context/run_asap_phase_holdout_v2_timeout_recovery.py \
            --holdout-json holdout-plan/selected_performances.json \
            --zip-url https://storage.googleapis.com/magentadata/datasets/maestro/v2.0.0/maestro-v2.0.0.zip \
            --baseline-runner tools/trackcade-analyzer-v0.19.js \
            --debug-runner tools/trackcade-analyzer-v0.20-phase-context-debug.js \
            --output shard-output \
            --shard-index 1 \
            --shard-count 4 \
            --expected-runner-sha 9d579842207a1482ef6d12d34d6d82d03b02021d88de65c19abaf41f8692f432

      - name: Remove Analyzer and frozen plan from shard workspace
        if: always()
        shell: bash
        run: rm -rf tools holdout-plan

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trackcade-v020-asap-phase-holdout-v2-shard-1-recovered
          path: |
            shard-output/results.csv
            shard-output/summary.json
            shard-output/errors.json
            shard-output/invariance_failures.json
            shard-output/sources.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: recover-shard-1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact frozen V2 holdout manifest
        uses: actions/download-artifact@v4
        with:
          name: trackcade-v020-asap-phase-holdout-v2-plan
          path: holdout-plan
          repository: 4everhumblepdx/trackcade-test
          run-id: 36271993835
          github-token: ${{ github.token }}

      - name: Download original green shard 0
        uses: actions/download-artifact@v4
        with:
          name: trackcade-v020-asap-phase-holdout-v2-shard-0
          path: shard-artifacts/shard-0
          repository: 4everhumblepdx/trackcade-test
          run-id: 36272132321
          github-token: ${{ github.token }}

      - name: Download recovered shard 1
        uses: actions/download-artifact@v4
        with:
          name: trackcade-v020-asap-phase-holdout-v2-shard-1-recovered
          path: shard-artifacts/shard-1

      - name: Download original green shard 2
        uses: actions/download-artifact@v4
        with:
          name: trackcade-v020-asap-phase-holdout-v2-shard-2
          path: shard-artifacts/shard-2
          repository: 4everhumblepdx/trackcade-test
          run-id: 36272132321
          github-token: ${{ github.token }}

      - name: Download original green shard 3
        uses: actions/download-artifact@v4
        with:
          name: trackcade-v020-asap-phase-holdout-v2-shard-3
          path: shard-artifacts/shard-3
          repository: 4everhumblepdx/trackcade-test
          run-id: 36272132321
          github-token: ${{ github.token }}

      - name: Aggregate exact frozen V2 evidence
        shell: bash
        run: |
          set -euo pipefail
          echo 'b5ae9a419cf3d81bf933d6947a31ec684163731f5e0d91f331dd66c4cafff045  holdout-plan/selected_performances.json' | sha256sum -c -
          mkdir -p aggregate-output
          python research/v020-phase-context/aggregate_asap_phase_holdout_v2.py \
            --shards-root shard-artifacts \
            --holdout-json holdout-plan/selected_performances.json \
            --output aggregate-output
          cat aggregate-output/summary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trackcade-v020-asap-phase-holdout-v2-full-recovered
          path: |
            aggregate-output/results.csv
            aggregate-output/summary.json
            aggregate-output/errors.json
            aggregate-output/invariance_failures.json
            aggregate-output/shard_summaries.json
          if-no-files-found: error
          retention-days: 30
