name: Trackcade v0.19-dev — Candombe Triple Candidate Validation

on:
  push:
    branches: [analyzer-stress-v018-ballroom]
    paths:
      - '.github/workflows/trackcade-v019-candombe-triple-candidates.yml'
  workflow_dispatch:

jobs:
  candombe-triple-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact v0.18 and apply descriptive-only triple patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stress-run/tools stress-run/candombe/raw stress-run/candombe/beats stress-run/triple-results
          cat stress/v017/bundle.part00.fix0 stress/v017/bundle.part00.fix1 stress/v017/bundle.part01 stress/v017/bundle.part02 stress/v017/bundle.part03 stress/v017/bundle.part04 stress/v017/bundle.part05.fix0 stress/v017/bundle.part05.fix1 | base64 -d > stress-run/tools-v017.tgz
          echo '218067133985608dfdc900a508f6dade652f7f3961f268e670bdf89c05e681d8  stress-run/tools-v017.tgz' | sha256sum -c -
          tar -xzf stress-run/tools-v017.tgz -C stress-run/tools
          python stress/ballroom/patch_v017_to_v018.py stress-run/tools/official-v017-runner.js stress-run/tools/official-v018-runner.js
          echo 'baf6c3701f9b3ccbe67237b04dcca2e9a158f180ceabb6e1c3e9f0b1a8594c15  stress-run/tools/official-v018-runner.js' | sha256sum -c -
          python stress/v019-mirror/patch_v018_add_descriptive_triples.py \
            stress-run/tools/official-v018-runner.js \
            stress-run/tools/official-v019-triple-dev.js
          node --check stress-run/tools/official-v019-triple-dev.js
          python -m py_compile stress/ballroom/map_candombe_dataset.py stress/v019-mirror/run_candombe_triple_validation.py

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Discover and download Candombe from its live dataset page
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://www.eumus.edu.uy/candombe/datasets/ISMIR2015/dataset.html'
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 60 \
            -o stress-run/candombe_dataset.html "$PAGE"
          ARCHIVE_URL=$(python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          PAGE='https://www.eumus.edu.uy/candombe/datasets/ISMIR2015/dataset.html'
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='a':
                      h=dict(attrs).get('href')
                      if h: self.hrefs.append(h)
          p=P(); p.feed(Path('stress-run/candombe_dataset.html').read_text(errors='ignore'))
          hits=[h for h in p.hrefs if 'candombe_dataset' in h.lower() and ('.tar' in h.lower() or '.tgz' in h.lower() or '.zip' in h.lower())]
          if len(hits)!=1: raise SystemExit(f'FAIL-CLOSED: expected one archive href, found {len(hits)}: {hits}')
          print(urljoin(PAGE,hits[0]))
          PY
          )
          echo "resolved_archive_url=$ARCHIVE_URL"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 900 \
            -o stress-run/candombe_dataset.archive "$ARCHIVE_URL"
          test -s stress-run/candombe_dataset.archive
          if tar -tzf stress-run/candombe_dataset.archive >/dev/null 2>&1; then
            tar -xzf stress-run/candombe_dataset.archive -C stress-run/candombe/raw
          elif unzip -tq stress-run/candombe_dataset.archive >/dev/null 2>&1; then
            unzip -q stress-run/candombe_dataset.archive -d stress-run/candombe/raw
          else
            echo 'FAIL-CLOSED: Candombe archive is neither tar.gz nor zip' >&2; exit 1
          fi
          audio_count=$(find stress-run/candombe/raw -type f \( -iname '*.flac' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.ogg' -o -iname '*.m4a' \) | wc -l)
          csv_count=$(find stress-run/candombe/raw -type f -iname '*.csv' | wc -l)
          echo "audio_count=$audio_count csv_count=$csv_count"
          test "$audio_count" -ge 30
          test "$csv_count" -ge 30
          python stress/ballroom/map_candombe_dataset.py \
            --dataset-root stress-run/candombe/raw \
            --output stress-run/candombe/beats

      - name: Compare exact v0.18 vs descriptive triple dev on real performances
        shell: bash
        run: |
          set -euo pipefail
          python stress/v019-mirror/run_candombe_triple_validation.py \
            --audio-root stress-run/candombe/raw \
            --beats-root stress-run/candombe/beats \
            --baseline-runner stress-run/tools/official-v018-runner.js \
            --dev-runner stress-run/tools/official-v019-triple-dev.js \
            --output stress-run/triple-results

      - name: Print evidence summary
        if: always()
        shell: bash
        run: |
          if [ -f stress-run/triple-results/summary.json ]; then cat stress-run/triple-results/summary.json; fi
          if [ -f stress-run/triple-results/errors.json ]; then cat stress-run/triple-results/errors.json; fi
          if [ -f stress-run/triple-results/invariance_failures.json ]; then cat stress-run/triple-results/invariance_failures.json; fi

      - name: Remove corpus audio and Analyzer files before artifact upload
        if: always()
        shell: bash
        run: |
          rm -rf stress-run/candombe/raw stress-run/tools stress-run/tools-v017.tgz stress-run/candombe_dataset.archive stress-run/candombe_dataset.html

      - name: Upload compact real-corpus triple evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-v019-candombe-triple-candidates
          path: |
            stress-run/candombe/beats/mapping_summary.json
            stress-run/triple-results/results.csv
            stress-run/triple-results/summary.json
            stress-run/triple-results/errors.json
            stress-run/triple-results/invariance_failures.json
          if-no-files-found: warn
          retention-days: 14
