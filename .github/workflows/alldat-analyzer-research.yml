name: ALLDAT Analyzer Research

on:
  push:
    branches:
      - trackcade-analyzer-stress
    paths:
      - '.github/workflows/alldat-analyzer-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alldat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Restore frozen analyzer and instrument research copy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lab"
          cat analyzer-stress/bundle-parts/part-00 \
              analyzer-stress/bundle-parts/part-01 \
              analyzer-stress/bundle-parts/part-02 \
              analyzer-stress/bundle-parts/part-03 \
              analyzer-stress/bundle-parts/part-04_06 \
              analyzer-stress/bundle-parts/part-07_09 \
              analyzer-stress/bundle-parts/part-10 > "$RUNNER_TEMP/stresslab.b64"
          base64 -d "$RUNNER_TEMP/stresslab.b64" > "$RUNNER_TEMP/stresslab.tgz"
          tar -xzf "$RUNNER_TEMP/stresslab.tgz" -C "$RUNNER_TEMP/lab"
          cp "$RUNNER_TEMP/lab/official-v014-runner.js" "$RUNNER_TEMP/lab/research-v015-runner.js"
          python research-v015/instrument_runner.py "$RUNNER_TEMP/lab/research-v015-runner.js"
          node --check "$RUNNER_TEMP/lab/research-v015-runner.js"
      - name: Decode ALLDAT to PCM
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=sample_rate,channels -of json ALLDAT_ruffmix.mp3
          ffmpeg -v error -y -i ALLDAT_ruffmix.mp3 -f f32le -acodec pcm_f32le "$RUNNER_TEMP/alldat.f32"
          SR=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 ALLDAT_ruffmix.mp3)
          CH=$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 ALLDAT_ruffmix.mp3)
          echo "SR=$SR" >> "$GITHUB_ENV"
          echo "CH=$CH" >> "$GITHUB_ENV"
      - name: Analyze frozen and research
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/lab/official-v014-runner.js" "$RUNNER_TEMP/alldat.f32" "$SR" "$CH" ALLDAT_ruffmix.mp3 "$RUNNER_TEMP/alldat-v014.json"
          node "$RUNNER_TEMP/lab/research-v015-runner.js" "$RUNNER_TEMP/alldat.f32" "$SR" "$CH" ALLDAT_ruffmix.mp3 "$RUNNER_TEMP/alldat-v015-research.json"
          python - <<'PY'
          import json,os
          for name in ('alldat-v014.json','alldat-v015-research.json'):
              p=os.path.join(os.environ['RUNNER_TEMP'],name)
              x=json.load(open(p)); d=x.get('timingDiagnostics',{})
              print(name, 'bpm=',x.get('bpm'),'tier=',(x.get('timingGuardrail') or {}).get('tier'),'tempoMap=',x.get('tempoMap'))
              print('diagnostics=',{k:d.get(k) for k in ['alternateBpm','amplitudeBpm','transientBpm','lowBandBpm','midBandBpm','highBandBpm','layeredPulseSelected','layeredPulseSelectorScore','layeredPulseRunnerUpBpm','layeredPulseRunnerUpScore']})
              if d.get('researchMetricalCandidates'):
                  print('topResearch=',d['researchMetricalCandidates'][:8])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alldat-analyzer-research
          retention-days: 14
          path: |
            ${{ runner.temp }}/alldat-v014.json
            ${{ runner.temp }}/alldat-v015-research.json
