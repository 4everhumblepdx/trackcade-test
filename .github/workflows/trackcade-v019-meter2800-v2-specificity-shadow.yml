name: Trackcade v0.19-dev — Meter2800 v2 Specificity Shadow

on:
  push:
    branches: [analyzer-stress-v018-ballroom]
    paths:
      - '.github/workflows/trackcade-v019-meter2800-v2-specificity-shadow.yml'
      - 'stress/v019-meter/run_meter2800_v2_specificity_shadow.py'
      - 'stress/v019-meter/patch_meter2800_native_extension_join.py'
      - 'stress/v019-meter/evidence/frozen_triple_selector_v2.json'
  workflow_dispatch:

jobs:
  meter2800-v2-specificity-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v0.18 and build frozen v2 diagnostic runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meter-run/tools meter-run/audio/FMA meter-run/audio/MAG meter-run/audio/OWN meter-run/results meter-run/data
          cat stress/v017/bundle.part00.fix0 stress/v017/bundle.part00.fix1 stress/v017/bundle.part01 stress/v017/bundle.part02 stress/v017/bundle.part03 stress/v017/bundle.part04 stress/v017/bundle.part05.fix0 stress/v017/bundle.part05.fix1 | base64 -d > meter-run/tools-v017.tgz
          echo '218067133985608dfdc900a508f6dade652f7f3961f268e670bdf89c05e681d8  meter-run/tools-v017.tgz' | sha256sum -c -
          tar -xzf meter-run/tools-v017.tgz -C meter-run/tools
          python stress/ballroom/patch_v017_to_v018.py meter-run/tools/official-v017-runner.js meter-run/tools/official-v018-runner.js
          echo 'baf6c3701f9b3ccbe67237b04dcca2e9a158f180ceabb6e1c3e9f0b1a8594c15  meter-run/tools/official-v018-runner.js' | sha256sum -c -
          python stress/v019-mirror/patch_v018_add_descriptive_triples.py meter-run/tools/official-v018-runner.js meter-run/tools/official-v019-triple-dev.js
          python stress/v019-meter/patch_add_counterfactual_meter_diagnostics.py meter-run/tools/official-v019-triple-dev.js meter-run/tools/official-v019-meter-dev.js
          python stress/v019-meter/patch_add_triple_subdivision_diagnostics.py meter-run/tools/official-v019-meter-dev.js meter-run/tools/official-v019-v2-shadow.js
          node --check meter-run/tools/official-v019-v2-shadow.js
          python stress/v019-meter/patch_meter2800_native_extension_join.py stress/v019-meter/run_meter2800_v2_specificity_shadow.py
          python -m py_compile stress/v019-meter/run_meter2800_v2_specificity_shadow.py
          test -f stress/v019-meter/evidence/frozen_triple_selector_v2.json

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Download verified original Meter2800 non-GTZAN sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 'https://dataverse.harvard.edu/api/access/datafile/8076605?format=original' -o meter-run/data/test.csv
          echo '29943bfdd5c5b3e664dba0ba030c0fe6  meter-run/data/test.csv' | md5sum -c -
          curl -fL --retry 3 --retry-delay 5 'https://dataverse.harvard.edu/api/access/datafile/6801764?format=original' -o meter-run/data/FMA.tar.gz
          echo 'a99b52e52bdb037cea99ac23459e782e  meter-run/data/FMA.tar.gz' | md5sum -c -
          curl -fL --retry 3 --retry-delay 5 'https://dataverse.harvard.edu/api/access/datafile/6801753?format=original' -o meter-run/data/MAG.tar.gz
          echo '1b7fde84e9de695762b34f1626922d58  meter-run/data/MAG.tar.gz' | md5sum -c -
          curl -fL --retry 3 --retry-delay 5 'https://dataverse.harvard.edu/api/access/datafile/6801735?format=original' -o meter-run/data/OWN.tar.gz
          echo '3c56d22e77853308985036b11ebf7d69  meter-run/data/OWN.tar.gz' | md5sum -c -
          tar -xzf meter-run/data/FMA.tar.gz -C meter-run/audio/FMA
          tar -xzf meter-run/data/MAG.tar.gz -C meter-run/audio/MAG
          tar -xzf meter-run/data/OWN.tar.gz -C meter-run/audio/OWN
          python - <<'PY'
          import csv
          from collections import Counter
          rows=list(csv.DictReader(open('meter-run/data/test.csv',encoding='utf-8-sig')))
          src=Counter(r['filename'].lstrip('/').split('/',1)[0] for r in rows)
          print('rows',len(rows),'sources',dict(src))
          assert len(rows)==700
          assert src=={'FMA':230,'GTZAN':221,'MAG':217,'OWN':32}
          PY

      - name: Run frozen v2 shadow specificity gate
        shell: bash
        run: |
          set -euo pipefail
          python stress/v019-meter/run_meter2800_v2_specificity_shadow.py \
            --audio-root meter-run/audio \
            --labels-csv meter-run/data/test.csv \
            --baseline-runner meter-run/tools/official-v018-runner.js \
            --dev-runner meter-run/tools/official-v019-v2-shadow.js \
            --output meter-run/results

      - name: Print specificity summary
        if: always()
        shell: bash
        run: |
          if [ -f meter-run/results/summary.json ]; then cat meter-run/results/summary.json; fi
          if [ -f meter-run/results/errors.json ]; then cat meter-run/results/errors.json; fi
          if [ -f meter-run/results/invariance_failures.json ]; then cat meter-run/results/invariance_failures.json; fi

      - name: Remove audio and analyzer files before artifact upload
        if: always()
        shell: bash
        run: |
          rm -rf meter-run/audio meter-run/tools meter-run/tools-v017.tgz meter-run/data/FMA.tar.gz meter-run/data/MAG.tar.gz meter-run/data/OWN.tar.gz

      - name: Upload compact specificity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-v019-meter2800-v2-specificity-shadow
          path: |
            meter-run/results/results.csv
            meter-run/results/summary.json
            meter-run/results/errors.json
            meter-run/results/invariance_failures.json
            stress/v019-meter/evidence/frozen_triple_selector_v2.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce scientific specificity gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('meter-run/results/summary.json')
          if not p.exists():
              raise SystemExit('missing summary')
          s=json.loads(p.read_text())
          if s.get('meter_specificity_gate')=='fail':
              raise SystemExit('frozen v2 produced a unique trigger on non-3 meter')
          print('meter_specificity_gate=',s.get('meter_specificity_gate'))
          PY
