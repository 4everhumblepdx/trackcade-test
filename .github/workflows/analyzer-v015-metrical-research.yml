name: Analyzer v015 Metrical Research

on:
  push:
    branches:
      - trackcade-analyzer-stress
    paths:
      - '.github/workflows/analyzer-v015-metrical-research.yml'
      - 'research-v015/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  giantsteps-664:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout stress branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Restore frozen v0.14 Stress Lab
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lab"
          cat analyzer-stress/bundle-parts/part-00 \
              analyzer-stress/bundle-parts/part-01 \
              analyzer-stress/bundle-parts/part-02 \
              analyzer-stress/bundle-parts/part-03 \
              analyzer-stress/bundle-parts/part-04_06 \
              analyzer-stress/bundle-parts/part-07_09 \
              analyzer-stress/bundle-parts/part-10 > "$RUNNER_TEMP/stresslab.b64"
          test "$(wc -c < "$RUNNER_TEMP/stresslab.b64")" -eq 60700
          echo "f32b6246df79063a0d5a3a3e4cc77e27ef52586b90e6c36030c7daf936a90bf0  $RUNNER_TEMP/stresslab.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/stresslab.b64" > "$RUNNER_TEMP/stresslab.tgz"
          echo "09bb6f2af133255ddb7af680529f5c824d4c4a412ca10f2f1d37c774e2efc5b3  $RUNNER_TEMP/stresslab.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/stresslab.tgz" -C "$RUNNER_TEMP/lab"
          chmod +x "$RUNNER_TEMP/lab"/*.py
          cp "$RUNNER_TEMP/lab/official-v014-runner.js" "$RUNNER_TEMP/lab/research-v015-runner.js"
          python research-v015/instrument_runner.py "$RUNNER_TEMP/lab/research-v015-runner.js"
          node --check "$RUNNER_TEMP/lab/research-v015-runner.js"

      - name: Download all 664 labeled GiantSteps tracks
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/lab/fetch_giantsteps.py" \
            --output "$RUNNER_TEMP/giantsteps" \
            --limit 664 \
            --shuffle-seed 42 \
            --workers 12 \
            --timeout 120

      - name: Run instrumented v0.14 Analyzer
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/lab/mass_stress.py" \
            --manifest "$RUNNER_TEMP/giantsteps/manifest.csv" \
            --runner "$RUNNER_TEMP/lab/research-v015-runner.js" \
            --output "$RUNNER_TEMP/results" \
            --source giantsteps-v2 \
            --jobs 8 \
            --timeout 240 \
            --keep-json all

      - name: Audit rational metrical candidates
        run: |
          set -euo pipefail
          python research-v015/research_audit.py \
            --manifest "$RUNNER_TEMP/giantsteps/manifest.csv" \
            --full-dir "$RUNNER_TEMP/results/full" \
            --out "$RUNNER_TEMP/results/research-audit.json"
          cat "$RUNNER_TEMP/results/research-audit.json" | head -n 120

      - name: Save research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-gs664-v015-metrical-research
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/results/**
            ${{ runner.temp }}/giantsteps/manifest.csv
            ${{ runner.temp }}/giantsteps/download_failures.csv
