name: Trackcade Analyzer Stress

on:
  push:
    branches:
      - trackcade-analyzer-stress
    paths:
      - '.github/workflows/trackcade-analyzer-stress.yml'
      - 'analyzer-stress/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  giantsteps-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout stress branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Restore Trackcade Stress Lab
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analyzer-stress/lab
          cat analyzer-stress/bundle-parts/part-00 \
              analyzer-stress/bundle-parts/part-01 \
              analyzer-stress/bundle-parts/part-02 \
              analyzer-stress/bundle-parts/part-03 \
              analyzer-stress/bundle-parts/part-04_06 \
              analyzer-stress/bundle-parts/part-07_09 \
              analyzer-stress/bundle-parts/part-10 > "$RUNNER_TEMP/stresslab.b64"
          test "$(wc -c < "$RUNNER_TEMP/stresslab.b64")" -eq 60700
          echo "f32b6246df79063a0d5a3a3e4cc77e27ef52586b90e6c36030c7daf936a90bf0  $RUNNER_TEMP/stresslab.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/stresslab.b64" > "$RUNNER_TEMP/stresslab-ci-bundle.tgz"
          echo "09bb6f2af133255ddb7af680529f5c824d4c4a412ca10f2f1d37c774e2efc5b3  $RUNNER_TEMP/stresslab-ci-bundle.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/stresslab-ci-bundle.tgz" -C analyzer-stress/lab
          chmod +x analyzer-stress/lab/*.py

      - name: Download 100 labeled GiantSteps tracks
        shell: bash
        run: |
          set -euo pipefail
          python analyzer-stress/lab/fetch_giantsteps.py \
            --output "$RUNNER_TEMP/giantsteps" \
            --limit 100 \
            --shuffle-seed 42 \
            --workers 8 \
            --timeout 120
          echo '--- manifest rows ---'
          wc -l "$RUNNER_TEMP/giantsteps/manifest.csv"
          if [ -f "$RUNNER_TEMP/giantsteps/download_failures.csv" ]; then
            echo '--- download failures ---'
            cat "$RUNNER_TEMP/giantsteps/download_failures.csv"
          fi

      - name: Run Trackcade v0.14 mass stress
        shell: bash
        run: |
          set -euo pipefail
          python analyzer-stress/lab/mass_stress.py \
            --manifest "$RUNNER_TEMP/giantsteps/manifest.csv" \
            --runner analyzer-stress/lab/official-v014-runner.js \
            --output "$RUNNER_TEMP/results" \
            --source giantsteps-v2 \
            --jobs 4 \
            --timeout 240 \
            --keep-json anomalies
          echo '--- Trackcade summary ---'
          cat "$RUNNER_TEMP/results/summary.json"

      - name: Save stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-giantsteps-100
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/results/**
            ${{ runner.temp }}/giantsteps/manifest.csv
            ${{ runner.temp }}/giantsteps/download_failures.csv
