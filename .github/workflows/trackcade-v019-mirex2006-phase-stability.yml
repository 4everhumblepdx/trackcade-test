name: Trackcade v0.19-dev — Independent MIREX 2006 Phase Stability

on:
  push:
    branches: [analyzer-stress-v018-ballroom]
    paths:
      - '.github/workflows/trackcade-v019-mirex2006-phase-stability.yml'
  workflow_dispatch:

jobs:
  mirex-phase-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact v0.18 and build windowed debug runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stress-run/tools
          cat stress/v017/bundle.part00.fix0 stress/v017/bundle.part00.fix1 stress/v017/bundle.part01 stress/v017/bundle.part02 stress/v017/bundle.part03 stress/v017/bundle.part04 stress/v017/bundle.part05.fix0 stress/v017/bundle.part05.fix1 | base64 -d > stress-run/tools-v017.tgz
          echo '218067133985608dfdc900a508f6dade652f7f3961f268e670bdf89c05e681d8  stress-run/tools-v017.tgz' | sha256sum -c -
          tar -xzf stress-run/tools-v017.tgz -C stress-run/tools
          python stress/ballroom/patch_v017_to_v018.py stress-run/tools/official-v017-runner.js stress-run/tools/official-v018-runner.js
          echo 'baf6c3701f9b3ccbe67237b04dcca2e9a158f180ceabb6e1c3e9f0b1a8594c15  stress-run/tools/official-v018-runner.js' | sha256sum -c -
          python stress/ballroom/make_phase_stability_runner.py stress-run/tools/official-v018-runner.js stress-run/tools/official-v018-phase-stability.js
          node --check stress-run/tools/official-v018-phase-stability.js
          python -m py_compile stress/mirex2006/prepare_mirex_beat_training.py stress/ballroom/run_phase_stability_ballroom.py

      - name: Install and verify ffmpeg / ffprobe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Download documented MIREX 2006 beat-training archive
        shell: bash
        run: |
          set -u
          mkdir -p stress-run/mirex/archive stress-run/mirex/extracted stress-run/mirex/prepared
          URL='https://www.music-ir.org/evaluation/MIREX/data/2006/beat/beattrack_train_2006.tgz'
          if ! curl -fL --retry 2 --retry-delay 3 -u 'beattrack:b34trx' -o stress-run/mirex/archive/beattrack_train_2006.tgz "$URL"; then
            printf '{"status":"download-failed","url":"%s"}\n' "$URL" > stress-run/mirex/prepared/download_status.json
            exit 0
          fi
          if ! tar -tzf stress-run/mirex/archive/beattrack_train_2006.tgz >/dev/null 2>&1; then
            printf '{"status":"archive-invalid"}\n' > stress-run/mirex/prepared/download_status.json
            exit 0
          fi
          tar -xzf stress-run/mirex/archive/beattrack_train_2006.tgz -C stress-run/mirex/extracted
          printf '{"status":"download-ok"}\n' > stress-run/mirex/prepared/download_status.json
          echo "files=$(find stress-run/mirex/extracted -type f | wc -l)"
          find stress-run/mirex/extracted -type f | head -40

      - name: Map audio and human beat references conservatively
        shell: bash
        run: |
          set -u
          if [ -f stress-run/mirex/prepared/download_status.json ] && grep -q 'download-ok' stress-run/mirex/prepared/download_status.json; then
            python stress/mirex2006/prepare_mirex_beat_training.py \
              --root stress-run/mirex/extracted \
              --output stress-run/mirex/prepared
          else
            echo 'MIREX archive unavailable; mapping skipped as infrastructure data.'
          fi

      - name: Run exact-v0.18 phase diagnostics only when mapping is unambiguous
        shell: bash
        run: |
          set -u
          READY=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('stress-run/mirex/prepared/mapping.json')
          print('yes' if p.exists() and json.loads(p.read_text()).get('ready_for_evaluation') else 'no')
          PY
          )
          if [ "$READY" = yes ]; then
            python stress/ballroom/run_phase_stability_ballroom.py \
              --audio-root stress-run/mirex/prepared/audio \
              --annotations-root stress-run/mirex/prepared/beats \
              --runner stress-run/tools/official-v018-phase-stability.js \
              --output stress-run/mirex-results
          else
            mkdir -p stress-run/mirex-results
            printf '{"status":"mapping-unresolved"}\n' > stress-run/mirex-results/status.json
          fi

      - name: Evaluate frozen Ballroom-derived rule without retuning
        if: always()
        shell: bash
        run: |
          mkdir -p stress-run/mirex-results
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('stress-run/mirex-results/phase_stability.csv')
          if not p.exists():
              status={'status':'no-evaluable-results','rule':'wins2_meanpos_stdpos_v1_FIXED_FROM_BALLROOM'}
              Path('stress-run/mirex-results/fixed_rule_summary.json').write_text(json.dumps(status,indent=2)+'\n')
              print(json.dumps(status,indent=2)); raise SystemExit(0)
          rows=list(csv.DictReader(p.open())); ok=[]
          for r in rows:
              if r.get('status')!='ok': continue
              try:d=float(r['delta_f1']);wins=float(r['half_window_wins']);md=float(r['window_mean_delta']);sd=float(r['window_std_delta'])
              except:continue
              trigger=wins>=2 and md>0 and sd>0
              ok.append((r,trigger,d))
          trig=[x for x in ok if x[1]]
          summary={
            'rule':'wins2_meanpos_stdpos_v1_FIXED_FROM_BALLROOM','rows':len(rows),'ok':len(ok),'triggers':len(trig),
            'big_helps':sum(d>=.2 for _,_,d in trig),'big_hurts':sum(d<=-.2 for _,_,d in trig),'neutral':sum(-.2<d<.2 for _,_,d in trig),
            'mean_delta_if_trigger':sum(d for _,_,d in trig)/max(1,len(trig)),
            'trigger_tracks':[{'track':r['track'],'delta_f1':d,'selected_f1_70':float(r['selected_f1_70']),'half_f1_70':float(r['half_f1_70']),'half_window_wins':float(r['half_window_wins']),'window_mean_delta':float(r['window_mean_delta']),'window_std_delta':float(r['window_std_delta'])} for r,_,d in trig]
          }
          Path('stress-run/mirex-results/fixed_rule_summary.json').write_text(json.dumps(summary,indent=2)+'\n');print(json.dumps(summary,indent=2))
          PY

      - name: Remove audio/archive and reconstructed Analyzer files before upload
        if: always()
        shell: bash
        run: |
          rm -rf stress-run/mirex/archive stress-run/mirex/extracted stress-run/mirex/prepared/audio stress-run/tools stress-run/tools-v017.tgz

      - name: Upload compact MIREX evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-v019-mirex2006-phase-stability
          path: |
            stress-run/mirex/prepared/download_status.json
            stress-run/mirex/prepared/mapping.json
            stress-run/mirex-results/phase_stability.csv
            stress-run/mirex-results/summary.json
            stress-run/mirex-results/fixed_rule_summary.json
            stress-run/mirex-results/errors.json
            stress-run/mirex-results/status.json
          if-no-files-found: warn
          retention-days: 14
