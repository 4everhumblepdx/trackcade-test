name: Trackcade Analyzer v0.18 — Ballroom Beat Grid

on:
  push:
    branches: [analyzer-stress-v018-ballroom]
    paths:
      - '.github/workflows/trackcade-ballroom-v018.yml'
  workflow_dispatch:

jobs:
  ballroom-beat-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact v0.17 runner and patch to frozen v0.18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stress-run/tools
          cat stress/v017/bundle.part00.fix0 stress/v017/bundle.part00.fix1 stress/v017/bundle.part01 stress/v017/bundle.part02 stress/v017/bundle.part03 stress/v017/bundle.part04 stress/v017/bundle.part05.fix0 stress/v017/bundle.part05.fix1 | base64 -d > stress-run/tools-v017.tgz
          echo '218067133985608dfdc900a508f6dade652f7f3961f268e670bdf89c05e681d8  stress-run/tools-v017.tgz' | sha256sum -c -
          tar -xzf stress-run/tools-v017.tgz -C stress-run/tools
          python stress/ballroom/patch_v017_to_v018.py stress-run/tools/official-v017-runner.js stress-run/tools/official-v018-runner.js
          echo 'baf6c3701f9b3ccbe67237b04dcca2e9a158f180ceabb6e1c3e9f0b1a8594c15  stress-run/tools/official-v018-runner.js' | sha256sum -c -
          node --check stress-run/tools/official-v018-runner.js
          python -m py_compile stress/ballroom/evaluate_ballroom.py stress/ballroom/patch_v017_to_v018.py

      - name: Install and verify ffmpeg / ffprobe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffprobe -version | sed -n '1p'

      - name: Download Ballroom audio and human beat annotations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stress-run/data/audio stress-run/data/annotations
          curl -fL --retry 3 --retry-delay 5 -o stress-run/data/data1.tar.gz https://mtg.upf.edu/ismir2004/contest/tempoContest/data1.tar.gz || \
            curl -fL --retry 3 --retry-delay 5 -o stress-run/data/data1.tar.gz http://mtg.upf.edu/ismir2004/contest/tempoContest/data1.tar.gz
          echo '2872a3e52070bc342a4510a95e2fa0b8  stress-run/data/data1.tar.gz' | md5sum -c -
          tar -xzf stress-run/data/data1.tar.gz -C stress-run/data/audio
          curl -fL --retry 3 --retry-delay 3 -o stress-run/data/annotations.tar.gz https://github.com/CPJKU/BallroomAnnotations/archive/refs/heads/master.tar.gz
          tar -xzf stress-run/data/annotations.tar.gz -C stress-run/data/annotations
          echo "audio files: $(find stress-run/data/audio -type f \( -name '*.wav' -o -name '*.mp3' -o -name '*.flac' \) | wc -l)"
          echo "beat annotation files: $(find stress-run/data/annotations -type f -name '*.beats' | wc -l)"

      - name: Evaluate v0.18 beat grid against human beats
        shell: bash
        run: |
          set -euo pipefail
          python stress/ballroom/evaluate_ballroom.py \
            --audio-root stress-run/data/audio \
            --annotations-root stress-run/data/annotations \
            --runner stress-run/tools/official-v018-runner.js \
            --output stress-run/results \
            --jobs 6 \
            --timeout 180

      - name: Print benchmark summary
        if: always()
        shell: bash
        run: |
          if [ -f stress-run/results/summary.json ]; then
            cat stress-run/results/summary.json
          fi

      - name: Remove audio before artifact upload
        if: always()
        run: rm -rf stress-run/data/audio stress-run/data/data1.tar.gz stress-run/tools

      - name: Upload compact Ballroom benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-v018-ballroom-beat-grid
          path: |
            stress-run/results/summary.json
            stress-run/results/results.csv
            stress-run/results/worst_70ms.csv
            stress-run/results/missing_annotations.txt
          if-no-files-found: warn
          retention-days: 14
