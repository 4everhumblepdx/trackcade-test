name: Trackcade Semantic External Holdout v1 — Stage 1 V5 Flex Frozen Prep

on:
  push:
    branches:
      - trackcade-semantic-external-holdout-v1
    paths:
      - .github/workflows/trackcade-semantic-external-stage1-v5-flex-prep-v1.yml
      - research/semantic-external-holdout-v1/amend_stage1_v5_payload_flex_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trackcade-stage1-v5-flex-frozen-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-v5-flex:
    if: github.ref == 'refs/heads/trackcade-semantic-external-holdout-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: '36645240283'
      SOURCE_ARTIFACT_ID: '11068032294'
      SOURCE_ARTIFACT_NAME: trackcade-semantic-external-stage1-v5-prep-v1
      SOURCE_ARTIFACT_DIGEST: sha256:55db9b9144debbf71ec3ca780fd0ff6b91609221337045e4d6b43f02a822dc05
      SOURCE_HEAD_SHA: fd6e06bf9b1cff11f257d4eb5c2e2703d913e745
      SOURCE_MANIFEST_SHA256: f93545e534b11bd207df3f032709f5cd3c1f198cf5529bbf04c0158c696f4799
      SOURCE_FILES_SHA256: 1393038c09afff244e4aeb2c745eb5a6f40c5f728991cec5051d3dfb4d34cb6c

    steps:
      - name: Checkout exact amendment source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert zero-dollar boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/trackcade-semantic-external-holdout-v1"
          if env | grep -q '^OPENAI_API_KEY='; then
            echo 'OPENAI_API_KEY must not be present in V5 Flex prep environment' >&2
            exit 1
          fi
          python -m py_compile research/semantic-external-holdout-v1/amend_stage1_v5_payload_flex_v1.py
          grep -q 'allowedChangesOnly.*service_tier' research/semantic-external-holdout-v1/amend_stage1_v5_payload_flex_v1.py

      - name: Verify frozen V5 source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > /tmp/meta.json
          python - <<'PY'
          import json, os
          m=json.load(open('/tmp/meta.json'))
          assert m['id']==int(os.environ['SOURCE_ARTIFACT_ID'])
          assert m['name']==os.environ['SOURCE_ARTIFACT_NAME']
          assert m['digest']==os.environ['SOURCE_ARTIFACT_DIGEST']
          assert m['expired'] is False
          assert m['workflow_run']['id']==int(os.environ['SOURCE_RUN_ID'])
          assert m['workflow_run']['head_sha']==os.environ['SOURCE_HEAD_SHA']
          print('Frozen V5 source artifact verified')
          PY

      - name: Download exact frozen V5 prep
        uses: actions/download-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v5-prep-v1
          path: /tmp/trackcade-v5-prep
          github-token: ${{ github.token }}
          run-id: 36645240283

      - name: Verify source manifest identities
        shell: bash
        run: |
          set -euo pipefail
          echo "${SOURCE_MANIFEST_SHA256}  /tmp/trackcade-v5-prep/STAGE1_V5_PREP_MANIFEST_V1.json" | sha256sum -c -
          echo "${SOURCE_FILES_SHA256}  /tmp/trackcade-v5-prep/FILES_SHA256.txt" | sha256sum -c -

      - name: Prepare exact Flex transport amendment offline
        shell: bash
        run: |
          set -euo pipefail
          python research/semantic-external-holdout-v1/amend_stage1_v5_payload_flex_v1.py \
            --source-prep-root /tmp/trackcade-v5-prep \
            --output-dir /tmp/trackcade-v5-flex-prep

      - name: Audit amendment closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('/tmp/trackcade-v5-flex-prep')
          m=json.load(open(root/'STAGE1_V5_FLEX_PREP_MANIFEST_V1.json'))
          assert m['schema']=='trackcade-semantic-external-stage1-v5-flex-prep-v1'
          assert m['trackCount']==50
          assert m['providerCallsObserved']==0
          assert m['terminalTracksProcessed'] is False
          assert m['analyzerExecuted'] is False
          assert m['compilerInvoked'] is False
          a=m['transportAmendment']
          assert a['serviceTier']=='flex' and a['maxOutputTokens']==8192
          assert a['allowedChangesOnly']==['service_tier']
          assert a['semanticPayloadUnchanged'] is True
          assert [r['ordinal'] for r in m['tracks']]==list(range(1,51))
          for r in m['tracks']:
            case=root/f"cases/{r['ordinal']:02d}-{r['stem']}"
            p=json.load(open(case/'openai-payload-v5-flex.json'))
            assert p['service_tier']=='flex'
            assert p['max_output_tokens']==8192
            assert p['model']=='gpt-6-sol'
            assert p['reasoning']=={'effort':'high'}
            assert p['store'] is False
          for line in (root/'FILES_SHA256.txt').read_text().splitlines():
            if not line.strip(): continue
            expected, rel=line.split('  ',1)
            assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==expected
          print('V5 Flex amendment hash closure verified')
          PY

      - name: Upload immutable V5 Flex prep artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackcade-semantic-external-stage1-v5-flex-prep-v1
          path: /tmp/trackcade-v5-flex-prep
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
