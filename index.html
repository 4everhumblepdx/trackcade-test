<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#070a1e" />
  <title>Neon Dash — Trackcade</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a1e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #game{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}
    #boot-error{display:none;position:fixed;inset:0;z-index:9999;padding:24px;box-sizing:border-box;background:#070a1e;color:#fff;white-space:pre-wrap;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
  </style>
</head>
<body>
  <div id="game"></div>
  <pre id="boot-error"></pre>
  <script>
    const box=document.getElementById('boot-error');
    const show=e=>{box.style.display='block';box.textContent='Trackcade failed to start:\n\n'+(e?.stack||e?.message||String(e));};
    addEventListener('error',e=>show(e.error||e.message));
    addEventListener('unhandledrejection',e=>show(e.reason));
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
