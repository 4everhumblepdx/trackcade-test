// The engine creates its own canvas inside CONTAINER and sizes it to that box

// ---- track/loader.js ----
/** The query parameter that carries a manifest URL. */
const TRACK_PARAM = 'track';
/** A validation failure with a player-friendly message. */
class ManifestError extends Error {
}
/**
 * The manifest URL from `?track=…`, or null when absent/blank. Other query
 * parameters are ignored, so a release link can carry tracking params too.
 */
function trackParamFrom(loc) {
    let params;
    try {
        params = new URLSearchParams(loc.search);
    }
    catch {
        return null;
    }
    const raw = params.get(TRACK_PARAM);
    const trimmed = raw?.trim() ?? '';
    return trimmed.length > 0 ? trimmed : null;
}
const FETCH_TIMEOUT_MS = 15000;
/**
 * Fetch and validate a Trackcade manifest. Throws ManifestError with a
 * player-friendly message on any failure (network, HTTP, invalid JSON,
 * missing fields). `fetchImpl` is injectable for headless tests.
 */
async function loadManifest(url, fetchImpl) {
    const f = fetchImpl ?? globalThis.fetch;
    if (!f)
        throw new ManifestError('this browser cannot fetch track manifests');
    let parsedUrl;
    try {
        parsedUrl = new URL(url);
    }
    catch {
        throw new ManifestError('the track URL is not a valid URL');
    }
    if (parsedUrl.protocol !== 'https:' && parsedUrl.protocol !== 'http:') {
        throw new ManifestError('the track URL must be http(s)');
    }
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl
        ? setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS)
        : null;
    let text;
    try {
        const res = await f(url, ctrl ? { signal: ctrl.signal } : {});
        if (!res.ok) {
            throw new ManifestError(`the track server answered HTTP ${res.status}`);
        }
        text = await res.text();
    }
    catch (e) {
        if (e instanceof ManifestError)
            throw e;
        const aborted = e instanceof Error && e.name === 'AbortError';
        throw new ManifestError(aborted ? 'the track request timed out' : 'the track could not be reached');
    }
    finally {
        if (timer !== null)
            clearTimeout(timer);
    }
    let data;
    try {
        data = JSON.parse(text);
    }
    catch {
        throw new ManifestError('the track file is not valid JSON');
    }
    return validateManifest(data);
}
// ── Validation ───────────────────────────────────────────────────────────────
const EVENT_KINDS = new Set([
    'beat', 'section', 'energy', 'drop', 'peak',
]);
const PALETTE_KEYS = [
    'skyTop', 'skyBottom', 'road', 'roadAlt', 'laneGlow', 'edgeLeft', 'edgeRight',
    'primary', 'secondary', 'collectible', 'hazard', 'overdriveA', 'overdriveB',
];
const ART_KEYS = [
    'player', 'obstacleLow', 'obstacleWall', 'orb', 'cell', 'skyline',
];
/** Numeric tuning fields validated as finite numbers (min, max). */
const NUMERIC_FIELDS = [
    ['baseSpeed', 1, 5000],
    ['maxSpeed', 1, 10000],
    ['speedRampPerSec', 0, 100],
    ['energySpeedBoost', 0, 1000],
    ['overdriveSpeedMult', 1, 5],
    ['jumpTime', 0.05, 5],
    ['jumpHeight', 1, 1000],
    ['laneSwitchTime', 0.01, 2],
    ['invincibleTime', 0, 30],
    ['spawnMinGapZ', 0, 10000],
    ['scorePerMeter', 0, 1000],
    ['orbScore', 0, 100000],
    ['nearMissScore', 0, 100000],
    ['comboEvery', 1, 1000],
    ['comboCap', 1, 1000],
    ['overdriveComboBonus', 0, 1000],
    ['overdriveOrbChance', 0, 1],
    ['overdriveBloom', 0, 10],
    ['baseBloom', 0, 10],
    ['crashScoreFraction', 0, 1],
    ['crashScoreFlat', 0, 1000000],
    ['crashStunTime', 0, 30],
    ['crashInvincibleTime', 0, 60],
];
function isRecord(v) {
    return typeof v === 'object' && v !== null && !Array.isArray(v);
}
function fail(msg) {
    throw new ManifestError(msg);
}
function reqString(obj, key) {
    const v = obj[key];
    if (typeof v !== 'string' || v.trim().length === 0) {
        fail(`the track manifest is missing "${key}"`);
    }
    return v;
}
function optString(obj, key, fallback = '') {
    const v = obj[key];
    if (v === undefined || v === null)
        return fallback;
    if (typeof v !== 'string')
        fail(`the track manifest field "${key}" must be a string`);
    return v;
}
function reqNumber(obj, key, min, max) {
    const v = obj[key];
    if (typeof v !== 'number' || !Number.isFinite(v)) {
        fail(`the track manifest is missing "${key}"`);
    }
    if (v < min || v > max)
        fail(`the track manifest field "${key}" is out of range`);
    return v;
}
function optNumber(obj, key, fallback, min, max) {
    const v = obj[key];
    if (v === undefined || v === null)
        return fallback;
    if (typeof v !== 'number' || !Number.isFinite(v) || v < min || v > max) {
        fail(`the track manifest field "${key}" must be a number between ${min} and ${max}`);
    }
    return v;
}
function reqUrl(obj, key) {
    const v = reqString(obj, key);
    if (!/^https?:\/\//.test(v))
        fail(`the track manifest field "${key}" must be an http(s) URL`);
    return v;
}

    const v = reqString(obj, key);
    if (!/^#[0-9a-fA-F]{6}$/.test(v)) {
        fail(`the track manifest palette colour "${key}" must be #rrggbb`);
    }
    return v;
}
/** A URL-safe slug for deriving a per-track high-score key. */

}

        fail(`music event #${index + 1} has no valid time "t"`);
    }
    if (typeof raw.kind !== 'string' || !EVENT_KINDS.has(raw.kind)) {
        fail(`music event #${index + 1} has an unknown kind "${String(raw.kind)}"`);
    }
    const e = { t: raw.t, kind: raw.kind };
    if (raw.name !== undefined) {
        if (typeof raw.name !== 'string')
            fail(`music event #${index + 1} has a non-string name`);
        e.name = raw.name;
    }
    if (raw.duration !== undefined) {
        if (typeof raw.duration !== 'number' || !Number.isFinite(raw.duration) || raw.duration <= 0) {
            fail(`music event #${index + 1} has an invalid duration`);
        }

    }

}
/**
 * Validate unknown JSON into a complete TrackConfig. Required identity/music
 * fields must be present; palette/art/tuning fields fall back to the built-in
 * track's values so a minimal manifest (identity + audio + bpm + length) is a
 * working release. Throws ManifestError on anything unusable.
 */
function validateManifest(data) {
    if (!isRecord(data))
        fail('the track manifest is not a JSON object');
    const artist = reqString(data, 'artist');
    const title = reqString(data, 'title');
    const audioUrl = reqUrl(data, 'audioUrl');
    const bpm = reqNumber(data, 'bpm', 20, 400);
    const songLength = reqNumber(data, 'songLength', 5, 3600);
    // events: optional, sorted by t, must land inside the song
    let events = [];
    if (data.events !== undefined) {
        if (!Array.isArray(data.events))
            fail('the track manifest field "events" must be an array');
        events = data.events.map(parseEvent);
        events.sort((a, b) => a.t - b.t);
        if (events.some((e) => e.t > songLength)) {
            fail('the track manifest has music events beyond the song length');
        }
    }
    // energyCurve: optional array of 0..1 samples
    let energyCurve = [];
    if (data.energyCurve !== undefined) {
        if (!Array.isArray(data.energyCurve)) {
            fail('the track manifest field "energyCurve" must be an array of numbers');
        }
        energyCurve = data.energyCurve.map((v, i) => {
            if (typeof v !== 'number' || !Number.isFinite(v)) {
                fail(`energyCurve sample #${i + 1} is not a number`);
            }
            return Math.min(1, Math.max(0, v));
        });
    }
    // palette: fall back per colour to the built-in track
    const rawPalette = isRecord(data.palette) ? data.palette : {};
    const palette = {};
    for (const key of PALETTE_KEYS) {
        const v = rawPalette[key];
        if (v === undefined) {
            palette[key] = FALLBACK_TRACK.palette[key];
        }
        else {
            palette[key] = reqHexColor(rawPalette, key);
        }
    }
    // art: fall back per image to the built-in track
    const rawArt = isRecord(data.art) ? data.art : {};
    const art = {};
    for (const key of ART_KEYS) {
        const v = rawArt[key];
        if (v === undefined) {
            art[key] = FALLBACK_TRACK.art[key];
        }
        else {
            art[key] = reqUrl(rawArt, key);
        }
    }
    const cfg = {
        artist,
        title,
        audioUrl,
        coverUrl: optString(data, 'coverUrl'),
        logoUrl: optString(data, 'logoUrl'),
        highScoreKey: optString(data, 'highScoreKey') || `trackcade.high.${slugify(artist)}.${slugify(title)}`,
        bpm,
        beatOffset: optNumber(data, 'beatOffset', 0, 0, 60),
        songLength,
        finishBonus: optNumber(data, 'finishBonus', 500, 0, 1000000),
        events,
        energyCurve,
        palette,
        art,
        lanes: 3,
        baseSpeed: 0, maxSpeed: 0, speedRampPerSec: 0, energySpeedBoost: 0,
        overdriveSpeedMult: 0, jumpTime: 0, jumpHeight: 0, laneSwitchTime: 0,
        maxHits: 0, invincibleTime: 0, spawnRowEveryBeats: 0, spawnMinGapZ: 0,
        scorePerMeter: 0, orbScore: 0, nearMissScore: 0, comboEvery: 0, comboCap: 0,
        overdriveComboBonus: 0, overdriveOrbChance: 0, overdriveBloom: 0, baseBloom: 0,
        crashScoreFraction: 0, crashScoreFlat: 0, crashStunTime: 0, crashInvincibleTime: 0,
    };
    for (const [key, min, max] of NUMERIC_FIELDS) {
        cfg[key] = optNumber(data, key, FALLBACK_TRACK[key], min, max);
    }
    cfg.maxHits = Math.max(1, Math.round(optNumber(data, 'maxHits', FALLBACK_TRACK.maxHits, 1, 10)));
    cfg.spawnRowEveryBeats = Math.max(1, Math.round(optNumber(data, 'spawnRowEveryBeats', FALLBACK_TRACK.spawnRowEveryBeats, 1, 16)));
    return cfg;
}

// ---- logic/hiscore.js ----
// High-score persistence — pure logic, no engine imports.
// Storage is injected so verify.ts can run it in Node with an in-memory map.
class HighScore {
    key;
    store;
    best;
    constructor(key, store) {
        this.key = key;
        this.store = store;
        this.best = Number(this.store.getItem(this.key) ?? 0) || 0;
    }
    get value() {
        return this.best;
    }
    /** Submit a finished run's score. Returns true when it's a new best. */
    submit(score) {
        const s = Math.floor(score);
        if (s > this.best) {
            this.best = s;
            this.store.setItem(this.key, String(s));
            return true;
        }
        return false;
    }
}
/** In-memory storage for tests / non-DOM environments. */
function memoryStorage() {
    const map = new Map();
    return {
        getItem: (k) => map.get(k) ?? null,
        setItem: (k, v) => void map.set(k, v),
    };
}

// ---- logic/director.js ----
class MusicDirector {
    /** The full ordered timeline (synthesised beats + authored events). */
    timeline;
    /** Seconds per beat. */
    beatLen;
    cursor = 0;
    constructor(cfg, songLengthHint = 600) {
        this.beatLen = 60 / cfg.bpm;
        const beats = [];
        for (let t = cfg.beatOffset, i = 0; t <= songLengthHint; t += this.beatLen, i++) {
            beats.push({ t, kind: 'beat', name: `beat-${i}` });
        }
        this.timeline = [...cfg.events, ...beats].sort((a, b) => a.t - b.t);
    }
    /** Restart the song clock (same song, fresh run). */
    reset() {
        this.cursor = 0;
    }
    /** Current beat position (fractional) for a song time in seconds. */
    beatAt(songTime, offset) {
        return Math.max(0, (songTime - offset) / this.beatLen);
    }
    /**
     * Advance to `songTime` (seconds) and return every event crossed since the
     * previous tick, in time order. Monotonic: an event fires exactly once.
     */
    tick(songTime, offset) {
        const fired = [];
        while (this.cursor < this.timeline.length && this.timeline[this.cursor].t <= songTime) {
            const e = this.timeline[this.cursor++];
            fired.push({ ...e, beat: this.beatAt(e.t, offset) });
        }
        return fired;
    }
    /** The next event of a kind at/after `songTime` (for HUD hints), if any. */
    nextOfKind(songTime, kind) {
        for (let i = this.cursor; i < this.timeline.length; i++) {
            if (this.timeline[i].kind === kind)
                return this.timeline[i];
        }
        return undefined;
    }
}

// ---- logic/scoring.js ----
class ScoreKeeper {
    cfg;
    score = 0;
    orbs = 0;
    nearMisses = 0;
    hits = 0;
    /** Combo multiplier (1 = none). */
    multiplier = 1;
    /** Orbs collected toward the next combo step. */
    comboProgress = 0;
    constructor(cfg) {
        this.cfg = cfg;
    }
    /** Effective multiplier including the Overdrive bonus. */
    effectiveMultiplier(overdrive) {
        return this.multiplier + (overdrive ? this.cfg.overdriveComboBonus : 0);
    }
    /** Distance score — call every frame with metres travelled. */
    addDistance(metres, overdrive) {
        this.score += metres * this.cfg.scorePerMeter * this.effectiveMultiplier(overdrive);
    }
    /** An energy orb was collected. Returns the points awarded. */
    collectOrb(overdrive) {
        this.orbs++;
        this.comboProgress++;
        if (this.comboProgress >= this.cfg.comboEvery) {
            this.comboProgress = 0;
            this.multiplier = Math.min(this.multiplier + 1, this.cfg.comboCap);
        }
        const pts = this.cfg.orbScore * this.effectiveMultiplier(overdrive);
        this.score += pts;
        return pts;
    }
    /** A near miss was dodged. Returns the points awarded. */
    nearMiss(overdrive) {
        this.nearMisses++;
        const pts = this.cfg.nearMissScore * this.effectiveMultiplier(overdrive);
        this.score += pts;
        return pts;
    }
    /** A flat bonus (e.g. for surviving to the end of the song). */
    addBonus(points) {
        this.score += points;
    }
    /** A hit was taken — combo breaks. */
    registerHit() {
        this.hits++;
        this.multiplier = 1;
        this.comboProgress = 0;
    }
    /**
     * A crash (energy ran out) — the Trackcade penalty. A large chunk of the
     * score is deducted (fraction + flat) and the combo resets, but the run and
     * the song continue. Returns the points deducted.
     */
    applyCrashPenalty() {

// ---- logic/difficulty.js ----
class Difficulty {
    cfg;
    /** Permanent boost level from 'energy' events. */
    energyLevel = 0;
    constructor(cfg) {
        this.cfg = cfg;
    }
    /** Current run speed in world units/sec. */
    speed(elapsedSec, overdrive) {
        const base = this.cfg.baseSpeed +
            elapsedSec * this.cfg.speedRampPerSec +
            this.energyLevel * this.cfg.energySpeedBoost;
        const capped = Math.min(base, this.cfg.maxSpeed);
        return overdrive ? Math.min(capped * this.cfg.overdriveSpeedMult, this.cfg.maxSpeed * 1.35) : capped;
    }
    /** 0..1 — how hard the game currently is (drives pattern weights). */
    intensity(elapsedSec) {
        const raw = (this.speed(elapsedSec, false) - this.cfg.baseSpeed) /
            (this.cfg.maxSpeed - this.cfg.baseSpeed);
        return Math.min(1, Math.max(0, raw));
    }
    /**
     * Sample the track's energy curve at a song time (seconds). Returns null
     * when the track has no curve. Samples are spread evenly across the song
     * and linearly interpolated.
     */
    energyAt(songTime) {
        const curve = this.cfg.energyCurve;
        if (!curve || curve.length === 0)
            return null;
        if (curve.length === 1)
            return curve[0];
        const p = Math.min(1, Math.max(0, songTime / this.cfg.songLength)) * (curve.length - 1);
        const i = Math.floor(p);
        const f = p - i;
        const a = curve[i];
        const b = curve[Math.min(curve.length - 1, i + 1)];
        return a + (b - a) * f;
    }
    /**
     * The intensity handed to the row generator: the speed-derived ramp blended
     * with the track's energy curve when one exists.
     */
    spawnIntensity(elapsedSec, songTime) {
        const base = this.intensity(elapsedSec);
        const curve = this.energyAt(songTime);
        if (curve === null)
            return base;
        return Math.min(1, Math.max(0, base * 0.5 + curve * 0.5));
    }
}

// ---- logic/spawner.js ----
/** Deterministic PRNG (mulberry32) — same seed, same run, every machine. */
function rng(seed) {
    let a = seed >>> 0;
    return () => {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
/** True when a row can be survived: some lane is free or only jumpable. */
function rowIsSurvivable(row, lanes) {
    for (let lane = 0; lane < lanes; lane++) {
        const obs = row.obstacles.filter((o) => o.lane === lane);
        if (obs.length === 0 || obs.every((o) => o.kind === 'low'))
            return true;
    }
    return false;
}
class RowGenerator {
    cfg;
    constructor(cfg) {
        this.cfg = cfg;
    }
    /**
     * Generate the row for one spawn tick.
     * @param seed      deterministic seed (e.g. row index)
     * @param intensity 0..1 difficulty (from Difficulty.intensity)
     * @param overdrive true during Overdrive (more obstacles + more orbs)
     */
    row(seed, intensity, overdrive) {
        const rand = rng(seed);
        const lanes = this.cfg.lanes;
        const obstacles = [];
        const pickups = [];
        // How many lanes get obstacles: 1 early, up to 2 (of 3) when intense.
        const roll = rand();
        const obstacleLanes = roll < 0.32 - intensity * 0.12 ? 1 : 2;
        // Pick which lanes, shuffled deterministically.
        const order = [0, 1, 2].slice(0, lanes);
        for (let i = order.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
        }
        const chosen = order.slice(0, Math.min(obstacleLanes, lanes - 1));
        // Guarantee survivability: at most (lanes-1) obstacles, and never all walls.
        let walls = 0;
        for (const lane of chosen) {
            const wallChance = 0.34 + intensity * 0.38 + (overdrive ? 0.1 : 0);
            const kind = rand() < wallChance && walls < lanes - 2 ? 'wall' : 'low';
            if (kind === 'wall')
                walls++;
            obstacles.push({ lane, kind });
        }
        // Collectibles: usually an orb on a survivable lane; Overdrive adds more.
        const safeLanes = order.filter((l) => !chosen.includes(l));
        const orbLane = safeLanes.length ? safeLanes[0] : chosen.find((l) => obstacles.some((o) => o.lane === l && o.kind === 'low')) ?? 0;
        const orbChance = 0.55 + (overdrive ? this.cfg.overdriveOrbChance : 0);
        if (rand() < orbChance)
            pickups.push({ lane: orbLane, kind: 'orb' });
        // Rare health cell, only when not at full intensity chaos.
        if (rand() < 0.06)
            pickups.push({ lane: (orbLane + 1) % lanes, kind: 'cell' });
        const row = { obstacles, pickups };
        // Final safety net — should be unreachable given the construction above.
        if (!rowIsSurvivable(row, lanes)) {
            row.obstacles = row.obstacles.slice(0, lanes - 1);
            for (const o of row.obstacles)
                o.kind = 'low';
        }
        return row;
    }
}

// ---- entities/player.js ----
class PlayerState {
    cfg;
    /** Target lane index (0 = left … lanes-1 = right). */
    lane;
    /** Continuous lateral position in lane units (eases toward `lane`). */
    x;
    /** Seconds since the jump started; >= jumpTime means grounded. */
    jumpT;
    /** Hits taken this run (energy cells spent). */
    hits = 0;
    /** Mercy invincibility remaining (seconds). */
    invincibleT = 0;
    /** Stun remaining (seconds) — no steering while stunned. */
    stunT = 0;
    /** Seconds since the last lane change started (for near-miss detection). */
    sinceSwitch = 99;
    constructor(cfg) {
        this.cfg = cfg;
        this.lane = Math.floor(cfg.lanes / 2);
        this.x = this.lane;
        this.jumpT = cfg.jumpTime; // grounded
    }
    get grounded() {
        return this.jumpT >= this.cfg.jumpTime;
    }
    /** Height above the road right now (world units). */
    get jumpOffset() {
        if (this.grounded)
            return 0;
        const p = this.jumpT / this.cfg.jumpTime;
        return Math.sin(p * Math.PI) * this.cfg.jumpHeight;
    }
    get invincible() {
        return this.invincibleT > 0;
    }
    /** True while the rider is stunned after a crash — controls locked out. */
    get stunned() {
        return this.stunT > 0;
    }
    moveLeft() {
        return this.moveTo(this.lane - 1);
    }
    moveRight() {
        return this.moveTo(this.lane + 1);
    }
    moveTo(lane) {
        if (this.stunned)
            return false;
        const clamped = Math.max(0, Math.min(this.cfg.lanes - 1, lane));
        if (clamped === this.lane)
            return false;
        this.lane = clamped;
        this.sinceSwitch = 0;
        return true;
    }
    jump() {
        if (!this.grounded || this.stunned)
            return false;
        this.jumpT = 0;
        return true;
    }
    /**
     * Register a hit. Returns 'ignored' (invincible), 'hit', or 'crash' when the
     * last energy cell was spent. A crash stuns the rider, grants a longer
     * invulnerability window and REFILLS every cell — the run always continues.
     */
    hit() {
        if (this.invincible)
            return 'ignored';
        this.hits++;
        if (this.hits >= this.cfg.maxHits) {
            this.hits = 0; // energy restored — the song plays on
            this.stunT = this.cfg.crashStunTime;
            this.invincibleT = this.cfg.crashInvincibleTime;
            return 'crash';
        }
        this.invincibleT = this.cfg.invincibleTime;
        return 'hit';
    }
    /** Heal one energy cell (from a battery pickup). */
    heal() {
        this.hits = Math.max(0, this.hits - 1);
    }
    update(dt) {
        // Ease toward the target lane: laneSwitchTime seconds per lane.
        const rate = 1 / Math.max(0.01, this.cfg.laneSwitchTime);
        const d = this.lane - this.x;
        const step = Math.sign(d) * rate * dt;
        this.x = Math.abs(step) >= Math.abs(d) ? this.lane : this.x + step;
        if (this.jumpT < this.cfg.jumpTime)
            this.jumpT += dt;
        if (this.invincibleT > 0)
            this.invincibleT -= dt;
        if (this.stunT > 0)
            this.stunT -= dt;
        this.sinceSwitch += dt;
    }
}

// ---- scenes/boot.js ----

//                      track, then continue to Title.

// audio) lands on a clear error card with RETRY and DEMO actions — the player

        d.msdfText(this.startText, W / 2, H * 0.62, { origin: { x: 0.5, y: 0.5 }, alpha: pulse });
        d.msdfText(this.controlsText, W / 2, H * 0.7, { origin: { x: 0.5 } });
        d.msdfText(this.bestText, W / 2, H * 0.76, { origin: { x: 0.5 } });
        d.msdfText(this.creditText, W / 2, H - 22, { origin: { x: 0.5 }, alpha: 0.85 });
    }
}

// ---- scenes/play.js ----
// Play — the Neon Dash run. A pseudo-3D three-lane endless runner rendered
// entirely immediate-mode: obstacles/collectibles live in pooled depth-sorted
// pools and are projected onto a rain-soaked neon street. The MusicDirector
// drives everything from the song clock — beats spawn rows on the grid,
// sections shift the city, energy events raise the speed, drops fire
// OVERDRIVE, peaks drop golden orb spirals.
//
// THE SONG IS THE AUTHORITATIVE TIMELINE. The master clock is the audio
// element's own playhead: gameplay waits in a pre-roll until the stream is
// audible, follows el.currentTime while live (holding position through buffer
// stalls), pauses/resumes with it, and the run ends when the song ends. The
// music is never stretched, looped, sped up or slowed down to fit the game.
//
// TRACKCADE CRASH POLICY: running out of energy never ends the run — it costs
// score and combo, stuns the rider, grants invulnerability and refills the
// cells. The song plays on.








// ── World layout (projection constants — rendering, not gameplay tuning) ──
const VIEW_Z = 560; // spawn/cull depth
const FOCAL = 0.92; // projection strength
const CAM_H = 30; // camera height above the road
const HORIZON_Y = 108; // screen y of the horizon
const GROUND_Y = 342; // screen y of the road at the camera
const LANE_W = 44; // world units between lane centres
const ROAD_HALF = 76; // road half-width in world units
const PLAYER_Z = 26; // the rider's fixed depth
const HIT_DEPTH = 10; // collision window around the player
const NEAR_MISS_DEPTH = 13; // near-miss skim window
const POOL_OBSTACLES = 28;
const POOL_PICKUPS = 24;
const RAIN_DROPS = 42;

// Skyline tint per musical section — the environment shifts with the song.
const SECTION_TINTS = ['#ffffff', '#ffd9f2', '#d2f6ff', '#fff3c4', '#e4d6ff'];
// Pre-roll fallback: if no audio element is reachable after this many frames
// (no WebAudio in the environment), run on the frame clock so the game plays.
const PREROLL_FALLBACK_FRAMES = 600;
const s = (z) => FOCAL * CAM_H / (CAM_H + z); // perspective scale
const groundY = (z) => HORIZON_Y + (GROUND_Y - HORIZON_Y) * s(z);
class Play extends Scene {
    // logic
    player;
    director;
    scorer;
    difficulty;
    ramp;
    hiscore;
    // run state
    songTime = 0;
    elapsed = 0;
    distance = 0;
    speed = 0;
    paused = false;
    phase = 'preroll';
    prerollFrames = 0;
    lastAudioT = -1;
    stalledT = 0;
    overdriveT = 0; // seconds of Overdrive remaining
    beatPulse = 0; // 1 right after a beat, decays
    beatCount = 0;
    rowIndex = 0;
    sectionIdx = 0;
    sectionTint = SECTION_TINTS[0];
    peakQueue = 0; // pending peak-spiral orbs
    resultSent = false;
    // pools
    obstacles = [];
    pickups = [];
    floaters = [];
    rain = [];
    splashes = [];
    buildings = [];
    // art
    frames;
    fontUi;
    fontBig;
    hudScore;
    hudCombo;
    hudTrack;
    hudBanner;
    hudPause;
    hudPauseHint;
    hudSync;
    bloom = null;
    bannerT = 0;
    keys;
    preload(load) {
        const a = TRACK.art;
        load.image(a.player);
        load.image(a.obstacleLow);
        load.image(a.obstacleWall);
        load.image(a.orb);
        load.image(a.cell);
        load.image(a.skyline);
        load.msdfFont(`${FONT_CDN}/bungee.png`, `${FONT_CDN}/bungee.json`);
        load.msdfFont(`${FONT_CDN}/jetbrains-mono.png`, `${FONT_CDN}/jetbrains-mono.json`);
    }
    async setup() {
        const g = this.game;
        this.player = new PlayerState(TRACK);
        this.director = new MusicDirector(TRACK, TRACK.songLength + 5);
        this.scorer = new ScoreKeeper(TRACK);
        this.difficulty = new RowGenerator(TRACK);
        this.ramp = new Difficulty(TRACK);
        this.hiscore = new HighScore(TRACK.highScoreKey, globalThis.localStorage ?? {
            getItem: () => null, setItem: () => { },
        });
        // frames
        this.frames = {
            player: g.assets.framesOf(TRACK.art.player),
            low: g.assets.framesOf(TRACK.art.obstacleLow),
            wall: g.assets.framesOf(TRACK.art.obstacleWall),
            orb: g.assets.framesOf(TRACK.art.orb),
            cell: g.assets.framesOf(TRACK.art.cell),
            skyline: g.assets.framesOf(TRACK.art.skyline),
            soft: g.assets.frames(particleCanvas({ kind: 'soft' })),
        };
        // fonts + HUD text blocks (built once, mutated per frame)
        this.fontBig = await g.assets.msdfFont(`${FONT_CDN}/bungee.png`, `${FONT_CDN}/bungee.json`);
        this.fontUi = await g.assets.msdfFont(`${FONT_CDN}/jetbrains-mono.png`, `${FONT_CDN}/jetbrains-mono.json`);
        this.hudScore = g.assets.msdfText(this.fontBig, '0', { fontSize: 30, color: '#ffffff' });
        this.hudCombo = g.assets.msdfText(this.fontUi, '', { fontSize: 13, color: TRACK.palette.collectible });
        this.hudTrack = g.assets.msdfText(this.fontUi, `${TRACK.artist} — ${TRACK.title}`, { fontSize: 10, color: '#8fa3d9' });
        this.hudBanner = g.assets.msdfText(this.fontBig, '', {
            fontSize: 34, color: TRACK.palette.overdriveA,
            outline: { width: 0.12, color: '#2a0a2e' },
        });
        this.hudPause = g.assets.msdfText(this.fontBig, 'PAUSED', { fontSize: 40, color: '#ffffff' });
        this.hudPauseHint = g.assets.msdfText(this.fontUi, 'tap or P to resume', { fontSize: 14, color: '#8fa3d9' });
        this.hudSync = g.assets.msdfText(this.fontUi, 'SYNCING AUDIO', { fontSize: 14, color: TRACK.palette.primary });
        // pools
        for (let i = 0; i < POOL_OBSTACLES; i++)
            this.obstacles.push({ alive: false, lane: 0, kind: 'low', z: 0, resolved: false, nearMissed: false });
        for (let i = 0; i < POOL_PICKUPS; i++)
            this.pickups.push({ alive: false, lane: 0, kind: 'orb', z: 0, phase: 0 });
        for (let i = 0; i < RAIN_DROPS; i++)
            this.rain.push({ x: Math.random(), y: Math.random(), len: 8 + Math.random() * 10, spd: 300 + Math.random() * 160 });
        for (let layer = 0; layer < 2; layer++) {
            for (let i = 0; i < 9; i++) {
                this.buildings.push({
                    x: i * 34 + Math.random() * 12, w: 20 + Math.random() * 16,
                    h: 26 + Math.random() * (layer ? 34 : 52), hue: Math.random(),
                    side: i % 2 ? 1 : -1, layer,
                });
            }
        }
        // look: neon bloom + vignette, starless rainy sky handled in draw
        this.bloom = g.post.add('bloom', { threshold: 0.5, strength: TRACK.baseBloom, radius: 2.5 });
        g.post.add('vignette', { strength: 0.35 });
        // input — keyboard + gestures
        this.keys = this.input.bind({
            left: [KEY_LEFT, 'KeyA'],
            right: [KEY_RIGHT, 'KeyD'],
            jump: [KEY_SPACE, KEY_UP, 'KeyW'],
            pause: ['KeyP', 'Escape'],
        });
        this.input.onSwipe((e) => {
            if (this.paused || this.player.stunned)
                return;
            if (e.direction === 'left')
                this.player.moveLeft();
            else if (e.direction === 'right')
                this.player.moveRight();
            else if (e.direction === 'up')
                this.player.jump();
        });
        this.input.onTap((e) => {
            if (this.paused) {
                this.togglePause();
                return;
            }
            if (this.player.stunned)
                return;
            // top-right corner = pause button; anywhere else = jump
            const hudScale = g.hud.w > 0 ? g.hud.h / this.height : 1;
            if (e.x * hudScale > g.hud.w - 56 && e.y * hudScale < 56) {
                this.togglePause();
                return;
            }
            this.player.jump();
        });
        // The soundtrack starts here (this scene is reached by the title-screen
        // tap — the user gesture autoplay policies require). The track plays once:
        // when the song ends, the run ends. The game clock then FOLLOWS the audio
        // element's playhead, so gameplay and audio can never drift apart.
        this.sound.music(TRACK.audioUrl, { loop: false, volume: 0.55 });
    }
    // ── helpers ──────────────────────────────────────────────────────────────
    get overdrive() { return this.overdriveT > 0; }
    /** The engine audio service's live music element (the master clock). */
    musicEl() {
        const snd = this.game.sound;
        return snd.musicEl ?? null;
    }
    laneX(lanePos, z) {
        return this.centerX + (lanePos - 1) * LANE_W * s(z);
    }
    spawnObstacle(lane, kind) {
        const o = this.obstacles.find((e) => !e.alive);
        if (!o)
            return;
        o.alive = true;
        o.lane = lane;
        o.kind = kind;
        o.z = VIEW_Z;
        o.resolved = false;
        o.nearMissed = false;
    }
    spawnPickup(lane, kind, z = VIEW_Z) {
        const p = this.pickups.find((e) => !e.alive);
        if (!p)
            return;
        p.alive = true;
        p.lane = lane;
        p.kind = kind;
        p.z = z;
        p.phase = Math.random() * Math.PI * 2;
    }
    floater(str, color, size = 15) {
        if (this.floaters.length > 7)
            this.floaters.shift();
        this.floaters.push({
            text: this.game.assets.msdfText(this.fontUi, str, { fontSize: size, color, weight: 0.06 }),
            t: 0, life: 0.9, x: this.game.hud.w / 2, y: this.game.hud.h * 0.3,
        });
    }
    banner(str) {
        this.bannerT = 1.6;
        this.hudBanner.setText(str);
    }
    togglePause() {
        this.paused = !this.paused;
        if (this.paused)
            this.sound.pause();
        else
            this.sound.resume();
    }
    // ── music events ─────────────────────────────────────────────────────────
    onMusicEvent(e) {
        const pal = TRACK.palette;
        switch (e.kind) {
            case 'beat': {
                this.beatPulse = 1;
                this.beatCount++;
                // obstacle rows spawn on the beat grid
                if (this.beatCount % TRACK.spawnRowEveryBeats === 0) {
                    const row = this.difficulty.row(this.rowIndex * 7919 + 13, this.ramp.spawnIntensity(this.elapsed, this.songTime), this.overdrive);
                    this.rowIndex++;
                    for (const o of row.obstacles)
                        this.spawnObstacle(o.lane, o.kind);
                    for (const p of row.pickups)
                        this.spawnPickup(p.lane, p.kind);
                }
                break;
            }
            case 'section': {
                this.sectionIdx++;
                this.banner((e.name ?? 'section').toUpperCase());
                this.game.camera.flash(pal.primary, 0.12);
                // the city changes with the music: re-seed building lights, retint the sky
                for (const b of this.buildings)
                    b.hue = Math.random();
                this.sectionTint = SECTION_TINTS[this.sectionIdx % SECTION_TINTS.length];
                break;
            }
            case 'energy': {
                this.ramp.energyLevel++;
                this.floater('ENERGY UP', pal.primary, 17);
                this.game.fx.emit({ x: this.centerX, y: this.centerY, count: 26, speed: 130, colors: [pal.primary, '#ffffff'], add: true, drag: 2 });
                break;
            }
            case 'drop': {
                this.overdriveT = e.duration ?? 12;
                this.banner('OVERDRIVE!');
                this.game.camera.flash(pal.overdriveA, 0.35);
                this.game.camera.shake(5, 0.4);
                this.sound.play({ notes: 'C5 E5 G5 C6:2', step: 0.09, type: 'square', volume: 0.5 });
                break;
            }
            case 'peak': {
                // golden orb spiral: a stream of orbs weaving across the lanes
                this.peakQueue = 14;
                this.banner('PEAK!');
                this.game.camera.flash(pal.collectible, 0.25);
                break;
            }
        }
    }
    /** Ambient animation that also runs during pre-roll (rain, floaters). */
    updateAmbient(dt) {
        const rainBoost = this.overdrive ? 1.6 : 1;
        for (const r of this.rain) {
            r.y += (r.spd * rainBoost * dt) / this.height;
            r.x -= (r.spd * 0.18 * dt) / this.width;
            if (r.y > 1) {
                r.y = -0.05;
                r.x = Math.random() * 1.2;
                if (Math.random() < 0.25 && this.splashes.length < 10)
                    this.splashes.push({ x: r.x, t: 0 });
            }
        }
        for (const sp of this.splashes)
            sp.t += dt;
        this.splashes = this.splashes.filter((sp) => sp.t < 0.4);
        for (const f of this.floaters)
            f.t += dt;
        this.floaters = this.floaters.filter((f) => f.t < f.life);
    }
    // ── frame ────────────────────────────────────────────────────────────────
    update(dt) {
        super.update(dt);
        if (this.paused) {
            if (this.keys.pause.pressed)
                this.togglePause();
            return;
        }
        if (this.keys.pause.pressed) {
            this.togglePause();
            return;
        }
        const el = this.musicEl();
        // ── pre-roll: the world animates but the song clock stays at 0:00 until
        // the stream is actually audible — gameplay and audio begin together.
        if (this.phase === 'preroll') {
            this.prerollFrames++;
            if (el && !el.paused && el.currentTime > 0.02) {
                this.phase = 'live';
                this.lastAudioT = el.currentTime;
            }
            else if (!el && this.prerollFrames > PREROLL_FALLBACK_FRAMES) {
                this.phase = 'live'; // no audio element reachable — frame clock
            }
            this.updateAmbient(dt);
            return;
        }
        // ── master clock: follow the audio playhead. While the stream buffers,
        // the song clock holds its position instead of drifting ahead.
        if (el) {
            const t = el.currentTime;
            if (t !== this.lastAudioT) {
                this.songTime = t;
                this.lastAudioT = t;
                this.stalledT = 0;
            }
            else if (!el.ended) {
                this.stalledT += dt;
            }
        }
        else {
            this.songTime += dt;
        }
        this.elapsed += dt;
        for (const e of this.director.tick(this.songTime, TRACK.beatOffset))
            this.onMusicEvent(e);
        // the run ends when the song ends — bank the finish bonus, show results
        if (this.songTime >= TRACK.songLength || (el?.ended ?? false)) {
            if (!this.resultSent) {
                this.resultSent = true;
                this.scorer.addBonus(TRACK.finishBonus);
                const isBest = this.hiscore.submit(this.scorer.score);
                this.sound.stopMusic({ fadeOut: 0.4 });
                this.gotoGameOver({
                    score: Math.floor(this.scorer.score), best: this.hiscore.value, isBest,
                    orbs: this.scorer.orbs, nearMisses: this.scorer.nearMisses,
                    distance: Math.floor(this.distance), finished: true,
                });
            }
            return;
        }
        // speed + distance + score
        this.speed = this.ramp.speed(this.elapsed, this.overdrive);
        const dz = this.speed * dt;
        this.distance += dz;
        this.scorer.addDistance(dz, this.overdrive);
        if (this.overdriveT > 0)
            this.overdriveT -= dt;
        this.beatPulse = Math.max(0, this.beatPulse - dt * 3.2);
        if (this.bannerT > 0)
            this.bannerT -= dt;
        this.bloom?.set('strength', this.overdrive ? TRACK.overdriveBloom : TRACK.baseBloom + this.beatPulse * 0.15);
        // peak orb spiral
        if (this.peakQueue > 0) {
            this.peakQueue -= dt * 9;
            while (this.peakQueue >= 1) {
                this.peakQueue -= 1;
                const lane = Math.floor((Math.sin(this.elapsed * 5) * 0.5 + 0.5) * 2.999);
                this.spawnPickup(lane, 'orb', VIEW_Z);
            }
            this.peakQueue = Math.max(0, this.peakQueue);
        }
        // input
        if (!this.player.stunned) {
            if (this.keys.left.pressed)
                this.player.moveLeft();
            if (this.keys.right.pressed)
                this.player.moveRight();
            if (this.keys.jump.pressed)
                this.player.jump();
        }
        // player
        this.player.update(dt);
        const pal = TRACK.palette;
        // hoverboard trail (a stream — pooled by the engine)
        const px = this.laneX(this.player.x, PLAYER_Z);
        const py = groundY(PLAYER_Z) - this.player.jumpOffset;
        this.game.fx.emit({
            x: px, y: py + 2, count: this.overdrive ? 2 : 1, speed: 8, life: 0.4,
            size: this.overdrive ? 4 : 2.5, colors: this.overdrive ? [pal.overdriveA, pal.overdriveB] : [pal.primary],
            add: true, alpha: 0.7, frame: this.frames.soft,
        });
        // obstacles
        for (const o of this.obstacles) {
            if (!o.alive)
                continue;
            o.z -= dz;
            if (o.z < -30) {
                o.alive = false;
                continue;
            }
            if (o.resolved)
                continue;
            const dzp = o.z - PLAYER_Z;
            if (Math.abs(dzp) < HIT_DEPTH) {
                const lateral = Math.abs(this.player.x - o.lane);
                if (lateral < 0.42) {
                    const clears = o.kind === 'low' && this.player.jumpOffset > 20;
                    if (!clears) {
                        o.resolved = true;
                        const result = this.player.hit();
                        if (result !== 'ignored') {
                            this.scorer.registerHit();
                            this.game.camera.shake(6, 0.35);
                            this.game.camera.flash(pal.hazard, 0.25);
                            this.game.fx.emit({ x: px, y: py - 10, count: 30, speed: 150, colors: [pal.hazard, '#ffffff'], add: true, drag: 2 });
                            this.sound.play({ type: 'noise', duration: 0.3, filter: { type: 'lowpass', freq: 2400, freqEnd: 120 }, distortion: 0.5, volume: 0.7 });
                            if (result === 'crash') {
                                // energy ran out — heavy penalty, brief stun, then the cells
                                // refill and the song plays on (Trackcade: no game over)
                                const lost = this.scorer.applyCrashPenalty();
                                this.banner('CRASH!');
                                this.floater(`−${lost} PTS`, pal.hazard, 18);
                                this.game.camera.shake(10, 0.7);
                                this.game.camera.flash('#ffffff', 0.4);
                                this.sound.play({ notes: 'A3 F3 D3 A2:3', step: 0.14, type: 'sawtooth', volume: 0.6 });
                            }
                            else {
                                this.floater(`${TRACK.maxHits - this.player.hits} ENERGY LEFT`, pal.hazard, 14);
                            }
                        }
                    }
                }
                else if (!o.nearMissed && lateral >= 0.42 && lateral < 1.45 && Math.abs(dzp) < NEAR_MISS_DEPTH) {
                    // skimmed past in an adjacent lane (or mid-switch)
                    o.nearMissed = true;
                    const pts = this.scorer.nearMiss(this.overdrive);
                    this.floater(`NEAR MISS +${pts}`, pal.secondary, 13);
                    this.sound.play({ type: 'sine', freq: 1400, freqEnd: 2200, duration: 0.08, volume: 0.35 });
                }
            }
            if (dzp < -NEAR_MISS_DEPTH)
                o.resolved = true; // behind us — stop testing
        }
        // pickups
        for (const p of this.pickups) {
            if (!p.alive)
                continue;
            p.z -= dz;
            p.phase += dt * 4;
            if (p.z < -30) {
                p.alive = false;
                continue;
            }
            const dzp = p.z - PLAYER_Z;
            if (Math.abs(dzp) < HIT_DEPTH + 4 && Math.abs(this.player.x - p.lane) < 0.5) {
                p.alive = false;
                const sx = this.laneX(p.lane, p.z);
                const sy = groundY(p.z) - 14;
                if (p.kind === 'orb') {
                    const pts = this.scorer.collectOrb(this.overdrive);
                    this.floater(`+${pts}`, pal.collectible, 14);
                    this.game.fx.emit({ x: sx, y: sy, count: 12, speed: 70, life: 0.45, size: 2.5, colors: [pal.collectible, '#fff2b0'], add: true });
                    this.sound.play({ type: 'sine', freq: 880, freqEnd: 1760, sweep: 'exponential', duration: 0.12, volume: 0.4 });
                }
                else {
                    this.player.heal();
                    this.floater('+1 ENERGY', pal.primary, 15);
                    this.game.fx.emit({ x: sx, y: sy, count: 18, speed: 90, life: 0.5, colors: [pal.primary, '#ffffff'], add: true });
                    this.sound.play({ notes: 'E5 G5 C6', step: 0.07, type: 'triangle', volume: 0.5 });
                }
            }
        }
        this.updateAmbient(dt);
    }
    // ── world ────────────────────────────────────────────────────────────────
    draw(d) {
        super.draw(d);
        const pal = TRACK.palette;
        const W = this.width;
        const cx = this.centerX;
        const pulse = this.beatPulse;
        // sky
        d.rect(0, 0, W, HORIZON_Y + 2, pal.skyTop);
        d.rect(0, HORIZON_Y * 0.55, W, HORIZON_Y * 0.45 + 2, pal.skyBottom, 0.85);
        // skyline band (parallax pan, drawn twice for wraparound)
        const skyFrame = this.frames.skyline;
        const skyW = W * 1.6;
        const skyH = skyW * (240 / 384);
        const pan = (this.distance * 0.02) % skyW;
        d.sprite(skyFrame, -pan, HORIZON_Y - skyH + 4, { w: skyW, h: skyH, alpha: 0.9, tint: this.sectionTint });
        d.sprite(skyFrame, skyW - pan, HORIZON_Y - skyH + 4, { w: skyW, h: skyH, alpha: 0.9, tint: this.sectionTint });
        // roadside buildings (two parallax layers, wrapping)
        for (const b of this.buildings) {
            const speedF = b.layer === 0 ? 0.12 : 0.3;
            const span = 9 * 34 + 40;
            let bx = (b.x - this.distance * speedF) % span;
            if (bx < 0)
                bx += span;
            const side = b.side;
            const baseX = side < 0 ? cx - ROAD_HALF - 6 - bx * 0.9 : cx + ROAD_HALF + 6 + bx * 0.9;
            const h = b.h * (b.layer === 0 ? 1.25 : 0.85);
            const w = b.w * (b.layer === 0 ? 1.1 : 0.8);
            const x = side < 0 ? baseX - w : baseX;
            if (x > W || x + w < 0)
                continue;
            const body = b.layer === 0 ? '#0d1230' : '#080c22';
            d.rect(x, HORIZON_Y - h, w, h, body, b.layer === 0 ? 0.95 : 0.8);
            // neon trim + a few lit windows
            const trim = b.hue < 0.5 ? pal.secondary : pal.primary;
            d.rect(x, HORIZON_Y - h, w, 1.5, trim, 0.9);
            const cols = Math.max(1, Math.floor(w / 7));
            const rows = Math.max(1, Math.floor(h / 10));
            for (let wy = 0; wy < rows; wy++) {
                for (let wx = 0; wx < cols; wx++) {
                    const lit = Math.sin(b.x * 12.9 + wx * 7.7 + wy * 3.3) > 0.35;
                    if (lit)
                        d.rect(x + 3 + wx * 7, HORIZON_Y - h + 4 + wy * 10, 2.5, 3.5, b.hue < 0.33 ? '#ffd147' : trim, 0.8);
                }
            }
        }
        // road — trapezoid with alternating depth bands (the forward-motion cue)
        const roadHalfAt = (z) => ROAD_HALF * s(z) + 2;
        const band = 26;
        const off = this.distance % band;
        for (let z = -band; z < VIEW_Z; z += band) {
            const z0 = z + off;
            const z1 = z0 + band;
            if (z1 < 0)
                continue;
            const y0 = groundY(z0);
            const y1 = groundY(z1);
            const h0 = roadHalfAt(z0);
            const h1 = roadHalfAt(z1);
            const alt = Math.floor((z + this.distance) / band) % 2 === 0;
            d.fill([{ x: cx - h1, y: y1 }, { x: cx + h1, y: y1 }, { x: cx + h0, y: y0 }, { x: cx - h0, y: y0 }], alt ? pal.road : pal.roadAlt);
        }
        // wet sheen on the asphalt
        d.fill([{ x: cx - roadHalfAt(VIEW_Z), y: groundY(VIEW_Z) }, { x: cx + roadHalfAt(VIEW_Z), y: groundY(VIEW_Z) },
            { x: cx + roadHalfAt(0), y: groundY(0) }, { x: cx - roadHalfAt(0), y: groundY(0) }], '#8fb8ff', 0.05 + pulse * 0.03);
        // lane dividers — a faint continuous rail plus bright scrolling dashes
        for (const boundary of [-0.5, 0.5]) {
            d.line(cx + boundary * LANE_W * s(0), groundY(0), cx + boundary * LANE_W * s(VIEW_Z), groundY(VIEW_Z), 1, pal.laneGlow, 0.16);
            for (let z = 6; z < VIEW_Z; z += 22) {
                const zr = z + (this.distance % 22);
                const x0 = cx + boundary * LANE_W * s(zr);
                const x1 = cx + boundary * LANE_W * s(zr + 9);
                d.line(x0, groundY(zr), x1, groundY(zr + 9), Math.max(0.8, 2.6 * s(zr)), pal.laneGlow, 0.5 + pulse * 0.35);
            }
        }
        // road edges — the neon rails; they shift hue in Overdrive
        const edgeL = this.overdrive ? pal.overdriveB : pal.edgeLeft;
        const edgeR = this.overdrive ? pal.overdriveA : pal.edgeRight;
        const edgeAlpha = 0.75 + pulse * 0.25;
        d.line(cx - roadHalfAt(0), groundY(0), cx - roadHalfAt(VIEW_Z), groundY(VIEW_Z), 2.4, edgeL, edgeAlpha);
        d.line(cx + roadHalfAt(0), groundY(0), cx + roadHalfAt(VIEW_Z), groundY(VIEW_Z), 2.4, edgeR, edgeAlpha);
        d.line(cx - roadHalfAt(0) - 3, groundY(0), cx - roadHalfAt(VIEW_Z) - 1, groundY(VIEW_Z), 1, edgeL, 0.3);
        d.line(cx + roadHalfAt(0) + 3, groundY(0), cx + roadHalfAt(VIEW_Z) + 1, groundY(VIEW_Z), 1, edgeR, 0.3);
        // entities — depth sorted far → near
        const liveO = this.obstacles.filter((o) => o.alive).sort((a, b) => b.z - a.z);
        const liveP = this.pickups.filter((p) => p.alive).sort((a, b) => b.z - a.z);
        let pi = 0;
        for (const o of liveO) {
            while (pi < liveP.length && liveP[pi].z > o.z) {
                this.drawPickup(d, liveP[pi]);
                pi++;
            }
            this.drawObstacle(d, o);
        }
        while (pi < liveP.length) {
            this.drawPickup(d, liveP[pi]);
            pi++;
        }
        // player
        this.drawPlayer(d);
        // rain (screen-space streaks over the world)
        const rainColor = this.overdrive ? pal.overdriveA : '#9fc8ff';
        for (const r of this.rain) {
            const rx = r.x * W;
            const ry = r.y * this.height;
            d.line(rx, ry, rx - r.len * 0.18, ry + r.len, 0.7, rainColor, 0.35);
        }
        for (const sp of this.splashes) {
            const p = sp.t / 0.4;
            d.ring(sp.x * W, GROUND_Y - 4, 1 + p * 5, 0.6, rainColor, 0.4 * (1 - p));
        }
        // Overdrive heat wash
        if (this.overdrive) {
            d.rect(0, 0, W, this.height, pal.overdriveB, 0.05 + 0.03 * Math.sin(this.elapsed * 9));
        }
    }
    drawObstacle(d, o) {
        const pal = TRACK.palette;
        const sc = s(o.z);
        const x = this.laneX(o.lane, o.z);
        const gy = groundY(o.z);
        const frame = o.kind === 'low' ? this.frames.low : this.frames.wall;
        const natW = o.kind === 'low' ? 64 : 59;
        const natH = o.kind === 'low' ? 33 : 64;
        const w = natW * sc * 1.05;
        const h = natH * sc * 1.05;
        // wet reflection under it
        d.sprite(frame, x - w / 2, gy, { w, h: h * 0.5, alpha: 0.18, tint: o.kind === 'low' ? pal.hazard : pal.secondary });
        d.sprite(frame, x - w / 2, gy - h, { w, h, fx: { glow: { color: o.kind === 'low' ? pal.hazard : pal.secondary, size: 6 * sc + 2 } } });
    }
    drawPickup(d, p) {
        const pal = TRACK.palette;
        const sc = s(p.z);
        const x = this.laneX(p.lane, p.z);
        const bob = Math.sin(p.phase) * 3 * sc;
        const gy = groundY(p.z) - 16 * sc + bob;
        const frame = p.kind === 'orb' ? this.frames.orb : this.frames.cell;
        const nat = p.kind === 'orb' ? 63 : 36;
        const natH = 64;
        const size = nat * sc * 0.55;
        const h = natH * sc * 0.55;
        const glowColor = p.kind === 'orb' ? pal.collectible : pal.primary;
        d.sprite(this.frames.soft, x - size, gy - h * 0.15 - size, { w: size * 2, h: size * 2, tint: glowColor, alpha: 0.35 + this.beatPulse * 0.2 });
        d.sprite(frame, x - size / 2, gy - h, { w: size, h, fx: { glow: { color: glowColor, size: 5 * sc + 2 } } });
    }
    drawPlayer(d) {
        const pal = TRACK.palette;
        const sc = s(PLAYER_Z);
        const x = this.laneX(this.player.x, PLAYER_Z);
        const jump = this.player.jumpOffset;
        const gy = groundY(PLAYER_Z);
        const w = 49 * sc * 1.15;
        const h = 64 * sc * 1.15;
        // ground shadow (shrinks with height)
        const shadowW = w * (1 - jump / (TRACK.jumpHeight * 2.4));
        d.sprite(this.frames.soft, x - shadowW / 2, gy - 3, { w: shadowW, h: 7, tint: '#000010', alpha: 0.5 * (1 - jump / (TRACK.jumpHeight * 2)) });
        // wet reflection
        d.sprite(this.frames.player, x - w / 2, gy + 2, { w, h: h * 0.45, alpha: 0.16, tint: pal.primary });
        // rider — leans into lane switches, blinks during mercy invincibility,
        // glows hazard-red while stunned after a crash
        const lean = (this.player.lane - this.player.x) * 0.55;
        const blink = this.player.invincible && Math.floor(this.elapsed * 14) % 2 === 0;
        if (!blink) {
            d.sprite(this.frames.player, x - w / 2, gy - jump - h, {
                w, h, rot: lean,
                fx: { glow: { color: this.player.stunned ? pal.hazard : this.overdrive ? pal.overdriveA : pal.primary, size: 7 } },
            });
        }
    }
    // ── HUD (CSS pixels) ─────────────────────────────────────────────────────
    drawHud(d) {
        const pal = TRACK.palette;
        const W = d.w;
        // score
        this.hudScore.setText(String(Math.floor(this.scorer.score)));
        d.msdfText(this.hudScore, 12, 10);
        // combo
        const mult = this.scorer.effectiveMultiplier(this.overdrive);
        if (mult > 1) {
            this.hudCombo.setText(`COMBO x${mult}`);
            this.hudCombo.setColor(this.overdrive ? pal.overdriveA : pal.collectible);
            d.msdfText(this.hudCombo, 12, 46);
        }
        // energy cells — chunky battery pips
        const remaining = TRACK.maxHits - this.player.hits;
        for (let i = 0; i < TRACK.maxHits; i++) {
            const x = 12 + i * 26;
            const y = 62;
            const filled = i < remaining;
            d.rect(x - 1, y - 1, 22, 14, '#0a0d1f');
            d.rect(x, y, 20, 12, filled ? pal.secondary : '#2a2138');
            if (filled) {
                d.rect(x + 2, y + 2, 16, 3, '#ffffff', 0.55);
                d.rect(x + 20, y + 3, 3, 6, pal.secondary);
            }
        }
        // track credit, top centre
        d.msdfText(this.hudTrack, W / 2, 8, { origin: { x: 0.5 }, alpha: 0.8 });
        // song progress — the run ends when the bar fills
        const prog = Math.min(1, this.songTime / TRACK.songLength);
        d.rect(W / 2 - 70, 22, 140, 3, '#ffffff22');
        d.rect(W / 2 - 70, 22, 140 * prog, 3, this.overdrive ? pal.overdriveA : pal.primary);
        // pause button
        d.rect(W - 46, 12, 34, 30, '#ffffff14');
        d.rect(W - 36, 19, 4, 16, '#cfe4ff');
        d.rect(W - 28, 19, 4, 16, '#cfe4ff');
        // overdrive meter
        if (this.overdrive) {
            const frac = Math.min(1, this.overdriveT / 15);
            d.rect(W / 2 - 60, 26, 120, 5, '#2a1030');
            d.rect(W / 2 - 60, 26, 120 * frac, 5, pal.overdriveA);
        }
        // banner
        if (this.bannerT > 0) {
            const a = Math.min(1, this.bannerT / 0.4);
            const scale = 1 + Math.max(0, this.bannerT - 1.2) * 0.8;
            d.msdfText(this.hudBanner, W / 2, d.h * 0.24, { origin: { x: 0.5, y: 0.5 }, alpha: a, scale });
        }
        // floaters
        for (const f of this.floaters) {
            const p = f.t / f.life;
            d.msdfText(f.text, f.x, f.y - p * 34, { origin: { x: 0.5 }, alpha: 1 - p * p });
        }
        // pre-roll sync indicator
        if (this.phase === 'preroll') {
            const dots = '.'.repeat(1 + (Math.floor(this.prerollFrames / 30) % 3));
            this.hudSync.setText(`SYNCING AUDIO${dots}`);
            d.msdfText(this.hudSync, W / 2, d.h * 0.42, { origin: { x: 0.5, y: 0.5 } });
        }
        // pause overlay
        if (this.paused) {
            d.rect(0, 0, W, d.h, '#05060fd9');
            d.msdfText(this.hudPause, W / 2, d.h * 0.42, { origin: { x: 0.5, y: 0.5 } });
            d.msdfText(this.hudPauseHint, W / 2, d.h * 0.42 + 44, { origin: { x: 0.5 } });
        }
    }
}
const KEY_LEFT = 'ArrowLeft';
const KEY_RIGHT = 'ArrowRight';
const KEY_SPACE = 'Space';
const KEY_UP = 'ArrowUp';

// ---- scenes/gameover.js ----
// GameOver — run results + nearly instant restart. Tap / Space / Enter goes
// straight back into a fresh run (the Play scene rebuilds from scratch and the
// soundtrack restarts with it). The 500 ms input grace on scene entry stops an
// end-of-song tap from skipping the screen.
//
// Trackcade runs always end the same way: the song completes. There is no
// death — mistakes cost score and combo, never the music.



class GameOver extends Scene {
    fontBig;
    fontUi;
    titleText;
    scoreText;
    statsText;
    bestText;
    retryText;
    creditText;
    t = 0;
    preload(load) {
        load.msdfFont(`${FONT_CDN}/bungee.png`, `${FONT_CDN}/bungee.json`);
        load.msdfFont(`${FONT_CDN}/jetbrains-mono.png`, `${FONT_CDN}/jetbrains-mono.json`);
    }
    async setup(data) {
        const g = this.game;
        const pal = TRACK.palette;
        const r = (data ?? { score: 0, best: 0, isBest: false, orbs: 0, nearMisses: 0, distance: 0 });
        this.fontBig = await g.assets.msdfFont(`${FONT_CDN}/bungee.png`, `${FONT_CDN}/bungee.json`);
        this.fontUi = await g.assets.msdfFont(`${FONT_CDN}/jetbrains-mono.png`, `${FONT_CDN}/jetbrains-mono.json`);
        this.titleText = g.assets.msdfText(this.fontBig, 'SONG COMPLETE!', {
            fontSize: 34, color: pal.collectible,
            outline: { width: 0.12, color: '#1a0510' },
        });
        this.scoreText = g.assets.msdfText(this.fontBig, String(r.score), {
            fontSize: 54, color: '#ffffff', outline: { width: 0.1, color: pal.primary },
        });
        this.statsText = g.assets.msdfText(this.fontUi, [`${TRACK.artist} — ${TRACK.title}`,
            `${r.distance}m travelled`, `${r.orbs} orbs · ${r.nearMisses} near misses`,
            `finish bonus +${TRACK.finishBonus}`], { fontSize: 14, color: '#8fa3d9', align: 'center', lineSpacing: 6 });
        this.bestText = g.assets.msdfText(this.fontUi, r.isBest ? '★ NEW BEST ★' : `BEST ${r.best}`, {
            fontSize: 17, color: pal.collectible,
        });
        this.retryText = g.assets.msdfText(this.fontBig, 'TAP TO DASH AGAIN', {
            fontSize: 22, color: '#ffffff', outline: { width: 0.14, color: pal.secondary },
        });
        this.creditText = g.assets.msdfText(this.fontUi, 'made by Forever Humble PDX', {
            fontSize: 11, color: '#7d90c4',
        });
        g.post.add('bloom', { threshold: 0.5, strength: TRACK.baseBloom, radius: 2.5 });
        g.post.add('vignette', { strength: 0.4 });
        this.input.onTap(() => this.gotoPlay());
        this.sound.play({ notes: 'C4 G3 E3 C3:2', step: 0.13, type: 'triangle', volume: 0.45 });
    }
    update(dt) {
        super.update(dt);
        this.t += dt;
        if (this.input.keyPressed('Space', 'Enter'))
            this.gotoPlay();
    }
    draw(d) {
        super.draw(d);
        const pal = TRACK.palette;
        d.rect(0, 0, this.width, this.height, pal.skyTop);
        d.rect(0, this.height * 0.5, this.width, this.height * 0.5, pal.road);
        d.rect(0, this.height * 0.5, this.width, 2, pal.secondary, 0.6);
    }
    drawHud(d) {
        const W = d.w;
        const H = d.h;
        d.msdfText(this.titleText, W / 2, H * 0.16, { origin: { x: 0.5, y: 0.5 } });
        d.msdfText(this.scoreText, W / 2, H * 0.3, { origin: { x: 0.5, y: 0.5 } });
        d.msdfText(this.bestText, W / 2, H * 0.3 + 46, { origin: { x: 0.5 } });
        d.msdfText(this.statsText, W / 2, H * 0.46, { origin: { x: 0.5 } });
        const pulse = 0.75 + Math.sin(this.t * 3.4) * 0.25;
        d.msdfText(this.retryText, W / 2, H * 0.72, { origin: { x: 0.5, y: 0.5 }, alpha: pulse });
        d.msdfText(this.creditText, W / 2, H - 22, { origin: { x: 0.5 }, alpha: 0.85 });
    }
}

// ---- game.js ----
// Game boot — the scene roster + Game.create + run(), and nothing else.
//
// The roster leads with Boot (registered as `intro`, so it runs first): it
// resolves the `?track=` manifest URL — fetching, validating and installing
// the Trackcade release — before Title/Play ever see the track config. With
// no parameter the built-in fallback track plays.







// Game.create is async (it acquires the GPU device — WebGPU, or the built-in
// WebGL2 fallback where WebGPU is absent), so the boot is a top-level await.
// Boot order: the first registered of intro → title → play. Move between
// screens with this.gotoTitle() / gotoPlay() / gotoGameOver(result).
//
// The Boot scene (the Trackcade manifest loader) only joins the roster when a
// `?track=` URL is present — with no parameter the game boots straight to the
// title on the built-in fallback track, exactly as before.
const hasManifest = trackParamFrom(globalThis.location ?? { search: '' }) !== null;
const game = await Game.create({
    ...GAME_OPTIONS,
    scenes: hasManifest
        ? { intro: Boot, title: Title, play: Play, gameOver: GameOver }
        : { title: Title, play: Play, gameOver: GameOver },
});
game.run();

    } catch (e) { showError(e); }
  </script>
